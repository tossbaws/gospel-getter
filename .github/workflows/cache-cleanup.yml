name: Cache cleanup

# Two jobs delete caches nothing restores any more, which otherwise take
# room in the repository's 10 GB, shared by every branch, the least
# recently used evicted first, main's among them.
#
# delete-caches: when a pull request closes, merged or not, the caches its
# runs saved (under refs/pull/<number>/merge), which only a run on that ref
# could restore. Only main saves the Rust caches (save-if in ci.yml and
# dist.yml), but a pull request's runs still save small ones (npm's, and
# the build tools' when a pull request changes their versions).
#
# delete-superseded: main's own caches that a newer one of the same kind
# has superseded, after a CI or Distribution Artifacts run on main (the
# runs that save them), or by hand. A new lockfile or pin saves an entry
# under a new key and leaves the old one, which main's runs never restore
# again. tools/ci/superseded_caches.py says which: in each family (the key
# without its hashes) all but the newest, never one saved with it. It
# prints the keys first; a run by hand with dry-run deletes nothing.
#
# The token can only manage the repository's caches (actions: write).
# delete-superseded checks out tools/ci alone, for the script, without
# keeping the token; delete-caches checks out nothing. A pull request from
# a fork gets a read-only token, so its caches are left to expire (seven
# days unused).

on:
  pull_request:
    types: [closed]
  workflow_run:
    workflows: [CI, Distribution Artifacts]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only list the caches it would delete"
        type: boolean
        default: false

permissions:
  actions: write

jobs:
  delete-caches:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the pull request's caches
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -euo pipefail
          deleted=0
          # A page at a time, until none is left (a few rounds at most).
          for _ in $(seq 1 10); do
            ids="$(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$CACHE_REF" --limit 100 --json id --jq '.[].id')"
            [ -n "$ids" ] || break
            for id in $ids; do
              gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
              deleted=$((deleted + 1))
            done
          done
          echo "Deleted $deleted caches saved under $CACHE_REF."

  delete-superseded:
    # Main's own runs only: workflow_run's branches filter matches a
    # pull request from a fork's branch named main too.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # CI and Distribution Artifacts finish close together: one list and
    # delete at a time, so neither deletes from a list the other has
    # already acted on.
    concurrency:
      group: cache-cleanup-superseded
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci
          persist-credentials: false

      - name: Delete main's superseded caches
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --limit 1000 \
            --json id,key,sizeInBytes,createdAt >"$RUNNER_TEMP/caches.json"
          python3 tools/ci/superseded_caches.py <"$RUNNER_TEMP/caches.json" >"$RUNNER_TEMP/superseded.txt"
          echo "Superseded on refs/heads/main (id bytes key):"
          cat "$RUNNER_TEMP/superseded.txt"
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run: nothing deleted."
            exit 0
          fi
          deleted=0
          while read -r id _ key; do
            # Gone already (deleted by hand, or evicted) is not a failure.
            if gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; then
              echo "Deleted $key"
              deleted=$((deleted + 1))
            else
              echo "::warning title=Cache kept::couldn't delete $id ($key)"
            fi
          done <"$RUNNER_TEMP/superseded.txt"
          echo "Deleted $deleted superseded caches."
