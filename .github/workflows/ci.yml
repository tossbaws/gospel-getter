name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      # The release tools: the update manifest generator and the website's
      # deploy gate (stdlib-only Python).
      - name: Test the release tools
        working-directory: .
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tools/release -v

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri's Linux runtime (webkit2gtk/gtk3) isn't preinstalled on the
      # runner image, and both building and even just `cargo check`/`cargo
      # test` need their headers present to link against.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf build-essential libssl-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (no warnings allowed)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The doc comments' links and code spans resolve (no warnings).
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all-targets

      # Behavior tests for ui/index.html (selection, copy, bookmarks,
      # search, compare), run in jsdom against the real command logic and
      # database through examples/frontend_bridge.rs — built above.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/frontend/package-lock.json

      - name: Frontend behavior tests
        working-directory: tests/frontend
        run: |
          npm ci
          npm test

  # The Rust tests on Windows as well: its own paths (the temporary
  # file's drop order before a rename, opening links with ShellExecute)
  # are otherwise only run by the dist workflow's smoke test.
  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      # The files as committed, not converted to CRLF: tests compare the
      # page's markup and the bundled data byte for byte.
      - name: Keep line endings
        working-directory: .
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Test
        run: cargo test --all-targets
