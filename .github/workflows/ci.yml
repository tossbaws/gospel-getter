name: CI

# Three jobs, in parallel: build-and-test (the Rust checks: formatting,
# Clippy, the backend's build and tests, the page's Rust pieces),
# frontend-tests (the frontend behavior tests, split across two runners)
# and test-windows (the backend's tests on Windows). build-and-test and
# test-windows are required checks on main; keep their names.
#
# It runs on pushes to leptos too, so a pull request into leptos starts
# from leptos's caches: a pull request can only restore caches saved on
# its own ref, its base branch, or main.
#
# Every action is pinned to a commit (Dependabot proposes updates:
# .github/dependabot.yml). CI builds with the current stable Rust; release
# builds pin theirs (RUST_TOOLCHAIN in dist.yml).

on:
  push:
    branches: [main, leptos]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The release tools: the update manifest generator, the installers'
      # signer (dist.yml's sign job) and the website's deploy gate
      # (stdlib-only Python).
      - name: Test the release tools
        working-directory: .
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tools/release -v

      # CI's build tools (tools/ci: what .github/actions/build-tools fetches,
      # and that the other places naming those tools agree with it).
      - name: Test the build tools' pins
        working-directory: .
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tools/ci -v

      # Which AppImage packaging/install.sh installs (nothing is built).
      - name: Test the install script
        working-directory: .
        run: scripts/test-install.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16); the action has no release tags
        with:
          toolchain: stable
          components: rustfmt, clippy
          # The page's Rust pieces (ui-leptos/) compile to WebAssembly.
          targets: wasm32-unknown-unknown

      # Trunk builds the page (ui/index.html with ui-leptos) into dist/,
      # which the app crate embeds, so it runs before anything that builds
      # the app crate. Trunk and the wasm-bindgen and wasm-opt it runs come
      # from a cache, or else with the workflow's token, never anonymously
      # (see .github/actions/build-tools).
      - name: Install Trunk
        uses: ./.github/actions/build-tools
        with:
          set: trunk

      # Tauri's Linux runtime (webkit2gtk/gtk3) isn't preinstalled on the
      # runner image, and both building and even just `cargo check`/`cargo
      # test` need their headers present to link against.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf build-essential libssl-dev

      # Optimized builds of the few dependencies the tests spend their time
      # in; see the file.
      - name: Configure cargo
        working-directory: .
        run: cat .github/ci/cargo-config.toml >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('.github/ci/cargo-config.toml') }}
          workspaces: |
            src-tauri
            ui-leptos

      - name: Check formatting (ui-leptos)
        working-directory: ui-leptos
        run: cargo fmt --all -- --check

      - name: Clippy (ui-leptos, no warnings allowed)
        working-directory: ui-leptos
        run: cargo clippy --locked --target wasm32-unknown-unknown --all-targets -- -D warnings

      # The dialog's pure logic (words, numbers, the filter) is tested on
      # the host; the component itself is tested through the page, in
      # frontend-tests.
      - name: Test (ui-leptos)
        working-directory: ui-leptos
        run: cargo test --locked

      # From ui-leptos/Cargo.lock as committed: Trunk.toml sets locked.
      - name: Build the page (Trunk)
        working-directory: .
        run: trunk build --release

      - name: Check Trunk fetched no tools itself
        working-directory: .
        run: python3 tools/ci/build_tools.py check trunk

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (no warnings allowed)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The build every installer is: no features (the run above has the
      # GUI checks' gui-test-updater on).
      - name: Clippy, default features (no warnings allowed)
        run: cargo clippy --all-targets -- -D warnings

      # The doc comments' links and code spans resolve (no warnings).
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all-targets

      # The doc tests, which --all-targets leaves out: among them the
      # compile_fail ones that keep the CLI's FindingsWriter from writing
      # anything but findings.
      - name: Doc tests
        run: cargo test --doc

  # Behavior tests for ui/index.html and its Rust pieces (selection, copy,
  # bookmarks, search, compare, the notes export), run in jsdom against the
  # real command logic and database through examples/frontend_bridge.rs.
  # Each test file starts its own bridge, which seeds a fresh database, so
  # the files are split across two runners.
  frontend-tests:
    name: frontend-tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16); the action has no release tags
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: ./.github/actions/build-tools
        with:
          set: trunk

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf build-essential libssl-dev

      - name: Configure cargo
        run: cat .github/ci/cargo-config.toml >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"

      # Both shards build the same thing; one saves it.
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('.github/ci/cargo-config.toml') }}
          save-if: ${{ matrix.shard == 1 }}
          workspaces: |
            src-tauri
            ui-leptos

      # What `npm test` builds before it runs the tests (`npm run build`),
      # as steps of their own. Trunk.toml has Trunk build from
      # ui-leptos/Cargo.lock as committed.
      - name: Build the page (Trunk)
        run: trunk build --release

      - name: Check Trunk fetched no tools itself
        run: python3 tools/ci/build_tools.py check trunk

      - name: Build the frontend bridge
        working-directory: src-tauri
        run: cargo build --example frontend_bridge

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/frontend/package-lock.json

      - name: Frontend behavior tests
        working-directory: tests/frontend
        run: |
          npm ci
          npm run test:built -- --test-shard=${{ matrix.shard }}/2

  # The Rust tests on Windows as well: its own paths (the temporary
  # file's drop order before a rename, opening links with ShellExecute)
  # are otherwise only run by the dist workflow's smoke test.
  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      # The files as committed, not converted to CRLF: tests compare the
      # page's markup and the bundled data byte for byte.
      - name: Keep line endings
        working-directory: .
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16); the action has no release tags
        with:
          toolchain: stable
          # Clippy for the GUI checks' crate (tests/gui) below.
          components: clippy
          targets: wasm32-unknown-unknown

      # The app crate embeds the page Trunk builds into dist/, so the
      # page is built before the tests.
      - name: Install Trunk
        uses: ./.github/actions/build-tools
        with:
          set: trunk

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            src-tauri
            ui-leptos
            tests/gui

      # From ui-leptos/Cargo.lock as committed: Trunk.toml sets locked.
      - name: Build the page (Trunk)
        working-directory: .
        run: trunk build --release

      - name: Check Trunk fetched no tools itself
        working-directory: .
        shell: bash
        run: python tools/ci/build_tools.py check trunk

      - name: Test
        run: cargo test --all-targets

      - name: Doc tests
        run: cargo test --doc

      # The GUI checks' own crate, with its Windows-only code (gui-launch's
      # job object, the record of the apps it started): its lints and unit
      # tests. The checks themselves run in dist.yml.
      - name: Clippy and tests (tests/gui)
        working-directory: tests/gui
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
