name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      # The release tools: the update manifest generator and the website's
      # deploy gate (stdlib-only Python).
      - name: Test the release tools
        working-directory: .
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tools/release -v

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # The page's Rust pieces (ui-leptos/) compile to WebAssembly.
          targets: wasm32-unknown-unknown

      # Trunk builds the page (ui/index.html with ui-leptos) into dist/,
      # which the app crate embeds, so it runs before anything that builds
      # the app crate (cargo, and `npm test`, which builds the test bridge).
      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.1
        with:
          version: "v0.21.14"

      # Tauri's Linux runtime (webkit2gtk/gtk3) isn't preinstalled on the
      # runner image, and both building and even just `cargo check`/`cargo
      # test` need their headers present to link against.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf build-essential libssl-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            ui-leptos

      - name: Check formatting (ui-leptos)
        working-directory: ui-leptos
        run: cargo fmt --all -- --check

      - name: Clippy (ui-leptos, no warnings allowed)
        working-directory: ui-leptos
        run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings

      # The dialog's pure logic (words, numbers, the filter) is tested on
      # the host; the component itself is tested through the page, below.
      - name: Test (ui-leptos)
        working-directory: ui-leptos
        run: cargo test

      - name: Build the page (Trunk)
        working-directory: .
        run: trunk build --release

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (no warnings allowed)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all-targets

      # Behavior tests for ui/index.html and its Rust pieces (selection,
      # copy, bookmarks, search, compare, the notes export), run in jsdom
      # against the real command logic and database through
      # examples/frontend_bridge.rs — built above, as is the page.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/frontend/package-lock.json

      - name: Frontend behavior tests
        working-directory: tests/frontend
        run: |
          npm ci
          npm test
