name: Distribution Artifacts

# Builds the actual installers — AppImage + .deb on Linux, an NSIS setup.exe
# and an MSI on Windows — and smoke-tests each one (installed and removed
# again) before uploading it as a workflow artifact. This is separate
# from ci.yml (which only runs cargo fmt/clippy/test/build) because
# bundling is slow and installs system packages. It runs on every push to
# main, on every pull request, and by hand (workflow_dispatch). A release's
# installers come from the run dispatched on its release commit, so the push
# of a release-prep merge (a "chore(release):" commit) builds nothing. A push
# or pull request run cancels the one in progress on its ref; a dispatched
# run is a concurrency group of its own (its run id), so a later push never
# cancels a release build, and the dispatch cancels nothing.
#
# The ci:full label: a pull request that has it runs gui-windows and
# sign-rehearsal too, in its own pull_request run, as a release/ branch's
# does, so a branch needs no run dispatched by hand for them (which built
# everything twice). Adding the label starts that run (pull_request
# "labeled"), which cancels the one in progress on the pull request as a
# push does, and then deletes the run it cancelled (the supersede job, the
# only one here whose token does more than read: actions: write). In that
# run gui-linux was still waiting for linux, so it was cancelled before it
# started, and would stay on the pull request as a failed check under its
# name's expression (see below), which the new run's "GUI checks (Linux)"
# never replaces. Adding any other label (Dependabot labels its pull requests)
# builds nothing: that run's jobs are skipped, it cancels nothing (a group
# of its own, its run id), and the jobs behind the required checks (linux,
# windows, gui-linux) carry other names in it, so a skip, which counts as
# passing, can never stand in for a required check's result. (GitHub shows
# a job that never starts, skipped or cancelled first, under its name's
# expression as written, which is no check's name either.) The release's
# own run (dispatched on main) and its sign job don't look at labels.
#
# Then the GUI checks (scripts/gui-check.sh, tests/gui) drive the built
# app through its own webview with tauri-driver: gui-linux on the AppImage
# for every run, a required check ("GUI checks (Linux)" in the main
# branch's ruleset); gui-windows on the NSIS install only by hand
# (workflow_dispatch), or for a pull request from a release/ branch or with
# the ci:full label, before a release. A failed suite runs once more, whole
# and on fresh data (GUI_CHECK_RETRY): a check that passes only then is
# FLAKY, warned about and listed in the job's summary, which is what keeps
# a flake from blocking a merge without passing for a clean run; a check
# that fails both times fails the job. Their updater checks run on the GUI
# checks' test build of the app (feature gui-test-updater: its updater
# reads a test settings file, talks to the checks' own local server, and
# never installs), which each job builds after its installers are uploaded,
# into an artifact of its own (gui-check-test-app-*). It is never an
# installer and never released; tests/packaging_config.rs fails if any
# installer or packaging build enables the feature.
#
# This workflow never creates a GitHub release, tag, or otherwise publishes
# anything — it only produces downloadable workflow-run artifacts, so a
# human can review real installers before anything goes out the door.
# They're kept 14 days (retention-days), not GitHub's default 90: a release
# publishes within hours of its dispatched run. The GUI-check test apps,
# never released, are kept 7.
#
# These are the installers that update themselves: they're built with
# GOSPEL_GETTER_SELF_UPDATE=1 (read at compile time, see src-tauri/src/
# updater.rs), which no other build of the app has, and the
# tauri.updater.conf.json overlay, but never signed by the build
# (--no-sign): no job that builds anything ever has the updater's signing
# key. Signing, by run:
#   - push, pull request: unsigned installers, no .sig; they can't be
#     released.
#   - dispatched on main (a release, `gh workflow run dist.yml --ref main`):
#     the sign job, the only job that names the key's secrets, runs in the
#     release environment (deployments from main only) once the GUI checks
#     have passed on these very files. It signs each installer as `cargo
#     tauri build` would (tools/release/sign_installers.py: the same .sig,
#     bound to the app's version), checks each signature is by the app's
#     key, checks each installer is byte for byte what was built (its
#     SHA-256, recorded before signing), makes the update manifest from
#     them as a dry run, and uploads each installer with its .sig and its
#     SHA-256 (INSTALLER-SHA256SUMS) as an artifact of its own, the build
#     artifact's name with -signed after it, for tools/release/README.md's
#     publishing. The build's own artifacts are never replaced, so a sign
#     job that fails can be re-run (Re-run failed jobs) on them as built.
#   - dispatched on another branch, or a pull request from a release/
#     branch or with the ci:full label: unsigned, and sign-rehearsal does
#     all of that with a throwaway key made for the run instead, uploading
#     nothing, so a change to the signing is tried before it reaches a
#     release. ci:full never reaches the sign job.
#
# Every action is pinned to a commit (Dependabot proposes updates:
# .github/dependabot.yml), and every job builds with one Rust release,
# RUST_TOOLCHAIN below. Only main's runs save the Rust caches (save-if, as
# in ci.yml); every other run restores main's. Every job has a time limit
# (timeout-minutes, about three times its slowest green run, more where a
# cold cache needs it), so a hung runner fails in minutes, not after
# GitHub's six hours; apt-get retries a failed download and gives up on a
# silent mirror, in a step with a time limit of its own.
#
# Every installer carries gospel-getter-cli beside the app, as a Tauri sidecar
# (bundle.externalBin, in the tauri.sidecar.conf.json overlay, since tauri-build
# wants the file there on every build it's named for): built first, and named
# for its target as Tauri asks. The app never runs it. An AppImage's sidecar
# can't be reached from a shell, so it's also uploaded on its own, as an
# artifact (gospel-getter-cli-*) that a release attaches.

on:
  push:
    branches: [main]
  pull_request:
    # The defaults, and labeled: adding ci:full starts a run (see the top).
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

# A dispatched run, and a run for a label other than ci:full, are groups of
# their own: they cancel nothing.
concurrency:
  group: dist-${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || (github.event.action == 'labeled' && github.event.label.name != 'ci:full')) && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  # Exactly: the bundler's tools are pinned for this version
  # (tools/ci/build-tools.txt, set bundler), and a version with none pinned
  # stops the build.
  TAURI_CLI_VERSION: "2.12.4"
  # The Rust every job here builds with, so a release is built by a known
  # compiler rather than whatever is stable that day. ci.yml builds with
  # the same one (its RUST_TOOLCHAIN; src-tauri/tests/packaging_config.rs
  # fails if they differ): move both on together, in one pull request, so
  # CI is green on the new one before a release is built with it.
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  supersede:
    # The ci:full label's run only (see the top of this file): deletes the
    # run it cancelled, with that run's checks. Only a Distribution run
    # (this workflow) for this pull request's head commit, older than this
    # one, that ended cancelled: never one that passed or failed, another
    # commit's, or another workflow's (CI's). One still being cancelled is
    # waited for, two minutes at most. Its token can manage the
    # repository's runs and nothing else, and it checks out nothing.
    # Nothing waits for it, and it never fails the run: a token that can't
    # delete (a fork's, which is read-only) is a warning.
    name: Delete the run ci:full superseded
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'ci:full'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Delete this pull request's cancelled Distribution runs
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -uo pipefail
          # This workflow's pull_request runs for the head commit, older
          # than this one: "id status conclusion" each.
          older() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/dist.yml/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=100" \
              --jq '.workflow_runs[]
                | select(.path == ".github/workflows/dist.yml" and .event == "pull_request"
                    and .head_sha == env.HEAD_SHA and .run_number < (env.RUN_NUMBER | tonumber))
                | "\(.id) \(.status) \(.conclusion)"'
          }
          pending=""
          for try in $(seq 1 12); do
            if ! runs="$(older)"; then
              echo "::warning title=Superseded run kept::couldn't list this pull request's Distribution runs"
              exit 0
            fi
            pending="$(awk 'NF && $2 != "completed"' <<<"$runs")"
            [ -n "$pending" ] || break
            if [ "$try" -lt 12 ]; then
              echo "Waiting for a run still being cancelled: $pending"
              sleep 10
            fi
          done
          echo "Older Distribution runs for $HEAD_SHA (id status conclusion):"
          echo "${runs:-none}"
          if [ -n "$pending" ]; then
            echo "::warning title=Superseded run kept::still in progress after two minutes, so left as it is: $pending"
          fi
          deleted=0
          for id in $(awk '$2 == "completed" && $3 == "cancelled" { print $1 }' <<<"$runs"); do
            if gh run delete "$id" --repo "$GITHUB_REPOSITORY"; then
              echo "Deleted run $id: cancelled, superseded by this one."
              deleted=$((deleted + 1))
            else
              echo "::warning title=Superseded run kept::couldn't delete run $id (a read-only token, as a fork's?)"
            fi
          done
          echo "Deleted $deleted superseded run(s)."

  linux:
    # A required check by this name; another in a run for a label other
    # than ci:full, which builds nothing (see the top of this file).
    name: ${{ (github.event.action != 'labeled' || github.event.label.name == 'ci:full') && 'Linux (AppImage + deb)' || 'Linux (AppImage + deb), not run for this label' }}
    # Not on the push of a release-prep merge: the release's installers come
    # from the run dispatched on the same commit (see the top of this file).
    # Nor for a label other than ci:full.
    if: (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')) && (github.event.action != 'labeled' || github.event.label.name == 'ci:full')
    # Tauri's own Linux packaging guidance is to build on the oldest
    # supported Ubuntu LTS, not `ubuntu-latest`: the AppImage/deb bundler
    # links against the build host's glibc/webkit2gtk, and a binary built
    # on a newer Ubuntu won't run on an older one. 22.04 is Tauri's
    # documented minimum baseline for the current AppImage/deb tooling.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16); the action has no release tags
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          # The page's Rust pieces (ui-leptos/) compile to WebAssembly.
          targets: wasm32-unknown-unknown

      # `cargo tauri build` runs Trunk first (build.beforeBuildCommand in
      # tauri.conf.json) to build the page into dist/. Trunk and the
      # wasm-bindgen and wasm-opt it runs come from a cache, or else with the
      # workflow's token, never anonymously (see .github/actions/build-tools).
      - name: Install Trunk
        uses: ./.github/actions/build-tools
        with:
          set: trunk

      # webkit2gtk/gtk3 headers to build against, plus the bundling
      # toolchain: patchelf (rpath rewriting), libfuse2 (AppImages are
      # FUSE-mounted at bundle time), and xvfb (to launch the built app
      # headlessly for the smoke test below).
      - name: Install Tauri Linux build & bundling dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=60
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=60 \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            patchelf build-essential libssl-dev libfuse2 xvfb file

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            src-tauri
            ui-leptos

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked

      # What the bundler would download for the AppImage (linuxdeploy, its
      # AppImage plugin, AppRun), the same way as Trunk above.
      - name: Install the bundler's tools
        uses: ./.github/actions/build-tools
        with:
          set: bundler

      # Stripped: nothing else strips it, and a backtrace on it has no use.
      - name: Build the CLI sidecar
        run: |
          set -euo pipefail
          cargo build --release --locked -p gospel-getter-cli
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p binaries
          strip -o "binaries/gospel-getter-cli-$triple" target/release/gospel-getter-cli

      # Unsigned on every run (see the top of this file): the sign job signs
      # these very files on a run dispatched on main.
      - name: Build AppImage and deb bundles
        env:
          GOSPEL_GETTER_SELF_UPDATE: "1"
        run: |
          cargo tauri build --bundles appimage,deb --config tauri.sidecar.conf.json --config tauri.updater.conf.json --no-sign

      - name: Check the build fetched no tools itself
        working-directory: .
        run: python3 tools/ci/build_tools.py check trunk bundler

      - name: Locate built artifacts
        id: artifacts
        run: |
          set -euo pipefail
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage')"
          deb="$(find target/release/bundle/deb -maxdepth 1 -name '*.deb')"
          if [ -z "$appimage" ]; then
            echo "::error::cargo tauri build did not produce an .AppImage under target/release/bundle/appimage"
            exit 1
          fi
          if [ -z "$deb" ]; then
            echo "::error::cargo tauri build did not produce a .deb under target/release/bundle/deb"
            exit 1
          fi
          # Resolve to absolute paths: a bare relative path (no leading
          # `./` or `/`) is ambiguous to apt-get, which parses a plain
          # `a/b/c` argument as `package/release` syntax rather than a
          # filesystem path — it would try (and fail) to install a
          # package literally named "target/release/bundle/deb" instead
          # of the .deb file that path points to.
          appimage="$(realpath "$appimage")"
          deb="$(realpath "$deb")"
          echo "appimage=$appimage" >> "$GITHUB_OUTPUT"
          echo "deb=$deb" >> "$GITHUB_OUTPUT"

      - name: "Smoke test: AppImage extracts and launches without crashing"
        run: |
          set -euo pipefail
          appimage="${{ steps.artifacts.outputs.appimage }}"
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          squashfs-root/usr/bin/gospel-getter-cli --version

          xvfb-run --auto-servernum ./squashfs-root/AppRun &
          app_pid=$!
          sleep 5
          if ! kill -0 "$app_pid" 2>/dev/null; then
            echo "::error::the AppImage's app process exited within 5s of launch (crash on startup)"
            exit 1
          fi
          echo "AppImage launched and is still running after 5s (pid $app_pid)"
          kill "$app_pid"
          wait "$app_pid" 2>/dev/null || true

      # The AppImage bundles this host's WebKitGTK, and the WebKit crash on
      # exit (#162, fixed in 2.54.1) is waiting on Ubuntu to ship the fix.
      # Every build reports its version so we notice when that arrives. For
      # information only: the default shell runs with -e, hence `set +e`.
      - name: Report bundled WebKitGTK version
        continue-on-error: true
        run: |
          set +e
          package_version="$(dpkg-query -W -f='${Version}' libwebkit2gtk-4.1-0 2>/dev/null || echo "unknown")"
          package_version="${package_version:-unknown}"
          pkgconfig_version="$(pkg-config --modversion webkit2gtk-4.1 2>/dev/null || echo "unknown")"
          pkgconfig_version="${pkgconfig_version:-unknown}"
          echo "Build host package libwebkit2gtk-4.1-0: $package_version"
          echo "Build host pkg-config webkit2gtk-4.1: $pkgconfig_version"

          if [ -d squashfs-root ]; then
            find squashfs-root -name 'libwebkit2gtk-4.1.so*' -ls 2>/dev/null
            # Resolving the .so symlinks leaves the name with the soname version.
            bundled_files="$(find squashfs-root -name 'libwebkit2gtk-4.1.so*' -exec readlink -f {} + 2>/dev/null \
              | sed 's|.*/||' | sort -u | paste -sd ' ' - || echo "unknown")"
            bundled_files="${bundled_files:-none (the AppImage may rely on the system WebKit)}"
          else
            bundled_files="unknown (no squashfs-root)"
          fi
          echo "WebKit libraries in the AppImage: $bundled_files"

          echo "::notice title=Bundled WebKitGTK::libwebkit2gtk-4.1-0 $package_version (pkg-config $pkgconfig_version), AppImage files: $bundled_files"
          {
            echo "### Bundled WebKitGTK"
            echo
            echo "- Package version (libwebkit2gtk-4.1-0): $package_version"
            echo "- pkg-config version (webkit2gtk-4.1): $pkgconfig_version"
            echo "- Library files in the AppImage: $bundled_files"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          exit 0

      - name: "Smoke test: .deb installs and uninstalls cleanly"
        timeout-minutes: 15
        run: |
          set -euo pipefail
          deb="${{ steps.artifacts.outputs.deb }}"
          pkg_name="$(dpkg-deb -f "$deb" Package)"
          echo "Package name: $pkg_name"

          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=60 "$deb"
          dpkg -s "$pkg_name" | grep -q '^Status: install ok installed'

          owned_files="$(dpkg -L "$pkg_name")"
          echo "$owned_files" | grep -q '/usr/bin/' \
            || { echo "::error::package installs no file under /usr/bin"; exit 1; }
          echo "$owned_files" | grep -q '\.desktop$' \
            || { echo "::error::package installs no .desktop launcher"; exit 1; }
          echo "$owned_files" | grep -qx '/usr/bin/gospel-getter-cli' \
            || { echo "::error::package installs no gospel-getter-cli on PATH"; exit 1; }
          gospel-getter-cli --version

          sudo apt-get remove -y "$pkg_name"
          if dpkg -s "$pkg_name" 2>/dev/null | grep -q '^Status: install ok installed'; then
            echo "::error::package still reports installed after apt-get remove"
            exit 1
          fi
          echo ".deb installed and removed cleanly"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gospel-getter-linux-appimage
          path: ${{ steps.artifacts.outputs.appimage }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload deb artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gospel-getter-linux-deb
          path: ${{ steps.artifacts.outputs.deb }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload the CLI on its own
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gospel-getter-cli-linux-x86_64
          path: src-tauri/binaries/gospel-getter-cli-x86_64-unknown-linux-gnu
          if-no-files-found: error
          retention-days: 14

      # Last, after the installers above are uploaded: the GUI checks' test
      # build (see the top of this file), for gui-linux's updater checks.
      - name: Build the GUI-check test app
        run: |
          set -euo pipefail
          cargo build --release --locked --features gui-test-updater
          mkdir -p "$RUNNER_TEMP/gui-check-test-app"
          cp target/release/gospel_getter "$RUNNER_TEMP/gui-check-test-app/"

      - name: Upload the GUI-check test app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-check-test-app-linux
          path: ${{ runner.temp }}/gui-check-test-app
          if-no-files-found: error
          retention-days: 7

  windows:
    # A required check by this name, as for the linux job.
    name: ${{ (github.event.action != 'labeled' || github.event.label.name == 'ci:full') && 'Windows (NSIS installer)' || 'Windows (NSIS installer), not run for this label' }}
    # Not on the push of a release-prep merge, nor for a label other than
    # ci:full, as for the linux job.
    if: (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')) && (github.event.action != 'labeled' || github.event.label.name == 'ci:full')
    runs-on: windows-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16); the action has no release tags
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          # The page's Rust pieces (ui-leptos/) compile to WebAssembly.
          targets: wasm32-unknown-unknown

      # `cargo tauri build` runs Trunk first (build.beforeBuildCommand in
      # tauri.conf.json) to build the page into dist/. Trunk and the
      # wasm-bindgen and wasm-opt it runs come from a cache, or else with the
      # workflow's token, never anonymously (see .github/actions/build-tools).
      - name: Install Trunk
        uses: ./.github/actions/build-tools
        with:
          set: trunk

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            src-tauri
            ui-leptos

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked

      # What the bundler would download for the installers (NSIS with its
      # nsis_tauri_utils plugin, and WiX), the same way as Trunk above.
      - name: Install the bundler's tools
        uses: ./.github/actions/build-tools
        with:
          set: bundler

      # Static, so it starts on a Windows without the Visual C++ runtime, as the
      # app does: tauri-build links the app's statically, and this program has
      # no tauri-build. This runner has that runtime, so running the program
      # can't show it's needed. What the program imports can.
      - name: Build the CLI sidecar
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked -p gospel-getter-cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { Write-Error "dumpbin wasn't found, so the CLI's imports can't be checked"; exit 1 }
          $imports = & $dumpbin /nologo /dependents target\release\gospel-getter-cli.exe
          if ($LASTEXITCODE -ne 0 -or -not ($imports -match 'KERNEL32')) { Write-Error "Couldn't read the CLI's imports: $imports"; exit 1 }
          if ($imports -match 'VCRUNTIME|MSVCP') { Write-Error "The CLI needs the Visual C++ runtime: $imports"; exit 1 }
          Write-Host "The CLI's imports: $($imports -match '\.dll' | ForEach-Object { $_.Trim() })"
          $triple = (rustc -vV | Select-String '^host: ').Line.Substring(6).Trim()
          New-Item -ItemType Directory -Force binaries | Out-Null
          Copy-Item target/release/gospel-getter-cli.exe "binaries/gospel-getter-cli-$triple.exe"

      # bundle.targets is "all" in tauri.conf.json, so this produces both
      # an NSIS setup.exe and an MSI on Windows. Unsigned on every run, as
      # for the linux job.
      - name: Build Windows installers
        shell: pwsh
        env:
          GOSPEL_GETTER_SELF_UPDATE: "1"
        run: |
          cargo tauri build --config tauri.sidecar.conf.json --config tauri.updater.conf.json --no-sign
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the build fetched no tools itself
        working-directory: .
        shell: bash
        run: python tools/ci/build_tools.py check trunk bundler

      - name: Locate built artifacts
        id: artifacts
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -Path "target/release/bundle/nsis" -Filter *.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) {
            Write-Error "cargo tauri build did not produce an NSIS setup.exe under target/release/bundle/nsis"
            exit 1
          }
          "nsis=$($nsis.FullName)" >> $env:GITHUB_OUTPUT

          # A release needs the MSI as much as the setup.exe (its update
          # manifest names both: tools/release/make_latest_json.py).
          $msi = Get-ChildItem -Path "target/release/bundle/msi" -Filter *.msi -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) {
            Write-Error "cargo tauri build did not produce an MSI under target/release/bundle/msi"
            exit 1
          }
          "msi=$($msi.FullName)" >> $env:GITHUB_OUTPUT

      - name: "Smoke test: silent install and uninstall (NSIS)"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "${{ steps.artifacts.outputs.nsis }}"

          Write-Host "Running silent install: $exe /S"
          Start-Process -FilePath $exe -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5

          $uninstallRoots = @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall"
          )
          $entry = Get-ChildItem $uninstallRoots -ErrorAction SilentlyContinue |
            Get-ItemProperty -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "*Gospel Getter*" } |
            Select-Object -First 1

          if (-not $entry) {
            Write-Error "No uninstall registry entry for Gospel Getter found after a silent install — install likely failed."
            exit 1
          }
          Write-Host "Registered: $($entry.DisplayName) v$($entry.DisplayVersion)"
          Write-Host "Install location: $($entry.InstallLocation)"
          if ($entry.InstallLocation -and (Test-Path $entry.InstallLocation)) {
            Write-Host "Install directory contents:"
            Get-ChildItem $entry.InstallLocation | Format-Table Name, Length
          }
          # NSIS writes InstallLocation in quotes. The sidecar is beside the
          # app and prints in a terminal: a console program, unlike the app.
          $location = "$($entry.InstallLocation)".Trim('"')
          $printed = & (Join-Path $location "gospel-getter-cli.exe") --version
          if ($LASTEXITCODE -ne 0 -or -not ($printed -match '^gospel-getter-cli ')) {
            Write-Error "gospel-getter-cli.exe isn't beside the app, or printed nothing: '$printed'"
            exit 1
          }
          Write-Host "Sidecar: $printed"

          $uninstallExe = $entry.UninstallString.Trim('"')
          Write-Host "Running silent uninstall: $uninstallExe /S"
          Start-Process -FilePath $uninstallExe -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5

          $stillThere = Get-ChildItem $uninstallRoots -ErrorAction SilentlyContinue |
            Get-ItemProperty -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "*Gospel Getter*" }
          if ($stillThere) {
            Write-Error "Uninstall registry entry for Gospel Getter is still present after a silent uninstall."
            exit 1
          }
          Write-Host "Silent install/uninstall smoke test passed."

      # The MSI the same way, once the NSIS install above is gone: Windows
      # Installer's own uninstall entry (WindowsInstaller = 1), the sidecar
      # beside the app, and nothing left registered after msiexec /x.
      - name: "Smoke test: silent install and uninstall (MSI)"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = "${{ steps.artifacts.outputs.msi }}"
          $log = Join-Path $env:RUNNER_TEMP "msi-install.log"
          # 3010: done, a restart would finish it (nothing here needs one).
          $done = @(0, 3010)

          Write-Host "Running silent install: msiexec /i $msi /qn"
          # Start-Process joins its arguments with spaces: the paths are
          # quoted here (the MSI's name has a space in it).
          $install = Start-Process -FilePath msiexec.exe -ArgumentList "/i", "`"$msi`"", "/qn", "/norestart", "/l*v", "`"$log`"" -Wait -PassThru
          if ($done -notcontains $install.ExitCode) {
            if (Test-Path $log) { Get-Content $log -Tail 60 }
            Write-Error "msiexec /i exited with $($install.ExitCode)"
            exit 1
          }

          $uninstallRoots = @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall"
          )
          $msiEntries = {
            Get-ChildItem $uninstallRoots -ErrorAction SilentlyContinue |
              Get-ItemProperty -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like "*Gospel Getter*" -and $_.WindowsInstaller -eq 1 }
          }
          $entry = & $msiEntries | Select-Object -First 1
          if (-not $entry) {
            Write-Error "No Windows Installer uninstall entry for Gospel Getter after msiexec /i: the install likely failed."
            exit 1
          }
          Write-Host "Registered: $($entry.DisplayName) v$($entry.DisplayVersion) ($($entry.PSChildName))"
          $location = "$($entry.InstallLocation)".Trim('"')
          if (-not $location -or -not (Test-Path -LiteralPath $location -PathType Container)) {
            Write-Error "the install location '$($entry.InstallLocation)' isn't a folder"
            exit 1
          }
          Write-Host "Install directory contents:"
          Get-ChildItem -LiteralPath $location | Format-Table Name, Length
          $printed = & (Join-Path $location "gospel-getter-cli.exe") --version
          if ($LASTEXITCODE -ne 0 -or -not ($printed -match '^gospel-getter-cli ')) {
            Write-Error "gospel-getter-cli.exe isn't beside the app, or printed nothing: '$printed'"
            exit 1
          }
          Write-Host "Sidecar: $printed"

          Write-Host "Running silent uninstall: msiexec /x $msi /qn"
          $remove = Start-Process -FilePath msiexec.exe -ArgumentList "/x", "`"$msi`"", "/qn", "/norestart" -Wait -PassThru
          if ($done -notcontains $remove.ExitCode) {
            Write-Error "msiexec /x exited with $($remove.ExitCode)"
            exit 1
          }
          if (& $msiEntries) {
            Write-Error "The Windows Installer uninstall entry for Gospel Getter is still present after msiexec /x."
            exit 1
          }
          Write-Host "MSI install/uninstall smoke test passed."

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gospel-getter-windows-nsis-installer
          path: ${{ steps.artifacts.outputs.nsis }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload MSI installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gospel-getter-windows-msi-installer
          path: ${{ steps.artifacts.outputs.msi }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload the CLI on its own
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gospel-getter-cli-windows-x86_64
          path: src-tauri/binaries/gospel-getter-cli-x86_64-pc-windows-msvc.exe
          if-no-files-found: error
          retention-days: 14

      # Last, after the installers above are uploaded, and only when
      # gui-windows runs: the GUI checks' test build (see the top of this
      # file), for its updater checks.
      - name: Build the GUI-check test app
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'ci:full')))
        shell: pwsh
        run: |
          cargo build --release --locked --features gui-test-updater
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/gui-check-test-app" | Out-Null
          Copy-Item target/release/gospel_getter.exe "$env:RUNNER_TEMP/gui-check-test-app/"

      - name: Upload the GUI-check test app
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'ci:full')))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-check-test-app-windows
          path: ${{ runner.temp }}/gui-check-test-app
          if-no-files-found: error
          retention-days: 7

  gui-linux:
    # A required check by this name, as for the linux job.
    name: ${{ (github.event.action != 'labeled' || github.event.label.name == 'ci:full') && 'GUI checks (Linux)' || 'GUI checks (Linux), not run for this label' }}
    # The AppImage the linux job built, driven through its own webview by
    # tauri-driver and WebKitWebDriver on a private Xvfb display. A required
    # check (see the top of this file for how a flake is kept from blocking
    # a merge). The AppImage is tested as shipped: the script has its own
    # runtime extract it (--appimage-extract, so no FUSE) and starts its
    # AppRun.
    needs: linux
    # The same Ubuntu as the build: the AppImage was built against its
    # WebKitGTK, and webkit2gtk-driver comes from it.
    runs-on: ubuntu-22.04
    # Room for the whole suite twice (GUI_CHECK_RETRY below).
    timeout-minutes: 25
    env:
      # A CI runner is slower than a desktop; still bounded.
      GUI_CHECK_BUDGET: "300"
      GUI_CHECK_STEP_TIMEOUT: "20"
      # A failed suite runs once more, whole and on fresh data; a check that
      # passes only the second time is FLAKY, with a warning and a line in
      # the job's summary, never a clean pass (scripts/gui-check.sh).
      GUI_CHECK_RETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16); the action has no release tags
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      # ImageMagick: a picture of the private display when a check fails
      # (the native dialogs, which WebDriver can't see).
      # The test build is a plain binary (not an AppImage), so it runs on
      # the system's WebKitGTK and GTK.
      - name: Install Xvfb, xdotool, WebKitWebDriver, ImageMagick and the app's runtime
        timeout-minutes: 15
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=60
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=60 xvfb xdotool webkit2gtk-driver dbus imagemagick \
            libwebkit2gtk-4.1-0 libgtk-3-0

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: tests/gui

      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked

      # The checks' own crate: formatting, lints and its unit tests (ci.yml's
      # test-windows does the same on Windows, for its Windows code).
      - name: Check formatting and lints, and test (tests/gui)
        working-directory: tests/gui
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Download the AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gospel-getter-linux-appimage
          path: appimage

      - name: Download the GUI-check test app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gui-check-test-app-linux
          path: gui-check-test-app

      - name: Run the GUI checks on the AppImage (and the updater's on the test app)
        run: |
          set -euo pipefail
          appimage="$(find appimage -maxdepth 1 -name '*.AppImage' | head -1)"
          if [ -z "$appimage" ]; then
            echo "::error::no AppImage in the downloaded artifact"
            exit 1
          fi
          chmod +x gui-check-test-app/gospel_getter
          GUI_CHECK_UPDATER_APP="$PWD/gui-check-test-app/gospel_getter" \
            scripts/gui-check.sh "$appimage" "$RUNNER_TEMP/gui-check"

      # Both attempts' results.txt and screenshots when the suite ran twice
      # (the first in attempt-1/).
      - name: Upload the results and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-check-linux
          path: ${{ runner.temp }}/gui-check
          if-no-files-found: warn
          retention-days: 14

  gui-windows:
    name: GUI checks (Windows)
    # The NSIS installer the windows job built, installed silently and
    # driven through WebView2 by tauri-driver and Edge WebDriver. Before a
    # release only: by hand, or for a pull request from a release/ branch or
    # with the ci:full label.
    # Windows has no private display, so this runs on the runner's desktop;
    # the native save-dialog step stops at "the dialog appeared" (UI
    # Automation finds and closes it).
    needs: windows
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'ci:full')))
    runs-on: windows-latest
    # Room for the whole suite twice (GUI_CHECK_RETRY below).
    timeout-minutes: 30
    env:
      GUI_CHECK_BUDGET: "300"
      GUI_CHECK_STEP_TIMEOUT: "20"
      # As for gui-linux; the retry deletes the app's data folders first.
      GUI_CHECK_RETRY: "1"
      # The app's window comes up about 10s after launch on a cold runner.
      GUI_CHECK_SESSION_TIMEOUT: "60"
      # The installed app's program, as the windows job builds it
      # (target/release/gospel_getter.exe).
      GUI_EXE: gospel_getter.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16); the action has no release tags
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: tests/gui

      # Tauri's WebDriver CI guidance: msedgedriver-tool fetches the Edge
      # WebDriver matching the installed WebView2 runtime (pinned here).
      - name: Install tauri-driver and a matching Edge WebDriver
        shell: bash
        run: |
          set -euo pipefail
          cargo install tauri-driver --version 2.1.0 --locked
          cargo install --git https://github.com/chippers/msedgedriver-tool \
            --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --locked
          mkdir -p "$RUNNER_TEMP/msedgedriver"
          cd "$RUNNER_TEMP/msedgedriver"
          msedgedriver-tool
          ./msedgedriver.exe --version
          cygpath -w "$PWD" >> "$GITHUB_PATH"

      - name: Download the NSIS installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gospel-getter-windows-nsis-installer
          path: nsis

      - name: Install the app (silent NSIS install)
        id: install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem -Path nsis -Filter *.exe | Select-Object -First 1
          if (-not $setup) { Write-Error "no setup .exe in the downloaded artifact"; exit 1 }
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $entry = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall", "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue |
            Get-ItemProperty -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "*Gospel Getter*" } |
            Select-Object -First 1
          if (-not $entry) { Write-Error "Gospel Getter isn't registered after a silent install"; exit 1 }
          # NSIS writes InstallLocation in quotes.
          $location = "$($entry.InstallLocation)".Trim('"')
          if (-not $location -or -not (Test-Path -LiteralPath $location -PathType Container)) {
            Write-Error "the install location '$($entry.InstallLocation)' isn't a folder"; exit 1
          }
          # The app by its known name, never by the folder's order: the app
          # crate's binary (tauri.conf.json sets no mainBinaryName), beside the
          # CLI sidecar and the uninstaller. Any other program there makes the
          # layout ambiguous, so it stops here rather than guess.
          $programs = @(Get-ChildItem -LiteralPath $location -Filter *.exe -File | ForEach-Object Name)
          $expected = @($env:GUI_EXE, "gospel-getter-cli.exe", "uninstall.exe")
          Write-Host "Programs in ${location}: $($programs -join ', ')"
          if ($programs -notcontains $env:GUI_EXE) {
            Write-Error "the app's $env:GUI_EXE isn't in $location (found: $($programs -join ', '))"; exit 1
          }
          $unexpected = @($programs | Where-Object { $expected -notcontains $_ })
          if ($unexpected.Count -gt 0) {
            Write-Error "unexpected programs beside the app in ${location}: $($unexpected -join ', '); which is the app is ambiguous"; exit 1
          }
          $exe = Get-Item -LiteralPath (Join-Path $location $env:GUI_EXE)
          Write-Host "Installed: $($exe.FullName)"
          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      # Edge WebDriver asks WebView2 for a debugging port through
      # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS. Since WebView2 Runtime 150 an
      # elevated host app (as everything on this runner is) ignores that
      # variable and the HKCU policy; only the HKLM policy and the app's own
      # arguments count (MicrosoftEdge/WebView2Feedback#5645). Without the
      # port the session never starts ("DevToolsActivePort file doesn't
      # exist"). Port 0: the browser picks one and writes it to
      # DevToolsActivePort in Edge WebDriver's user-data folder, where the
      # driver looks. Machine policy, so here on the throwaway runner only.
      - name: Let WebView2 open a debugging port for the app (HKLM policy)
        shell: pwsh
        env:
          APP_EXE: ${{ steps.install.outputs.exe }}
        run: |
          $ErrorActionPreference = "Stop"
          $key = "HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments"
          New-Item -Path $key -Force | Out-Null
          $name = Split-Path -Leaf $env:APP_EXE
          New-ItemProperty -Path $key -Name $name -Value "--remote-debugging-port=0" -PropertyType String -Force | Out-Null
          Get-ItemProperty -Path $key | Format-List

      - name: Download the GUI-check test app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gui-check-test-app-windows
          path: gui-check-test-app

      # Named as the installed app is, so the WebView2 policy above (keyed
      # by the program's file name) lets Edge WebDriver reach it too.
      - name: Run the GUI checks on the installed app (and the updater's on the test app)
        shell: bash
        env:
          APP_EXE: ${{ steps.install.outputs.exe }}
        run: |
          set -euo pipefail
          tmp="$(cygpath -u "$RUNNER_TEMP")"
          name="$(basename "$(cygpath -u "$APP_EXE")")"
          mkdir -p "$tmp/gui-check-test-app"
          cp gui-check-test-app/gospel_getter.exe "$tmp/gui-check-test-app/$name"
          GUI_CHECK_UPDATER_APP="$tmp/gui-check-test-app/$name" \
            scripts/gui-check.sh "$(cygpath -u "$APP_EXE")" "$tmp/gui-check"

      # Both attempts', as for gui-linux.
      - name: Upload the results and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-check-windows
          path: ${{ runner.temp }}/gui-check
          if-no-files-found: warn
          retention-days: 14

  # The release's updater signatures (see the top of this file): only on a
  # run dispatched on main, and only once both platforms' GUI checks have
  # passed on the very files it signs. It downloads the four build
  # artifacts by their exact names (never a -signed one, which a pattern
  # such as gospel-getter-linux-* would also take) and uploads each signed
  # as <name>-signed, leaving the build's artifacts as they were: a re-run
  # of a failed attempt signs them again, and replaces whatever -signed
  # artifacts that attempt uploaded. The only job that names the signing
  # key's secrets; it builds nothing of the repository's.
  sign:
    name: Sign the installers (release)
    needs: [linux, windows, gui-linux, gui-windows]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The signer is tauri-apps' own prebuilt cargo-tauri for
      # TAURI_CLI_VERSION, from its tauri-cli-vX.Y.Z release, pinned by
      # SHA-256 (tools/ci/build-tools.txt, set signer), not tauri-cli
      # compiled from crates.io here, which took 5-6 minutes on every
      # release in a job with no build cache. A cached copy is acceptable
      # in this job, which holds the key, because the action checks every
      # file against its pinned SHA-256 on every run, a cache hit too, and
      # a file that doesn't match stops the job before anything runs it.
      # No Rust is installed: nothing here compiles, and the runner's own
      # cargo only hands `cargo tauri` to the cargo-tauri on PATH, which
      # the next step checks is the pinned one, at TAURI_CLI_VERSION.
      - name: Get the signer (Tauri's prebuilt CLI, pinned by SHA-256)
        uses: ./.github/actions/build-tools
        with:
          set: signer

      - name: Check the signer is the pinned one
        run: |
          set -euo pipefail
          want="$RUNNER_TEMP/build-tools/bin/cargo-tauri"
          found="$(command -v cargo-tauri || true)"
          # cargo runs a cargo-tauri in its own bin folder before one on PATH.
          shadow="${CARGO_HOME:-$HOME/.cargo}/bin/cargo-tauri"
          version="$(cargo tauri --version)"
          echo "signer: cargo tauri --version: $version, at ${found:-nowhere} ($(cargo --version))"
          if [ "$found" != "$want" ] || [ -e "$shadow" ]; then
            echo "::error::cargo tauri isn't the pinned signer at $want: cargo-tauri on PATH is ${found:-none}, $shadow $([ -e "$shadow" ] && echo exists || echo 'is absent')"
            exit 1
          fi
          if [ "$version" != "tauri-cli $TAURI_CLI_VERSION" ]; then
            echo "::error::cargo tauri --version printed '$version', not 'tauri-cli $TAURI_CLI_VERSION'"
            exit 1
          fi

      # The build's four artifacts by name, each into a folder of that
      # name (sign_installers.py's layout).
      - name: Download the AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gospel-getter-linux-appimage
          path: installers/gospel-getter-linux-appimage

      - name: Download the deb
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gospel-getter-linux-deb
          path: installers/gospel-getter-linux-deb

      - name: Download the NSIS installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gospel-getter-windows-nsis-installer
          path: installers/gospel-getter-windows-nsis-installer

      - name: Download the MSI installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gospel-getter-windows-msi-installer
          path: installers/gospel-getter-windows-msi-installer

      - name: Sign the installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tools/release/sign_installers.py installers

      # Each installer with its .sig and INSTALLER-SHA256SUMS beside it, as
      # the -signed artifact a release takes it from (tools/release/
      # README.md). Never under a build artifact's own name. overwrite: a
      # re-run of this job replaces what a failed attempt uploaded, always
      # from the build's artifacts as they were.
      - name: Upload the signed AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gospel-getter-linux-appimage-signed
          path: installers/gospel-getter-linux-appimage/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Upload the signed deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gospel-getter-linux-deb-signed
          path: installers/gospel-getter-linux-deb/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Upload the signed NSIS installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gospel-getter-windows-nsis-installer-signed
          path: installers/gospel-getter-windows-nsis-installer/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Upload the signed MSI installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gospel-getter-windows-msi-installer-signed
          path: installers/gospel-getter-windows-msi-installer/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # The sign job's steps on a run that can't be released, with a key made
  # for the run in place of the release's (and checked against its own
  # public key): a run dispatched on another branch, or a pull request from
  # a release/ branch or with the ci:full label. The same downloads and the
  # same sign_installers.py (each installer's SHA-256 recorded, signed, and
  # checked unchanged). It uploads nothing, and names no secret.
  sign-rehearsal:
    name: Signing rehearsal (throwaway key)
    needs: [linux, windows]
    if: (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'ci:full')))
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The sign job's signer, got and checked the same way (see its
      # comment there).
      - name: Get the signer (Tauri's prebuilt CLI, pinned by SHA-256)
        uses: ./.github/actions/build-tools
        with:
          set: signer

      - name: Check the signer is the pinned one
        run: |
          set -euo pipefail
          want="$RUNNER_TEMP/build-tools/bin/cargo-tauri"
          found="$(command -v cargo-tauri || true)"
          # cargo runs a cargo-tauri in its own bin folder before one on PATH.
          shadow="${CARGO_HOME:-$HOME/.cargo}/bin/cargo-tauri"
          version="$(cargo tauri --version)"
          echo "signer: cargo tauri --version: $version, at ${found:-nowhere} ($(cargo --version))"
          if [ "$found" != "$want" ] || [ -e "$shadow" ]; then
            echo "::error::cargo tauri isn't the pinned signer at $want: cargo-tauri on PATH is ${found:-none}, $shadow $([ -e "$shadow" ] && echo exists || echo 'is absent')"
            exit 1
          fi
          if [ "$version" != "tauri-cli $TAURI_CLI_VERSION" ]; then
            echo "::error::cargo tauri --version printed '$version', not 'tauri-cli $TAURI_CLI_VERSION'"
            exit 1
          fi

      # The build's four artifacts by name, each into a folder of that
      # name (sign_installers.py's layout).
      - name: Download the AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gospel-getter-linux-appimage
          path: installers/gospel-getter-linux-appimage

      - name: Download the deb
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gospel-getter-linux-deb
          path: installers/gospel-getter-linux-deb

      - name: Download the NSIS installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gospel-getter-windows-nsis-installer
          path: installers/gospel-getter-windows-nsis-installer

      - name: Download the MSI installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gospel-getter-windows-msi-installer
          path: installers/gospel-getter-windows-msi-installer

      # Without a password, as `cargo tauri signer generate --ci` makes it.
      - name: Make a throwaway signing key
        run: cargo tauri signer generate --ci --write-keys "$RUNNER_TEMP/rehearsal.key"

      - name: Sign the installers with it
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 tools/release/sign_installers.py installers \
            --private-key-path "$RUNNER_TEMP/rehearsal.key" \
            --pubkey-file "$RUNNER_TEMP/rehearsal.key.pub"
