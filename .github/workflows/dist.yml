name: Distribution Artifacts

# Builds the actual installers — AppImage + .deb on Linux, an NSIS setup.exe
# (and MSI, when the bundler produces one) on Windows — and smoke-tests
# each one before uploading it as a workflow artifact. This is separate
# from ci.yml (which only runs cargo fmt/clippy/test/build) because
# bundling is slow and installs system packages. It runs on every push to
# main (a release's installers come from the run on its release commit),
# on every pull request, and by hand (workflow_dispatch).
#
# Then the GUI checks (scripts/gui-check.sh, tests/gui) drive the built
# app through its own webview with tauri-driver: gui-linux on the AppImage
# for every run, advisory (not a required check); gui-windows on the NSIS
# install only by hand (workflow_dispatch) or for a pull request from a
# release/ branch, before a release. Their updater checks run on the GUI
# checks' test build of the app (feature gui-test-updater: its updater
# reads a test settings file, talks to the checks' own local server, and
# never installs), which each job builds after its installers are uploaded,
# into an artifact of its own (gui-check-test-app-*). It is never an
# installer and never released; tests/packaging_config.rs fails if any
# installer or packaging build enables the feature.
#
# This workflow never creates a GitHub release, tag, or otherwise publishes
# anything — it only produces downloadable workflow-run artifacts, so a
# human can review real installers before anything goes out the door.
#
# These are the installers that update themselves: they're built with
# GOSPEL_GETTER_SELF_UPDATE=1 (read at compile time, see src-tauri/src/
# updater.rs), which no other build of the app has, and signed for the
# updater with the TAURI_SIGNING_PRIVATE_KEY secret through the
# tauri.updater.conf.json overlay. Each installer's artifact carries its
# .sig beside it, for tools/release/make_latest_json.py. Pushes to main must
# be signed; a pull request without access to the secret (from a fork)
# builds unsigned installers, with a warning, which can't be released.
#
# SPIKE (spike/webkitgtk-2.54, never merged): the AppImage bundles a
# WebKitGTK built by webkitgtk.yml (2.54.x on Ubuntu 22.04, for the
# WebKitWebProcess exit crash, WebKit bug 305909) instead of the build
# host's 2.50.4, in a job of its own (linux-appimage); the .deb is still
# built against, and depends on, the system's WebKitGTK (linux).
# appimage-plain-jammy starts that AppImage on a runner with no WebKitGTK.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dist-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: "^2.0.0"

jobs:
  # The WebKitGTK the AppImage bundles: restored from the cache when it's
  # there, built (hours) when it isn't.
  webkitgtk:
    uses: ./.github/workflows/webkitgtk.yml

  linux:
    name: Linux (deb)
    # Tauri's own Linux packaging guidance is to build on the oldest
    # supported Ubuntu LTS, not `ubuntu-latest`: the AppImage/deb bundler
    # links against the build host's glibc/webkit2gtk, and a binary built
    # on a newer Ubuntu won't run on an older one. 22.04 is Tauri's
    # documented minimum baseline for the current AppImage/deb tooling.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # The page's Rust pieces (ui-leptos/) compile to WebAssembly.
          targets: wasm32-unknown-unknown

      # `cargo tauri build` runs Trunk first (build.beforeBuildCommand in
      # tauri.conf.json) to build the page into dist/.
      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.1
        with:
          version: "v0.21.14"

      # webkit2gtk/gtk3 headers to build against, plus the bundling
      # toolchain: patchelf (rpath rewriting) and file.
      - name: Install Tauri Linux build & bundling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            patchelf build-essential libssl-dev file

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            ui-leptos

      - name: Decide on updater signing
        id: signing
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "pull_request" ]; then
            echo "::warning::No updater signing key (pull requests from forks get no secrets): building unsigned installers without .sig files. They can't be released."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret isn't available, so the updater artifacts can't be signed. Builds on $EVENT must be signed; set the secret (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD) in the repository's Actions secrets."
            exit 1
          fi

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Build the deb bundle
        env:
          GOSPEL_GETTER_SELF_UPDATE: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cargo tauri build --bundles deb --config tauri.updater.conf.json
          else
            cargo tauri build --bundles deb
          fi

      - name: Locate built artifacts
        id: artifacts
        run: |
          set -euo pipefail
          deb="$(find target/release/bundle/deb -maxdepth 1 -name '*.deb')"
          if [ -z "$deb" ]; then
            echo "::error::cargo tauri build did not produce a .deb under target/release/bundle/deb"
            exit 1
          fi
          # Resolve to absolute paths: a bare relative path (no leading
          # `./` or `/`) is ambiguous to apt-get, which parses a plain
          # `a/b/c` argument as `package/release` syntax rather than a
          # filesystem path — it would try (and fail) to install a
          # package literally named "target/release/bundle/deb" instead
          # of the .deb file that path points to.
          deb="$(realpath "$deb")"
          echo "deb=$deb" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            if [ ! -s "$deb.sig" ]; then
              echo "::error::the signed build produced no updater signature $deb.sig"
              exit 1
            fi
            echo "deb_sig=$deb.sig" >> "$GITHUB_OUTPUT"
          fi

      - name: "Smoke test: .deb installs and uninstalls cleanly"
        run: |
          set -euo pipefail
          deb="${{ steps.artifacts.outputs.deb }}"
          pkg_name="$(dpkg-deb -f "$deb" Package)"
          echo "Package name: $pkg_name"

          sudo apt-get install -y "$deb"
          dpkg -s "$pkg_name" | grep -q '^Status: install ok installed'

          owned_files="$(dpkg -L "$pkg_name")"
          echo "$owned_files" | grep -q '/usr/bin/' \
            || { echo "::error::package installs no file under /usr/bin"; exit 1; }
          echo "$owned_files" | grep -q '\.desktop$' \
            || { echo "::error::package installs no .desktop launcher"; exit 1; }

          sudo apt-get remove -y "$pkg_name"
          if dpkg -s "$pkg_name" 2>/dev/null | grep -q '^Status: install ok installed'; then
            echo "::error::package still reports installed after apt-get remove"
            exit 1
          fi
          echo ".deb installed and removed cleanly"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: gospel-getter-linux-deb
          path: |
            ${{ steps.artifacts.outputs.deb }}
            ${{ steps.artifacts.outputs.deb_sig }}
          if-no-files-found: error

      # Last, after the installers above are uploaded: the GUI checks' test
      # build (see the top of this file), for gui-linux's updater checks.
      - name: Build the GUI-check test app
        run: |
          set -euo pipefail
          cargo build --release --locked --features gui-test-updater
          mkdir -p "$RUNNER_TEMP/gui-check-test-app"
          cp target/release/gospel_getter "$RUNNER_TEMP/gui-check-test-app/"

      - name: Upload the GUI-check test app
        uses: actions/upload-artifact@v4
        with:
          name: gui-check-test-app-linux
          path: ${{ runner.temp }}/gui-check-test-app
          if-no-files-found: error
          retention-days: 7

  linux-appimage:
    name: Linux (AppImage, bundled WebKitGTK)
    # The AppImage bundles the WebKitGTK webkitgtk.yml built (on this same
    # Ubuntu, so the glibc floor stays 2.35), not the build host's: the
    # staged tree is laid over this job's /usr, where Tauri's bundler looks
    # for WebKit's helper processes (see .github/webkitgtk/build.sh). The
    # system's WebKitGTK is never installed here; the .deb is built in the
    # linux job, against it.
    needs: webkitgtk
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src-tauri
    env:
      WEBKITGTK_STAGE: ~/webkitgtk/stage
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.1
        with:
          version: "v0.21.14"

      # GTK and the rest of what our WebKitGTK links (the same list it was
      # configured against: its webkit2gtk-4.1.pc names them, and
      # linuxdeploy bundles their libraries from here), plus the bundling
      # toolchain as in the linux job, libfuse2 (AppImages are FUSE-mounted
      # at bundle time) and xvfb (the smoke test). No libwebkit2gtk-4.1-dev.
      - name: Install the build and bundling dependencies (no system WebKitGTK)
        working-directory: .
        run: |
          set -euo pipefail
          mapfile -t dev_packages < <(grep -v '^#' .github/webkitgtk/apt-dev-packages.txt)
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev librsvg2-dev patchelf build-essential libssl-dev libfuse2 xvfb file \
            "${dev_packages[@]}"

      - name: Restore our WebKitGTK
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WEBKITGTK_STAGE }}
          key: ${{ needs.webkitgtk.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Install our WebKitGTK over /usr
        env:
          WEBKITGTK_VERSION: ${{ needs.webkitgtk.outputs.version }}
        run: |
          set -euo pipefail
          stage="${WEBKITGTK_STAGE/#\~/$HOME}"
          # Nothing of the system's may be left for the bundler to find.
          mapfile -t system_webkit < <(dpkg-query -W -f '${Package} ${Status}\n' \
            'libwebkit2gtk-4.1*' 'libjavascriptcoregtk-4.1*' 'gir1.2-webkit2-4.1' 'gir1.2-javascriptcoregtk-4.1' 2>/dev/null \
            | awk '/ installed$/ { print $1 }')
          if [ "${#system_webkit[@]}" -gt 0 ]; then
            echo "Removing the system's ${system_webkit[*]}"
            sudo dpkg --remove --force-depends "${system_webkit[@]}"
          fi
          sudo tar -C "$stage" -cf - usr | sudo tar -C / -xf - --no-same-owner
          sudo ldconfig
          installed="$(pkg-config --modversion webkit2gtk-4.1)"
          echo "webkit2gtk-4.1 is now $installed"
          if [ "$installed" != "$WEBKITGTK_VERSION" ]; then
            echo "::error::pkg-config finds webkit2gtk-4.1 $installed, not our $WEBKITGTK_VERSION"
            exit 1
          fi
          # Every library our WebKitGTK needs is here (else linuxdeploy can't
          # bundle it).
          missing="$(find "$stage/usr/lib/x86_64-linux-gnu" -type f \( -name '*.so*' -o -perm -u+x \) \
            -exec sh -c 'ldd "$1" 2>/dev/null | sed -n "s|^|$1: |; /not found/p"' _ {} \;)"
          if [ -n "$missing" ]; then
            echo "$missing"
            echo "::error::our WebKitGTK needs libraries this runner doesn't have; add their -dev packages to .github/webkitgtk/apt-dev-packages.txt"
            exit 1
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            ui-leptos

      - name: Decide on updater signing
        id: signing
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "pull_request" ]; then
            echo "::warning::No updater signing key (pull requests from forks get no secrets): building unsigned installers without .sig files. They can't be released."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret isn't available, so the updater artifacts can't be signed. Builds on $EVENT must be signed; set the secret (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD) in the repository's Actions secrets."
            exit 1
          fi

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Build the AppImage bundle
        env:
          GOSPEL_GETTER_SELF_UPDATE: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cargo tauri build --bundles appimage --config tauri.updater.conf.json
          else
            cargo tauri build --bundles appimage
          fi

      - name: Locate the AppImage and extract it
        id: artifacts
        run: |
          set -euo pipefail
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage')"
          if [ -z "$appimage" ]; then
            echo "::error::cargo tauri build did not produce an .AppImage under target/release/bundle/appimage"
            exit 1
          fi
          appimage="$(realpath "$appimage")"
          echo "appimage=$appimage" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            if [ ! -s "$appimage.sig" ]; then
              echo "::error::the signed build produced no updater signature $appimage.sig"
              exit 1
            fi
            echo "appimage_sig=$appimage.sig" >> "$GITHUB_OUTPUT"
          fi
          chmod +x "$appimage"
          root="$RUNNER_TEMP/appimage"
          rm -rf "$root"
          mkdir -p "$root"
          (cd "$root" && "$appimage" --appimage-extract >/dev/null)
          test -x "$root/squashfs-root/AppRun"
          echo "root=$root/squashfs-root" >> "$GITHUB_OUTPUT"
          bytes="$(stat -c %s "$appimage")"
          echo "AppImage size: $((bytes / 1000000)) MB ($bytes bytes); v2.21.0's was 91 MB (91331064 bytes)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # webkit_get_*_version() from the bundled library, loaded with the
      # bundle's own libraries. A warning for now; an error once the fix
      # ships.
      - name: Check the bundled WebKitGTK version
        env:
          ROOT: ${{ steps.artifacts.outputs.root }}
          BUILT: ${{ needs.webkitgtk.outputs.version }}
        run: |
          set -euo pipefail
          lib="$(find "$ROOT" -name 'libwebkit2gtk-4.1.so.0' | head -1)"
          if [ -z "$lib" ]; then
            echo "::error::the AppImage bundles no libwebkit2gtk-4.1.so.0"
            exit 1
          fi
          version="$(LD_LIBRARY_PATH="$(dirname "$lib")" python3 -I -c '
          import ctypes, sys
          lib = ctypes.CDLL(sys.argv[1])
          print(".".join(str(getattr(lib, f"webkit_get_{part}_version")()) for part in ("major", "minor", "micro")))
          ' "$lib")"
          echo "The AppImage bundles WebKitGTK $version (${lib#"$ROOT/"})" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$(printf '%s\n' 2.54.1 "$version" | sort -V | head -1)" != 2.54.1 ]; then
            echo "::warning::The AppImage bundles WebKitGTK $version, older than 2.54.1: its WebKitWebProcess aborts on exit (WebKit bug 305909)"
          fi
          # Spike: it must be the one webkitgtk.yml built.
          if [ "$version" != "$BUILT" ]; then
            echo "::error::the AppImage bundles WebKitGTK $version, not the $BUILT webkitgtk.yml built"
            exit 1
          fi

      # Spike: the bundled helper processes and libraries are ours (the same
      # GNU build IDs as the staged tree; patchelf and the bundler's "/usr"
      # rewrite leave those alone), and nothing in the AppImage needs a
      # glibc newer than Ubuntu 22.04's 2.35.
      - name: Check the bundled WebKit is ours and the glibc floor
        env:
          ROOT: ${{ steps.artifacts.outputs.root }}
        run: |
          set -euo pipefail
          stage="${WEBKITGTK_STAGE/#\~/$HOME}/usr/lib/x86_64-linux-gnu"
          build_id() { readelf -n "$1" | awk '/Build ID/ { print $3 }'; }
          for file in libwebkit2gtk-4.1.so.0 libjavascriptcoregtk-4.1.so.0 webkit2gtk-4.1/WebKitWebProcess \
            webkit2gtk-4.1/WebKitNetworkProcess webkit2gtk-4.1/injected-bundle/libwebkit2gtkinjectedbundle.so; do
            bundled="$(find "$ROOT/usr/lib" -path "*/${file}" | head -1)"
            if [ -z "$bundled" ]; then
              echo "::error::the AppImage has no $file"
              exit 1
            fi
            if [ "$(build_id "$bundled")" != "$(build_id "$stage/$file")" ]; then
              echo "::error::${bundled#"$ROOT/"} isn't the $file webkitgtk.yml built"
              exit 1
            fi
            echo "ours: ${bundled#"$ROOT/"} (build ID $(build_id "$bundled"))"
          done

          report="$RUNNER_TEMP/glibc-report.txt"
          : > "$report"
          elves=0
          while IFS= read -r -d '' file; do
            [ "$(head -c 4 "$file" | od -An -tx1 | tr -d ' \n')" = 7f454c46 ] || continue
            elves=$((elves + 1))
            symbols="$(objdump -T "$file" 2>/dev/null || true)"
            glibc="$({ grep -o 'GLIBC_[0-9][0-9.]*' <<<"$symbols" || true; } | sed 's/^GLIBC_//' | sort -uV | tail -1)"
            glibcxx="$({ grep -o 'GLIBCXX_[0-9][0-9.]*' <<<"$symbols" || true; } | sed 's/^GLIBCXX_//' | sort -uV | tail -1)"
            echo "${glibc:-none} ${glibcxx:-none} ${file#"$ROOT/"}" >> "$report"
          done < <(find "$ROOT" -type f -print0)
          max="$(cut -d' ' -f1 "$report" | { grep -v none || true; } | sort -uV | tail -1)"
          max_cxx="$(cut -d' ' -f2 "$report" | { grep -v none || true; } | sort -uV | tail -1)"
          if [ -z "$max" ]; then
            echo "::error::found no ELF file in the AppImage that needs glibc"
            exit 1
          fi
          echo "The highest glibc symbol versions the AppImage's ELF files need:"
          sort -rV "$report" | sed -n 1,15p
          {
            echo "- ELF files in the AppImage: $elves; highest GLIBC_ needed: $max; highest GLIBCXX_: $max_cxx"
            echo "- Needing GLIBC_$max: $(awk -v m="$max" '$1 == m { print $3 }' "$report" | sed -n 1,8p | paste -sd' ')"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$(printf '%s\n' 2.35 "$max" | sort -V | tail -1)" != 2.35 ]; then
            echo "::error::the AppImage needs glibc $max, newer than Ubuntu 22.04's 2.35"
            exit 1
          fi

      - name: Upload the glibc report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-glibc-report
          path: ${{ runner.temp }}/glibc-report.txt
          retention-days: 14

      - name: "Smoke test: AppImage extracts and launches without crashing"
        env:
          ROOT: ${{ steps.artifacts.outputs.root }}
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum "$ROOT/AppRun" &
          app_pid=$!
          sleep 5
          if ! kill -0 "$app_pid" 2>/dev/null; then
            echo "::error::the AppImage's app process exited within 5s of launch (crash on startup)"
            exit 1
          fi
          echo "AppImage launched and is still running after 5s (pid $app_pid)"
          kill "$app_pid"
          wait "$app_pid" 2>/dev/null || true

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: gospel-getter-linux-appimage
          path: |
            ${{ steps.artifacts.outputs.appimage }}
            ${{ steps.artifacts.outputs.appimage_sig }}
          if-no-files-found: error

      # Spike: the same AppImage under its own name, to try by hand.
      - name: Upload the spike AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: gospel-getter-linux-appimage-webkit-spike
          path: |
            ${{ steps.artifacts.outputs.appimage }}
            ${{ steps.artifacts.outputs.appimage_sig }}
          if-no-files-found: error

  appimage-plain-jammy:
    name: AppImage on a plain Ubuntu 22.04
    # Spike: the AppImage started as a user starts it, on a runner with no
    # WebKitGTK installed and nothing added for the app (the README asks
    # for nothing); xvfb only if the runner lacks a display server. Its
    # WebKit processes must run from the AppImage, with its libwebkit2gtk.
    needs: linux-appimage
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Download the AppImage
        uses: actions/download-artifact@v4
        with:
          name: gospel-getter-linux-appimage-webkit-spike
          path: appimage

      - name: Start it and check its WebKit processes
        run: |
          set -euo pipefail
          lsb_release -ds
          echo "WebKitGTK packages on this runner: $(dpkg-query -W -f '${Package} ' 'libwebkit2gtk*' 'libjavascriptcoregtk*' 2>/dev/null || true)"
          # Searched from a variable: grep -q in a pipe from ldconfig can
          # stop it with SIGPIPE, which pipefail would report as no match.
          libs="$(ldconfig -p)"
          if grep -q 'libwebkit2gtk-4.1\.so' <<<"$libs"; then
            echo "::error::this runner has a libwebkit2gtk-4.1 of its own, so it can't show the AppImage runs without one"
            exit 1
          fi
          command -v xvfb-run >/dev/null || { sudo apt-get update && sudo apt-get install -y xvfb; }
          appimage="$(find appimage -maxdepth 1 -name '*.AppImage' | sed -n 1p)"
          chmod +x "$appimage"
          # FUSE-mounted, as a user runs it, when the runner has libfuse2;
          # else the AppImage runtime's own extract-and-run.
          if grep -q 'libfuse\.so\.2' <<<"$libs"; then
            echo "Running it FUSE-mounted"
          else
            echo "No libfuse2: running it with APPIMAGE_EXTRACT_AND_RUN=1"
            export APPIMAGE_EXTRACT_AND_RUN=1
          fi
          home="$RUNNER_TEMP/app-home"
          mkdir -p "$home"
          HOME="$home" XDG_CONFIG_HOME="$home/config" XDG_DATA_HOME="$home/data" XDG_CACHE_HOME="$home/cache" \
            xvfb-run --auto-servernum "$PWD/$appimage" > "$RUNNER_TEMP/app.log" 2>&1 &
          app_pid=$!

          # Processes by their executable's name (a 16-character name such
          # as WebKitWebProcess doesn't fit in /proc/PID/comm).
          pids_of() {
            local exe
            for exe in /proc/[0-9]*/exe; do
              [ "$(basename "$(readlink "$exe" 2>/dev/null)")" = "$1" ] && { exe="${exe#/proc/}"; echo "${exe%/exe}"; }
            done
            return 0
          }
          web=""
          for _ in $(seq 60); do
            web="$(pids_of WebKitWebProcess | sed -n 1p)"
            [ -n "$web" ] && break
            kill -0 "$app_pid" 2>/dev/null || break
            sleep 0.5
          done
          sleep 5
          status=0
          if [ -z "$web" ] || ! kill -0 "$app_pid" 2>/dev/null; then
            echo "::error::the AppImage didn't start a WebKitWebProcess, or exited"
            status=1
          else
            app="$(pids_of gospel_getter | sed -n 1p)"
            network="$(pids_of WebKitNetworkProcess | sed -n 1p)"
            for pid in $app $web $network; do
              exe="$(readlink "/proc/$pid/exe")"
              lib="$(awk '$6 ~ /libwebkit2gtk-4\.1\.so/ { print $6; exit }' "/proc/$pid/maps")"
              echo "$(basename "$exe") (pid $pid): $exe, with $lib"
              case "$lib" in
                /usr/*|/lib/*|"") echo "::error::$(basename "$exe") isn't running the AppImage's libwebkit2gtk-4.1"; status=1 ;;
              esac
            done
          fi
          kill "$app_pid" 2>/dev/null || true
          wait "$app_pid" 2>/dev/null || true
          echo "--- app.log"
          cat "$RUNNER_TEMP/app.log"
          exit "$status"

  windows:
    name: Windows (NSIS installer)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # The page's Rust pieces (ui-leptos/) compile to WebAssembly.
          targets: wasm32-unknown-unknown

      # `cargo tauri build` runs Trunk first (build.beforeBuildCommand in
      # tauri.conf.json) to build the page into dist/.
      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.1
        with:
          version: "v0.21.14"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            ui-leptos

      - name: Decide on updater signing
        id: signing
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "pull_request" ]; then
            echo "::warning::No updater signing key (pull requests from forks get no secrets): building unsigned installers without .sig files. They can't be released."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret isn't available, so the updater artifacts can't be signed. Builds on $EVENT must be signed; set the secret (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD) in the repository's Actions secrets."
            exit 1
          fi

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked

      # bundle.targets is "all" in tauri.conf.json, so this produces both
      # an NSIS setup.exe and an MSI on Windows.
      - name: Build Windows installers
        shell: pwsh
        env:
          GOSPEL_GETTER_SELF_UPDATE: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ("${{ steps.signing.outputs.signed }}" -eq "true") {
            cargo tauri build --config tauri.updater.conf.json
          } else {
            cargo tauri build
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate built artifacts
        id: artifacts
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -Path "target/release/bundle/nsis" -Filter *.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) {
            Write-Error "cargo tauri build did not produce an NSIS setup.exe under target/release/bundle/nsis"
            exit 1
          }
          "nsis=$($nsis.FullName)" >> $env:GITHUB_OUTPUT
          $signed = "${{ steps.signing.outputs.signed }}" -eq "true"
          if ($signed) {
            $sig = "$($nsis.FullName).sig"
            if (-not (Test-Path $sig) -or (Get-Item $sig).Length -eq 0) {
              Write-Error "the signed build produced no updater signature $sig"
              exit 1
            }
            "nsis_sig=$sig" >> $env:GITHUB_OUTPUT
          }

          $msi = Get-ChildItem -Path "target/release/bundle/msi" -Filter *.msi -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            "msi=$($msi.FullName)" >> $env:GITHUB_OUTPUT
            "msi_built=true" >> $env:GITHUB_OUTPUT
            if ($signed) {
              $sig = "$($msi.FullName).sig"
              if (-not (Test-Path $sig) -or (Get-Item $sig).Length -eq 0) {
                Write-Error "the signed build produced no updater signature $sig"
                exit 1
              }
              "msi_sig=$sig" >> $env:GITHUB_OUTPUT
            }
          } else {
            Write-Warning "No MSI installer was produced; only the NSIS setup.exe is available this run."
            "msi_built=false" >> $env:GITHUB_OUTPUT
          }

      - name: "Smoke test: silent install and uninstall (NSIS)"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "${{ steps.artifacts.outputs.nsis }}"

          Write-Host "Running silent install: $exe /S"
          Start-Process -FilePath $exe -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5

          $uninstallRoots = @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall"
          )
          $entry = Get-ChildItem $uninstallRoots -ErrorAction SilentlyContinue |
            Get-ItemProperty -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "*Gospel Getter*" } |
            Select-Object -First 1

          if (-not $entry) {
            Write-Error "No uninstall registry entry for Gospel Getter found after a silent install — install likely failed."
            exit 1
          }
          Write-Host "Registered: $($entry.DisplayName) v$($entry.DisplayVersion)"
          Write-Host "Install location: $($entry.InstallLocation)"
          if ($entry.InstallLocation -and (Test-Path $entry.InstallLocation)) {
            Write-Host "Install directory contents:"
            Get-ChildItem $entry.InstallLocation | Format-Table Name, Length
          }

          $uninstallExe = $entry.UninstallString.Trim('"')
          Write-Host "Running silent uninstall: $uninstallExe /S"
          Start-Process -FilePath $uninstallExe -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5

          $stillThere = Get-ChildItem $uninstallRoots -ErrorAction SilentlyContinue |
            Get-ItemProperty -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "*Gospel Getter*" }
          if ($stillThere) {
            Write-Error "Uninstall registry entry for Gospel Getter is still present after a silent uninstall."
            exit 1
          }
          Write-Host "Silent install/uninstall smoke test passed."

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gospel-getter-windows-nsis-installer
          path: |
            ${{ steps.artifacts.outputs.nsis }}
            ${{ steps.artifacts.outputs.nsis_sig }}
          if-no-files-found: error

      - name: Upload MSI installer artifact (when built)
        if: steps.artifacts.outputs.msi_built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gospel-getter-windows-msi-installer
          path: |
            ${{ steps.artifacts.outputs.msi }}
            ${{ steps.artifacts.outputs.msi_sig }}
          if-no-files-found: error

      # Last, after the installers above are uploaded, and only when
      # gui-windows runs: the GUI checks' test build (see the top of this
      # file), for its updater checks.
      - name: Build the GUI-check test app
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/'))
        shell: pwsh
        run: |
          cargo build --release --locked --features gui-test-updater
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/gui-check-test-app" | Out-Null
          Copy-Item target/release/gospel_getter.exe "$env:RUNNER_TEMP/gui-check-test-app/"

      - name: Upload the GUI-check test app
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/'))
        uses: actions/upload-artifact@v4
        with:
          name: gui-check-test-app-windows
          path: ${{ runner.temp }}/gui-check-test-app
          if-no-files-found: error
          retention-days: 7

  gui-linux:
    name: GUI checks (Linux)
    # The AppImage the linux-appimage job built, driven through its own webview by
    # tauri-driver and WebKitWebDriver on a private Xvfb display. Advisory:
    # not a required check (yet). The AppImage is tested as shipped: the
    # script has its own runtime extract it (--appimage-extract, so no FUSE)
    # and starts its AppRun.
    needs: [linux, linux-appimage]
    # The same Ubuntu as the build. Spike: the AppImage now bundles our
    # WebKitGTK; webkit2gtk-driver (WebKitWebDriver) is still the system's.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      # A CI runner is slower than a desktop; still bounded.
      GUI_CHECK_BUDGET: "300"
      GUI_CHECK_STEP_TIMEOUT: "20"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # ImageMagick: a picture of the private display when a check fails
      # (the native dialogs, which WebDriver can't see).
      # The test build is a plain binary (not an AppImage), so it runs on
      # the system's WebKitGTK and GTK.
      - name: Install Xvfb, xdotool, WebKitWebDriver, ImageMagick and the app's runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool webkit2gtk-driver dbus imagemagick \
            libwebkit2gtk-4.1-0 libgtk-3-0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/gui

      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: Check formatting and lints (tests/gui)
        working-directory: tests/gui
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Download the AppImage
        uses: actions/download-artifact@v4
        with:
          name: gospel-getter-linux-appimage
          path: appimage

      - name: Download the GUI-check test app
        uses: actions/download-artifact@v4
        with:
          name: gui-check-test-app-linux
          path: gui-check-test-app

      - name: Run the GUI checks on the AppImage (and the updater's on the test app)
        run: |
          set -euo pipefail
          appimage="$(find appimage -maxdepth 1 -name '*.AppImage' | head -1)"
          if [ -z "$appimage" ]; then
            echo "::error::no AppImage in the downloaded artifact"
            exit 1
          fi
          chmod +x gui-check-test-app/gospel_getter
          GUI_CHECK_UPDATER_APP="$PWD/gui-check-test-app/gospel_getter" \
            scripts/gui-check.sh "$appimage" "$RUNNER_TEMP/gui-check"

      - name: Upload the results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-check-linux
          path: ${{ runner.temp }}/gui-check
          if-no-files-found: warn

  gui-windows:
    name: GUI checks (Windows)
    # The NSIS installer the windows job built, installed silently and
    # driven through WebView2 by tauri-driver and Edge WebDriver. Before a
    # release only: by hand, or for a pull request from a release/ branch.
    # Windows has no private display, so this runs on the runner's desktop;
    # the native save-dialog step stops at "the dialog appeared" (UI
    # Automation finds and closes it).
    needs: windows
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/'))
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GUI_CHECK_BUDGET: "300"
      GUI_CHECK_STEP_TIMEOUT: "20"
      # The app's window comes up about 10s after launch on a cold runner.
      GUI_CHECK_SESSION_TIMEOUT: "60"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/gui

      # Tauri's WebDriver CI guidance: msedgedriver-tool fetches the Edge
      # WebDriver matching the installed WebView2 runtime (pinned here).
      - name: Install tauri-driver and a matching Edge WebDriver
        shell: bash
        run: |
          set -euo pipefail
          cargo install tauri-driver --version 2.1.0 --locked
          cargo install --git https://github.com/chippers/msedgedriver-tool \
            --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --locked
          mkdir -p "$RUNNER_TEMP/msedgedriver"
          cd "$RUNNER_TEMP/msedgedriver"
          msedgedriver-tool
          ./msedgedriver.exe --version
          cygpath -w "$PWD" >> "$GITHUB_PATH"

      - name: Download the NSIS installer
        uses: actions/download-artifact@v4
        with:
          name: gospel-getter-windows-nsis-installer
          path: nsis

      - name: Install the app (silent NSIS install)
        id: install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem -Path nsis -Filter *.exe | Select-Object -First 1
          if (-not $setup) { Write-Error "no setup .exe in the downloaded artifact"; exit 1 }
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $entry = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall", "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue |
            Get-ItemProperty -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "*Gospel Getter*" } |
            Select-Object -First 1
          if (-not $entry) { Write-Error "Gospel Getter isn't registered after a silent install"; exit 1 }
          # NSIS writes InstallLocation in quotes.
          $location = "$($entry.InstallLocation)".Trim('"')
          if (-not $location -or -not (Test-Path -LiteralPath $location -PathType Container)) {
            Write-Error "the install location '$($entry.InstallLocation)' isn't a folder"; exit 1
          }
          $exe = Get-ChildItem -LiteralPath $location -Filter *.exe |
            Where-Object { $_.Name -notlike "uninstall*" } | Select-Object -First 1
          if (-not $exe) { Write-Error "no app .exe in $location"; exit 1 }
          Write-Host "Installed: $($exe.FullName)"
          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      # Edge WebDriver asks WebView2 for a debugging port through
      # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS. Since WebView2 Runtime 150 an
      # elevated host app (as everything on this runner is) ignores that
      # variable and the HKCU policy; only the HKLM policy and the app's own
      # arguments count (MicrosoftEdge/WebView2Feedback#5645). Without the
      # port the session never starts ("DevToolsActivePort file doesn't
      # exist"). Port 0: the browser picks one and writes it to
      # DevToolsActivePort in Edge WebDriver's user-data folder, where the
      # driver looks. Machine policy, so here on the throwaway runner only.
      - name: Let WebView2 open a debugging port for the app (HKLM policy)
        shell: pwsh
        env:
          APP_EXE: ${{ steps.install.outputs.exe }}
        run: |
          $ErrorActionPreference = "Stop"
          $key = "HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments"
          New-Item -Path $key -Force | Out-Null
          $name = Split-Path -Leaf $env:APP_EXE
          New-ItemProperty -Path $key -Name $name -Value "--remote-debugging-port=0" -PropertyType String -Force | Out-Null
          Get-ItemProperty -Path $key | Format-List

      - name: Download the GUI-check test app
        uses: actions/download-artifact@v4
        with:
          name: gui-check-test-app-windows
          path: gui-check-test-app

      # Named as the installed app is, so the WebView2 policy above (keyed
      # by the program's file name) lets Edge WebDriver reach it too.
      - name: Run the GUI checks on the installed app (and the updater's on the test app)
        shell: bash
        env:
          APP_EXE: ${{ steps.install.outputs.exe }}
        run: |
          set -euo pipefail
          tmp="$(cygpath -u "$RUNNER_TEMP")"
          name="$(basename "$(cygpath -u "$APP_EXE")")"
          mkdir -p "$tmp/gui-check-test-app"
          cp gui-check-test-app/gospel_getter.exe "$tmp/gui-check-test-app/$name"
          GUI_CHECK_UPDATER_APP="$tmp/gui-check-test-app/$name" \
            scripts/gui-check.sh "$(cygpath -u "$APP_EXE")" "$tmp/gui-check"

      - name: Upload the results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-check-windows
          path: ${{ runner.temp }}/gui-check
          if-no-files-found: warn
