<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <clipPath id="roundedSquare">
      <rect width="256" height="256" rx="48"/>
    </clipPath>

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#14082c"/>
      <stop offset="35%" stop-color="#441768"/>
      <stop offset="62%" stop-color="#972378"/>
      <stop offset="82%" stop-color="#bf5349"/>
      <stop offset="100%" stop-color="#bf8545"/>
    </linearGradient>

    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#bfb78a"/>
      <stop offset="45%" stop-color="#bf9b45"/>
      <stop offset="75%" stop-color="#bf537c"/>
      <stop offset="100%" stop-color="#922ca4"/>
    </linearGradient>

    <!-- Horizontal cutout stripes across the lower half of the sun, classic
         retrowave-sun treatment -->
    <mask id="sunStripes">
      <rect x="0" y="0" width="256" height="256" fill="#ffffff"/>
      <g fill="#000000">
        <rect x="0" y="152" width="256" height="5"/>
        <rect x="0" y="163" width="256" height="6"/>
        <rect x="0" y="176" width="256" height="7"/>
        <rect x="0" y="191" width="256" height="8"/>
        <rect x="0" y="208" width="256" height="9"/>
        <rect x="0" y="226" width="256" height="10"/>
      </g>
    </mask>
  </defs>

  <g clip-path="url(#roundedSquare)">
    <rect width="256" height="256" fill="url(#sky)"/>

    <!-- setting sun -->
    <circle cx="128" cy="176" r="72" fill="url(#sun)" mask="url(#sunStripes)"/>

    <!-- horizon + receding grid -->
    <line x1="0" y1="176" x2="256" y2="176" stroke="#04a3ae" stroke-width="2" opacity="0.9"/>
    <g stroke="#04a3ae" stroke-width="1.5" opacity="0.55">
      <line x1="128" y1="176" x2="-40"  y2="256"/>
      <line x1="128" y1="176" x2="20"   y2="256"/>
      <line x1="128" y1="176" x2="80"   y2="256"/>
      <line x1="128" y1="176" x2="176"  y2="256"/>
      <line x1="128" y1="176" x2="236"  y2="256"/>
      <line x1="128" y1="176" x2="296"  y2="256"/>
    </g>
    <g stroke="#04a3ae" stroke-width="1.5" opacity="0.4">
      <line x1="0" y1="200" x2="256" y2="200"/>
      <line x1="0" y1="225" x2="256" y2="225"/>
      <line x1="0" y1="248" x2="256" y2="248"/>
    </g>

    <!-- Chi-Rho, front and center: dark fill matching the sky's own darkest
         tone (so it reads as part of the theme, not a sticker on top of
         it), with a thin light outline for definition against the sun/sky -->
    <g transform="translate(60.4,36.7) scale(1.02)">
      <g transform="translate(51.152638,-7.6150457)">
        <path
          style="fill:#14082c;stroke:#04a3ae;stroke-width:1.2;stroke-linejoin:round"
