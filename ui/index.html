        :root:not([data-reader-mode="on"]) .reader-exit {
            display: none;
        }

        /* Aa's Notes in the margin goes with reading mode: below its
           button, while it's on. */
        .margin-notes-btn {
            margin-top: 0.4rem;
        }

        :root:not([data-reader-mode="on"]) .margin-notes-btn {
            display: none;
        }

        /* Screen-only, so a page printed from reading mode is laid out
           exactly like one printed normally. */
        /* On screen the page starts below the top bar, and anything
           scrolled into view stops below it too. */
        @media screen {
            html {
                scroll-padding-top: var(--bar-height);
            }

            .container {
                padding-top: calc(var(--bar-height) + 1.5rem);
            }

            :root[data-reader-mode="on"] .top-bar {
                background: transparent;
                border-bottom-color: transparent;
                pointer-events: none;
            }

            :root[data-reader-mode="on"] .top-bar > * {
                pointer-events: auto;
            }

            :root[data-reader-mode="on"] #library-toggle,
            :root[data-reader-mode="on"] #menu-toggle,
            :root[data-reader-mode="on"] .sidebar-toggle,
            :root[data-reader-mode="on"] .chapter-side,
            :root[data-reader-mode="on"] .nav-hint {
                display: none;
            }

            :root[data-reader-mode="on"] .container {
                max-width: calc(var(--reader-column) + 3rem);
                padding-top: 4.5rem;
            }

            /* The reference stays legible over the text scrolling under
               the (now transparent) bar. */
            :root[data-reader-mode="on"] .ref-btn {
                background: var(--bar-bg);
            }

            /* The sidebar (the picker on a wide window, while it's shown:
               the preferences script sets data-picker): down the left,
               below the bar, in the bar's opaque --bar-bg, and the page
               moves over to make room. Reading mode never shows it. */
            :root[data-picker="sidebar"] body {
                padding-left: var(--sidebar-width);
            }

            :root[data-picker="sidebar"] .picker:not([hidden]) {
                top: var(--bar-height);
                left: 0;
                bottom: 0;
                z-index: 15;
                width: var(--sidebar-width);
                max-height: none;
                background: var(--bar-bg);
                border: none;
                border-right: 1px solid var(--accent-dim);
                border-radius: 0;
                box-shadow: none;
            }

            /* Reading mode's one column is as wide as its container. */
            :root[data-reader-mode="on"] .chapter-main {
                max-width: none;
            }

            /* Margin notes (ui-leptos/src/margin.rs): in reading mode, the
               reader's notes in the open space to the right of the text,
               each beside its first verse, like notes in a printed Bible's
               margin. The margin is placed beside the column, never in the
               flow, so it can't move the text; margin.rs sets its width
               (--margin-width, from 14rem to 20rem, by the room there is),
               how many lines a note shows before "more"
               (--margin-fold-lines, faded at the foot) and each note's top.
               The notes are the UI's words, not scripture's: in the UI
               sans, smaller than the verses, the reference in the quiet
               accent, a thin rule beside a range's verses. */
            .margin-notes {
                position: absolute;
                top: 0;
                left: calc(100% + 1.5rem);
                width: var(--margin-width, 14rem);
                font-family: var(--font-ui);
                font-size: 0.8rem;
                line-height: 1.45;
                color: var(--text);
            }

            .margin-note {
                position: absolute;
                left: 0.6rem;
                right: 0;
                cursor: pointer;
            }

            .margin-note-ref {
                display: block;
                font-family: inherit;
                font-size: 0.72rem;
                line-height: 1.3;
                color: var(--accent-2);
                background: none;
                border: none;
                padding: 0;
                text-align: left;
                cursor: pointer;
            }

            .margin-note-where {
                color: var(--text-dim);
            }

            .margin-note-body {
                max-height: calc(var(--margin-fold-lines, 6) * 1.45em);
                overflow: hidden;
                margin: 0.1rem 0 0;
                white-space: pre-wrap;
                overflow-wrap: anywhere;
            }

            .margin-note.is-folded .margin-note-body {
                -webkit-mask-image: linear-gradient(to bottom, #000 60%, transparent);
                mask-image: linear-gradient(to bottom, #000 60%, transparent);
            }

            /* Over the faded foot of a folded note, so folding changes no
               note's height. */
            .margin-note-more {
                position: absolute;
                right: 0;
                bottom: 0;
                font-size: 0.75rem;
            }

            .margin-rule {
                position: absolute;
                left: 0;
                width: 1px;
                background: var(--accent-dim);
            }

            /* Too narrow for the margin: a note's marker after its verse, a
               small pencil that opens the card with the note. */
            .margin-marker {
                font-family: var(--font-ui);
                font-size: 0.75em;
                line-height: 1;
                color: var(--verse-num-color);
                background: none;
                border: none;
                padding: 0 0.15em;
                margin-left: 0.2em;
                cursor: pointer;
            }

            .margin-note-ref:focus-visible,
            .margin-marker:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }
        }

        /* The reference button, at the left of the bar: the chapter being
           read and its translation ("John 3 · KJV"), in the UI sans,
           always in view. It opens the book and chapter picker (as G does):
           the sidebar on wide windows, a popover below it otherwise. Like
           the bar's icons, it has no box until the pointer is over it (a
           wash) or its popover is open (the wash, in --accent). */
        .ref-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            min-width: 0;
            max-width: min(24rem, 50vw);
            height: 2.4rem;
            margin-right: auto;
            padding: 0 0.7rem;
            background: none;
            border: none;
            border-radius: var(--radius-m);
            color: var(--text);
            font-family: var(--font-ui);
            font-size: 0.95rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .ref-text {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ref-btn svg {
            flex: none;
            width: 0.9rem;
            height: 0.9rem;
            color: var(--text-dim);
        }

        .ref-btn:hover {
            background: rgba(var(--accent-rgb), 0.12);
        }

        .ref-btn[aria-haspopup="dialog"][aria-expanded="true"] {
            background: rgba(var(--accent-rgb), 0.08);
            color: var(--accent);
        }

        /* The sidebar's own show/hide button, before the reference: only
           where there's room for the sidebar. */
        :root:not([data-wide]) .sidebar-toggle {
            display: none;
        }

        /* The book and chapter picker: Random chapter, then the Old and New
           Testament books, with the chosen book's chapters under it. On
           wide windows it's a sidebar down the left (see the screen block
           below); otherwise a popover from the reference button, opaque
           --option-bg like Aa's. */
        .picker:not([hidden]) {
            position: fixed;
            top: calc(var(--bar-height) + 0.4rem);
            left: 0.5rem;
            z-index: 26;
            display: flex;
            flex-direction: column;
            width: min(20rem, calc(100vw - 1rem));
            max-height: calc(100vh - var(--bar-height) - 1rem);
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 0.5rem 0.6rem 0.9rem;
            background: var(--option-bg);
            color: var(--text);
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-l);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            font-family: var(--font-ui);
            font-size: 0.9rem;
        }

        .picker-random {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            width: 100%;
            min-height: 2.2rem;
            padding: 0.3rem 0.6rem;
            background: none;
            border: none;
            border-radius: var(--radius-m);
            color: var(--text);
            font-family: inherit;
            font-size: inherit;
            text-align: left;
            cursor: pointer;
        }

        .picker-random svg {
            width: 1rem;
            height: 1rem;
            color: var(--text-dim);
        }

        .picker-testament {
            padding: 0.9rem 0.6rem 0.3rem;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .picker-books {
            list-style: none;
        }

        .book-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            width: 100%;
            min-height: 2rem;
            padding: 0.25rem 0.6rem;
            background: none;
            border: none;
            border-radius: var(--radius-m);
            color: var(--text);
            font-family: inherit;
            font-size: inherit;
            text-align: left;
            cursor: pointer;
        }

        /* A chevron: pointing right, or down while the book's chapters
           show. */
        .book-item::after {
            content: "";
            flex: none;
            width: 0.4rem;
            height: 0.4rem;
            border-right: 1.5px solid var(--text-dim);
            border-bottom: 1.5px solid var(--text-dim);
            transform: rotate(-45deg);
        }

        .book-item[aria-expanded="true"]::after {
            transform: rotate(45deg);
        }

        .picker-random:hover,
        .book-item:hover {
            background: rgba(var(--accent-rgb), 0.12);
        }

        /* The book being read. */
        .book-item[aria-current="true"] {
            color: var(--accent);
        }

        /* A book's chapters: round pills, six to a row. */
        .chapter-grid {
            display: grid;
            grid-template-columns: repeat(6, 2rem);
            gap: 0.3rem;
            padding: 0.3rem 0.6rem 0.7rem;
        }

        .chapter-btn {
            width: 2rem;
            height: 2rem;
            padding: 0;
            border: 1px solid var(--accent-dim);
            border-radius: 50%;
            background: var(--panel-bg);
            font-family: inherit;
            font-size: 0.85rem;
            font-variant-numeric: tabular-nums;
            color: var(--text);
            cursor: pointer;
        }

        .chapter-btn:hover {
            background: rgba(var(--accent-rgb), 0.3);
            border-color: var(--accent);
        }

        /* The chapter being read. */
        .chapter-btn[aria-current="page"] {
            background: var(--accent);
            color: var(--on-accent);
            border-color: var(--accent);
        }

        /* Psalms, and any book over 50 chapters: a compact numeric grid,
           ten to a row, rather than rows and rows of pills. It reaches into
           the picker's side padding, with a hairline between cells, so
           "150" has room on both sides: in the 18rem sidebar each cell is
           about 27px wide (21px of digits), in the popover about 30px; a
           Windows scrollbar still leaves over 24px. */
        .chapter-grid.is-compact {
            grid-template-columns: repeat(10, minmax(0, 1fr));
            gap: 0.15rem 1px;
            margin: 0 -0.35rem;
            padding: 0.3rem 0 0.7rem;
        }

        /* The focus ring inside the cell, so the picker's edge doesn't
           clip it and it doesn't cover the next number. */
        .chapter-grid.is-compact .chapter-btn:focus-visible {
            outline-offset: -2px;
        }

        /* Borderless, so "150" fits a tenth of the sidebar. */
        .chapter-grid.is-compact .chapter-btn {
            width: auto;
            height: 1.7rem;
            border: none;
            border-radius: var(--radius-s);
            font-size: 0.72rem;
        }

        .reading-row {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: var(--row-gap);
        }

        /* The chapter being read: its Width when there's room, and never
           narrower than --column-min because of its neighbors (they shrink
           far faster, and hide first; see below). While comparing it takes
           the whole row. Positioned: the selection card is placed in it. */
        .chapter-main {
            position: relative;
            flex: 1 1 var(--column);
            max-width: var(--column);
            min-width: min(var(--column-min), 100%);
        }

        .reading-row.is-comparing .chapter-main {
            max-width: none;
        }

        /* The chapter being read sits in the wide center column. The chapter
           before and after it (same book, or the neighboring book once a
           book's first/last chapter is reached) sit in full, at reduced
           opacity, in narrower side columns — and scroll along with the
           page as one continuous reading surface, not as separate boxes. */
        .chapter-side {
            flex: 0 50 var(--side-width);
            min-width: var(--side-min);
            max-width: var(--side-width);
            opacity: 0.55;
            transition: opacity 0.2s;
        }

        .chapter-side:hover {
            opacity: 0.95;
        }

        .chapter-side .verse {
            font-size: calc(0.9rem * var(--reading-scale));
            line-height: calc(var(--reading-leading) - 0.1);
        }

        /* The neighbors show no footnote markers, only verse numbers. */
        .chapter-side .verse-num {
            text-shadow: var(--verse-num-outline-faded);
        }

        .chapter-heading-link {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            border-bottom: 1px solid var(--rule);
            font-family: var(--font-scripture);
            font-size: 1.2rem;
            color: var(--accent);
            margin-bottom: 0.8rem;
            padding: 0 0 0.4rem;
            cursor: pointer;
        }

        .chapter-heading-link:hover {
            text-decoration: underline;
        }

        /* In a missing neighbor's place: its heading's look, then a line
           in the neighbors' text, faded with them. */
        .edge-card-title {
            font-family: var(--font-scripture);
            font-size: 1.2rem;
            color: var(--accent);
            border-bottom: 1px solid var(--rule);
            margin-bottom: 0.8rem;
            padding-bottom: 0.4rem;
        }

        .edge-card-detail {
            font-family: var(--font-scripture);
            font-size: 0.9rem;
            color: var(--text);
        }

        /* The neighbors never squeeze the chapter being read below
           --column-min (400px, about 50 characters a line at Medium). With
           both at --side-min (180px), the gaps (20px each) and the page's
           padding (48px), that takes an 848px window; below it only the
           next chapter shows, and below 648px (400 + 180 + 20 + 48) neither
           does. The sidebar takes 264px but only shows from 1200px, which
           leaves 888px: always room for both, at any Width (the floor is the
           same for all three). Display only: the neighbors stay in the DOM,
           so the arrow keys and their headings work the same. */
        @media (max-width: 847px) {
            .chapter-side-prev {
                display: none;
            }
        }

        /* Alone, the chapter fills the narrow window (at most 592px here,
           about 74 characters), as it always has. */
        @media (max-width: 647px) {
            .chapter-side-next {
                display: none;
            }

            .chapter-main {
                max-width: none;
            }
        }

        .chapter-heading {
            font-family: var(--font-scripture);
            font-size: calc(1.5rem * var(--reading-scale));
            font-weight: normal;
            color: var(--accent);
            margin-bottom: 0.8rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid var(--rule);
            text-shadow: var(--glow);
        }

        .verse {
            font-family: var(--font-scripture);
            font-size: calc(1.05rem * var(--reading-scale));
            line-height: var(--reading-leading);
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        /* Findable, not read: regular weight, a little smaller than the
           text around them, in tabular figures so they line up. */
        .verse-num {
            display: inline-block;
            min-width: 1.4rem;
            font-family: var(--font-scripture);
            font-size: calc(0.64rem * var(--reading-scale));
            font-weight: normal;
            font-variant-numeric: tabular-nums;
            color: var(--verse-num-color);
            text-shadow: var(--verse-num-outline);
            vertical-align: super;
            margin-right: 0.2rem;
        }

        .chapter-main .verse {
            position: relative;
        }

        /* Every verse of the chapter being read is selectable (click, then
           Shift-click to extend). The faded neighbors aren't: they stay
           plain text. */
        .chapter-main .chapter-text > .verse[data-translation] {
            cursor: pointer;
        }

        /* The 4px spread on each side exactly fills the 0.5rem gap between
           verses, so a selected range reads as one continuous block. */
        .chapter-main .verse.verse-selected {
            background: rgba(var(--accent-rgb), 0.12);
            border-radius: var(--radius-s);
            box-shadow: 0 0 0 4px rgba(var(--accent-rgb), 0.12);
        }

        /* Flowing (Aa's Layout): the chapter runs on as prose, in the
           chapter being read, its faded neighbors and reading mode, and
           when printed. Each verse is an inline run of the one paragraph,
           its number small and raised in the quiet --accent-2 (as
           --verse-num-color), a space between verses. Presentation only:
           the verses are the same elements, with the same text. Compare
           has no .chapter-text (its grid is a verse to a row), so it's
           untouched. */
        :root[data-layout="flowing"] .chapter-text {
            font-family: var(--font-scripture);
            font-size: calc(1.05rem * var(--reading-scale));
            line-height: var(--reading-leading);
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        :root[data-layout="flowing"] .chapter-side .chapter-text {
            font-size: calc(0.9rem * var(--reading-scale));
            line-height: calc(var(--reading-leading) - 0.1);
        }

        :root[data-layout="flowing"] .chapter-text > .verse {
            display: inline;
            margin: 0;
        }

        /* Raised without raising the line: no line height of its own. */
        :root[data-layout="flowing"] .chapter-text > .verse > .verse-num {
            display: inline;
            min-width: 0;
            line-height: 0;
            margin-right: 0.2em;
        }

        /* A verse's own runs, line by line: the selection tint, and on
           hover a fainter wash, so where one verse ends is clear without
           chopping up the text. Both keep --text at AA in every theme
           (see the palette tests). */
        :root[data-layout="flowing"] .chapter-main .chapter-text > .verse {
            border-radius: var(--radius-s);
            -webkit-box-decoration-break: clone;
            box-decoration-break: clone;
        }

        /* :where() keeps the wash's specificity at the selection tint's,
           so a selected verse under the pointer keeps its tint. */
        :root[data-layout="flowing"] .chapter-main .chapter-text > .verse:where([data-translation]):hover {
            background: rgba(var(--accent-rgb), 0.06);
        }

        :root[data-layout="flowing"] .chapter-main .chapter-text > .verse.verse-selected {
            background: rgba(var(--accent-rgb), 0.12);
            box-shadow: none;
        }

        /* Actions for the current verse selection. Shown under the last
           selected verse, or at the top of a single verse's
           cross-reference popup when it has one. */
        .verse-actions {
            font-family: var(--font-ui);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.4rem 0.7rem;
            margin-top: 0.4rem;
            padding: 0.5rem 0.8rem;
            background: var(--panel-bg);
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-m);
            font-size: 0.85rem;
            line-height: 1.4;
            cursor: default;
        }

        /* The selection card floats over the text (see placeCard): out
           of the flow, opaque, at most a set height with its own scroll,
           so a long list of notes or cross-references never covers the
           window. Docked, it sits at the bottom of the window. */
        .selection-card {
            position: absolute;
            z-index: 12;
            top: 0;
            left: 0;
            width: min(100%, 34rem);
            max-height: min(24rem, calc(100vh - var(--bar-height) - 2rem));
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 0.6rem 0.8rem;
            font-family: var(--font-ui);
            font-size: 0.85rem;
            line-height: 1.4;
            color: var(--text);
            background: var(--option-bg);
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-l);
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.35);
            cursor: default;
        }

        .selection-card.is-docked {
            position: fixed;
            top: auto;
            bottom: 0.5rem;
            max-height: min(45vh, 20rem);
        }

        /* Holding Shift turns the card into a faint ghost that clicks go
           through, so a Shift-click reaches the verse under it (see
           syncCardGhost). Only opacity and pointer-events change: the
           card neither moves nor resizes, and it stays in the
           accessibility tree. */
        .selection-card.is-ghost,
        .selection-card.is-ghost * {
            pointer-events: none;
        }

        .selection-card.is-ghost {
            opacity: 0.18;
        }

        @media (prefers-reduced-motion: no-preference) {
            .selection-card {
                transition: opacity 0.1s ease;
            }
        }

        .selection-card > * + * {
            margin-top: 0.6rem;
        }

        .selection-card > [hidden] {
            display: none;
        }

        .selection-card .verse-actions {
            margin: 0;
            padding: 0 0 0.5rem;
            background: none;
            border: none;
            border-bottom: 1px solid var(--accent-dim);
            border-radius: 0;
        }

        /* Cross-references as inline chips: "Romans 5:8 · 1 John 4:9-10". */
        .xref-chips {
            display: inline;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .xref-chips li {
            display: inline;
        }

        .xref-chips li + li::before {
            content: '\00b7';
            margin: 0 0.45rem;
            color: var(--text-dim);
        }

        .selection-xref-row + .selection-xref-row {
            margin-top: 0.3rem;
        }

        .selection-xref-verse {
            margin-right: 0.5rem;
            color: var(--text-dim);
        }

        /* The chip whose passage is showing: ringed, like a pressed key. */
        .xref-citation[aria-expanded="true"] {
            text-decoration: none;
            border-radius: var(--radius-s);
            box-shadow: 0 0 0 1px var(--accent-2);
            background: rgba(var(--accent-rgb), 0.05);
        }

        /* A cross-reference read in place, under its chip's row: its
           reference, its verses as prose in the reading font, and Go to. */
        .xref-preview {
            margin-top: 0.5rem;
            padding: 0.5rem 0.6rem;
            border-left: 2px solid var(--accent-2);
            background: rgba(var(--accent-rgb), 0.05);
            border-radius: 0 var(--radius-s) var(--radius-s) 0;
        }

        .xref-preview > * {
            margin: 0;
        }

        .xref-preview > * + * {
            margin-top: 0.4rem;
        }

        .xref-preview-title {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .xref-preview-text {
            font-family: var(--font-scripture);
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text);
        }

        .xref-preview-num {
            font-size: 0.65em;
            line-height: 0;
            vertical-align: super;
            margin-right: 0.2em;
            color: var(--accent-2);
            font-variant-numeric: tabular-nums;
        }

        .xref-preview-notice {
            font-style: italic;
            color: var(--text-dim);
        }

        .xref-preview-go {
            padding: 0;
            font: inherit;
            color: var(--accent-2);
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: underline dotted;
        }

        .xref-preview-go:hover,
        .xref-preview-go:focus-visible {
            text-decoration: underline solid;
        }

        .verse-copy-btn,
        .verse-copy-as-btn,
        .verse-bookmark-btn,
        .verse-note-btn,
        .highlight-remove {
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--accent);
            background: var(--panel-bg);
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-m);
            padding: 0.2rem 0.7rem;
            cursor: pointer;
        }

        .verse-copy-btn:hover,
        .verse-copy-as-btn:hover,
        .verse-bookmark-btn:hover,
        .verse-note-btn:hover,
        .highlight-remove:hover {
            border-color: var(--accent);
        }

        .verse-copy-btn:focus-visible,
        .verse-copy-as-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* Copy as…: the formats, a short list under the card's actions
           (or under Copy chapter), opaque like the popovers. */
        .copy-as-menu {
            display: flex;
            flex-direction: column;
            width: max-content;
            max-width: 100%;
            margin: 0.5rem 0 0.25rem;
            padding: 0.3rem 0;
            font-family: var(--font-ui);
            background: var(--option-bg);
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-m);
        }

        .copy-as-menu[hidden] {
            display: none;
        }

        .chapter-copy + .copy-as-menu {
            margin: 0.5rem auto 0;
        }

        .copy-as-item {
            text-align: left;
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--text);
            background: none;
            border: none;
            padding: 0.4rem 0.9rem;
            cursor: pointer;
        }

        .copy-as-item:hover,
        .copy-as-item:focus {
            background: rgba(var(--accent-rgb), 0.15);
        }

        .copy-as-item:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        /* A small star after the number of every bookmarked verse. A
           pseudo-element, so it's never part of the verse's text. */
        .chapter-main .verse.is-bookmarked .verse-num::after {
            content: '\2605';
            margin-left: 0.15rem;
            color: var(--verse-num-color);
        }

        /* A small pencil, the same way, after the number of every verse
           with a note (however many), and after the star when it's
           bookmarked too. Its shape differs from the star, the highlight
           band and the selection tint. Screen readers get the verse's
           .note-cue instead, once per verse. */
        .chapter-main .verse.has-notes .verse-num::after {
            content: '\270E';
            margin-left: 0.15rem;
            color: var(--verse-num-color);
        }

        .chapter-main .verse.is-bookmarked.has-notes .verse-num::after {
            content: '\2605\2009\270E';
        }

        /* A verse's "has notes" and "has footnotes" are for screen
           readers only: they're never copied with the verse's text. */
        .note-cue,
        .footnote-cue {
            -webkit-user-select: none;
            user-select: none;
        }

        /* KJV words the translators supplied, in italics as printed KJVs
           set them. */
        .supplied {
            font-style: italic;
        }

        /* A KJV margin note's marker, where the note stood: a small
           letter, in the verse numbers' color. Clicking the verse (marker
           included) shows its footnotes; the marker is no tab stop of its
           own, isn't read out (the verse's .footnote-cue is, once) and is
           never copied with the verse's text. */
        .fn-marker {
            font-size: 0.64em;
            font-style: normal;
            font-weight: normal;
            line-height: 0;
            vertical-align: super;
            margin-left: 0.1em;
            color: var(--verse-num-color);
            text-shadow: var(--verse-num-outline);
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Two notes in a row read as "a b", not as one marker "ab". */
        /* A verse number inside a footnote (the BSB's "²¹But this kind"):
           small and raised, as the reader's are, without opening up its
           line. */
        .footnote-verse {
            font-size: 0.75em;
            line-height: 0;
            vertical-align: super;
            margin-right: 0.15em;
        }

        .fn-marker + .fn-marker {
            margin-left: 0.3em;
        }

        /* Read by screen readers, never shown. */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
            border: 0;
        }

        /* The notes on the selected verses, under their actions: each
           note's passage, date and text (three lines of it until "more"),
           read-only, with Edit. The text keeps the reader's line breaks. */
        .verse-notes {
            font-family: var(--font-ui);
            display: block;
            margin-top: 0.4rem;
            padding: 0.5rem 0.8rem;
            background: var(--panel-bg);
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-m);
            font-size: 0.85rem;
            line-height: 1.45;
            cursor: default;
        }

        .selection-card .verse-notes {
            margin: 0;
            padding: 0 0 0.5rem;
            background: none;
            border: none;
            border-bottom: 1px solid var(--accent-dim);
            border-radius: 0;
        }

        .verse-notes-title {
            font-size: 0.75rem;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
        }

        .note-card {
            padding: 0.4rem 0;
            border-bottom: 1px solid var(--accent-dim);
        }

        .note-card:last-of-type {
            border-bottom: none;
        }

        .note-card-head {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.2rem 0.6rem;
        }

        .note-card-ref {
            color: var(--accent);
        }

        .note-card-date {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .note-card-body {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            overflow: hidden;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            color: var(--text);
            margin: 0.15rem 0;
        }

        .note-card-body.is-expanded {
            display: block;
            -webkit-line-clamp: none;
            line-clamp: none;
        }

        .note-card-actions {
            display: flex;
            gap: 0.8rem;
        }

        .note-link {
            font-family: inherit;
            font-size: 0.8rem;
            color: var(--accent-2);
            background: none;
            border: none;
            padding: 0;
            text-decoration: underline;
            text-underline-offset: 2px;
            cursor: pointer;
        }

        .note-link:focus-visible,
        .verse-note-btn:focus-visible,
        .note-list-edit:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .note-show-all {
            margin-top: 0.3rem;
        }

        /* Highlights: the verse's text marked in the reader's color, like a
           highlighter pen, in bands behind each line of text. That's a
           different shape from the selection (a tint behind the whole
           verse) and from the bookmark star, so the three never look
           alike. In the faded neighboring chapters a highlight fades with
           the text. */
        .verse[data-highlight] .verse-text {
            border-radius: var(--radius-s);
            padding: 0.08em 0.12em;
            -webkit-box-decoration-break: clone;
            box-decoration-break: clone;
        }

        .verse[data-highlight="yellow"] .verse-text {
            background: var(--hl-yellow);
        }

        .verse[data-highlight="green"] .verse-text {
            background: var(--hl-green);
        }

        .verse[data-highlight="blue"] .verse-text {
            background: var(--hl-blue);
        }

        .verse[data-highlight="pink"] .verse-text {
            background: var(--hl-pink);
        }

        /* The four color swatches in the selection's actions. The color
           a whole selection already has is pressed: a heavier ring and a
           check mark, so it doesn't rely on color alone. */
        .verse-highlight {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .highlight-swatch {
            width: 1.6rem;
            height: 1.6rem;
            padding: 0;
            border: 1px solid var(--accent-dim);
            border-radius: 50%;
            font-family: inherit;
            font-size: 0.85rem;
            line-height: 1;
            color: var(--text);
            cursor: pointer;
        }

        .highlight-swatch[data-color="yellow"] {
            background: var(--hl-yellow);
        }

        .highlight-swatch[data-color="green"] {
            background: var(--hl-green);
        }

        .highlight-swatch[data-color="blue"] {
            background: var(--hl-blue);
        }

        .highlight-swatch[data-color="pink"] {
            background: var(--hl-pink);
        }

        .highlight-swatch:hover {
            border-color: var(--accent);
        }

        .highlight-swatch[aria-pressed="true"] {
            border: 2px solid var(--accent);
        }

        .highlight-swatch[aria-pressed="true"]::after {
            content: '\2713';
        }

        .highlight-swatch:focus-visible,
        .highlight-remove:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .reader-notice:not([hidden]) {
            display: block;
            margin-bottom: 1rem;
            padding: 0.6rem 0.9rem;
            background: var(--panel-bg);
            border: 1px solid var(--accent);
            border-radius: var(--radius-m);
            font-size: 0.9rem;
        }

        /* A chapter that couldn't be read: Try again, after the sentence. */
        .reader-notice .reading-retry {
            font-size: inherit;
        }

        /* Compare: one column per translation, one grid row per verse
           number, so verses with the same number always sit side by side
           and both columns scroll together with the page. */
        .compare-grid {
            display: grid;
            grid-template-columns: repeat(var(--compare-columns, 2), minmax(0, 1fr));
            column-gap: 1.5rem;
            align-items: start;
        }

        /* Stuck just below the top bar (which would hide it at top: 0). */
        .compare-head {
            position: sticky;
            top: var(--bar-height);
            z-index: 1;
            background: var(--option-bg);
            color: var(--accent);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.4rem 0;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid var(--accent-dim);
        }

        .compare-head-code {
            color: var(--text-dim);
        }

        .compare-gap {
            font-size: calc(0.9rem * var(--reading-scale));
            line-height: var(--reading-leading);
            margin-bottom: 0.5rem;
            color: var(--text-dim);
            font-style: italic;
            border: 1px dashed var(--accent-dim);
            border-radius: var(--radius-s);
            padding: 0 0.4rem;
        }

        /* Too narrow for columns: each verse number's translations stack,
           each labeled with its translation's code. */
        @media (max-width: 640px) {
            .compare-grid {
                grid-template-columns: minmax(0, 1fr);
            }

            .compare-head {
                display: none;
            }

            .compare-grid > [data-code]::before {
                content: attr(data-code);
                display: inline-block;
                margin-right: 0.4rem;
                font-size: 0.65rem;
                font-style: normal;
                letter-spacing: 0.05em;
                color: var(--text-dim);
            }
        }

        .verse-actions-ref {
            color: var(--text-dim);
        }

        .verse-actions-status {
            color: var(--accent);
        }

        .verse-actions-status.is-error {
            color: var(--text);
            font-weight: bold;
        }

        .xref-popup-title {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
            margin-bottom: 0.4rem;
        }

        .xref-citation {
            background: none;
            border: none;
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--accent-2);
            cursor: pointer;
            padding: 0;
            text-decoration: underline dotted;
        }

        .xref-citation:hover {
            text-decoration: underline solid;
        }

        .xref-summary {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--rule);
        }

        .xref-summary-title {
            font-size: 1rem;
            font-weight: normal;
            color: var(--accent);
        }

        /* The chapter's Cross References and Footnotes lists: a verse
           label column, and each row's citations or footnote wrapping in
           the column beside it (a hanging indent), never under the label.
           Rows share their list's columns, so every label in a list takes
           the width of the widest, and both lists start their text at
           least 3.6rem in, so they line up with each other too. */
        .xref-summary-list,
        .footnote-list {
            display: grid;
            grid-template-columns: minmax(3.6rem, max-content) minmax(0, 1fr);
            column-gap: 0.6rem;
        }

        .xref-summary-row,
        .footnote-row {
            display: grid;
            grid-column: 1 / -1;
            grid-template-columns: subgrid;
        }

        .xref-summary-row {
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
        }

        .xref-summary-verse {
            color: var(--accent-2);
        }

        .xref-summary-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        /* A citation in the list opens its passage: quiet until hovered or
           focused, when it's underlined like a link. */
        .xref-summary-chip {
            padding: 0;
            font: inherit;
            color: var(--accent-2);
            background: none;
            border: none;
            border-radius: var(--radius-s);
            text-align: start;
            cursor: pointer;
        }

        .xref-summary-chip:hover,
        .xref-summary-chip:focus-visible {
            text-decoration: underline;
            text-underline-offset: 0.15em;
        }

        /* Outside the link, so neither underlined nor ringed with it. */
        .xref-summary-item:not(:last-child)::after {
            content: ',';
            color: var(--text-dim);
        }

        .xref-credit {
            margin-top: 0.8rem;
            font-size: 0.7rem;
            font-style: italic;
            color: var(--text-dim);
        }

        .xref-credit a {
            color: var(--accent-2);
        }

        /* The chapter's footnotes (the KJV's or the BSB's), above its
           cross-references and styled like them: "119:105a lamp: or,
           candle". */
        .footnote-summary {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--rule);
        }

        .footnote-summary-title {
            font-size: 1rem;
            font-weight: normal;
            color: var(--accent);
        }

        .footnote-row {
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
        }

        .footnote-ref {
            color: var(--accent-2);
        }

        .footnote-text {
            color: var(--text-dim);
            min-width: 0;
            overflow-wrap: anywhere;
        }

        /* A verse's footnotes in its popup, above its cross-references. */
        .popup-footnotes {
            display: block;
        }

        .footnote-entry {
            display: block;
            margin-bottom: 0.3rem;
            line-height: 1.45;
        }

        .footnote-label {
            color: var(--accent-2);
            margin-right: 0.3rem;
        }

        /* The chapter ends with a next step: the chapters before and
           after it, as two large buttons in the UI sans (only the one
           there is, at Genesis 1 and Revelation 22), then the keys' hint
           in one quiet line. */
        .chapter-end {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 2rem;
            font-family: var(--font-ui);
        }

        .chapter-step {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            min-height: 3rem;
            padding: 0.6rem 1.25rem;
            font-family: var(--font-ui);
            font-size: 1rem;
            color: var(--accent);
            background: var(--option-bg);
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-l);
            cursor: pointer;
        }

        .chapter-step-next {
            margin-left: auto;
        }

        .chapter-step:hover {
            border-color: var(--accent);
        }

        .chapter-step:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* One quiet line, its keys as small caps alike. A cap's own
           opaque --option-bg keeps its key AA in every theme. */
        .nav-hint {
            text-align: center;
            font-family: var(--font-ui);
            font-size: 0.75rem;
            line-height: 1.9;
            color: var(--text-dim);
            margin-top: 0.75rem;
        }

        .nav-hint kbd,
        .shortcut-keys kbd {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 1.6em;
            height: 1.6em;
            padding: 0 0.35em;
            margin: 0 0.1em;
            vertical-align: middle;
            font-family: var(--font-ui);
            font-size: 1em;
            line-height: 1;
            color: var(--text-dim);
            background: var(--option-bg);
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-s);
        }

        .nav-hint kbd svg,
        .shortcut-keys kbd svg {
            width: 1em;
            height: 1em;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Copy chapter: one quiet line under the keys' hint, below the
           next-chapter buttons rather than beside them. */
        .chapter-copy {
            text-align: center;
            margin-top: 0.25rem;
        }

        .chapter-copy-btn {
            font-family: var(--font-ui);
            font-size: 0.75rem;
            color: var(--text-dim);
            background: none;
            border: none;
            padding: 0.2rem 0.4rem;
            cursor: pointer;
            text-decoration: underline dotted;
            text-underline-offset: 0.2em;
        }

        .chapter-copy-btn:hover {
            color: var(--accent);
        }

        .chapter-copy-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* The chapter's Footnotes and Cross references are disclosures,
           closed until opened; each kind remembers being opened or closed
           for every chapter. Printing opens both. */
        .disclosure-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.2rem 0;
            font-family: var(--font-ui);
            font-size: 1rem;
            font-weight: normal;
            color: var(--text);
            background: none;
            border: none;
            cursor: pointer;
        }

        .disclosure-toggle:hover {
            text-decoration: underline;
        }

        .disclosure-toggle:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: var(--radius-s);
        }

        /* In --accent, as a mark (3:1 is enough, and every theme's
           --accent is), with the label in --text. */
        .disclosure-chevron {
            color: var(--accent);
            width: 0.45rem;
            height: 0.45rem;
            border-right: 2px solid currentColor;
            border-bottom: 2px solid currentColor;
            transform: rotate(-45deg);
            transition: transform 0.15s;
        }

        .disclosure-toggle[aria-expanded="true"] .disclosure-chevron {
            transform: rotate(45deg);
        }

        .disclosure-body {
            margin-top: 0.6rem;
        }

        /* The lists are grids, which would otherwise win over [hidden]. */
        .disclosure-body[hidden] {
            display: none;
        }

        /* Printing should show just the chapter being read — its heading
           and verses — not the app chrome around it, which is meaningless
           on paper, or anything tied to on-screen interaction like the
           cross-reference popups. The custom properties are reset to
           black-on-white here rather than overriding every themed rule
           individually, so a printed page looks the same regardless of
           which on-screen theme was active; !important is needed because
           `:root[data-theme="..."]` is more specific than a plain `:root`
           rule and would otherwise win its color back for print. */
        @media print {
            :root {
                --bg: #ffffff !important;
                --text: #000000 !important;
                --text-dim: #333333 !important;
                --accent: #000000 !important;
                --accent-rgb: 0, 0, 0 !important;
                --accent-dim: #000000 !important;
                --accent-2: #000000 !important;
                --rule: #000000 !important;
                --glow: none !important;
                --panel-bg: transparent !important;
                --verse-num-color: #000000 !important;
                --verse-num-outline: none !important;
                --verse-num-outline-faded: none !important;
                --option-bg: #ffffff !important;
                --on-accent: #ffffff !important;
                /* Highlights aren't printed. */
                --hl-yellow: transparent !important;
                --hl-green: transparent !important;
                --hl-blue: transparent !important;
                --hl-pink: transparent !important;
                /* Printed type is always the default size and spacing,
                   whatever reading-comfort presets are saved on screen. */
                --reading-scale: 1 !important;
                --reading-leading: 1.7 !important;
            }

            .top-bar,
            .popover,
            .library-panel,
            .toast,
            .reader-exit,
            .picker,
            .chapter-side,
            .nav-hint,
            .chapter-end,
            .chapter-copy,
            .copy-as-menu,
            .disclosure-chevron,
            .selection-card,
            .verse-actions,
            .verse-notes,
            .search-toggle,
            .search-panel,
            .reader-notice,
            .import-overlay,
            .welcome-overlay,
            .modal-overlay,
            .update-banner,
            .margin-notes,
            .margin-marker {
                display: none !important;
            }

            .chapter-main .verse.is-bookmarked .verse-num::after {
                content: none !important;
            }

            .chapter-main .verse.has-notes .verse-num::after {
                content: none !important;
            }

            body {
                background: #ffffff !important;
                color: #000000 !important;
            }

            .chapter-heading {
                text-shadow: none !important;
            }

            .chapter-main .verse.verse-selected {
                background: none !important;
                box-shadow: none !important;
            }

            /* Footnotes and Cross references print open, whatever they
               show on screen. */
            .disclosure-body[hidden] {
                display: block !important;
            }

            .disclosure-toggle {
                padding: 0;
                color: #000000 !important;
            }
        }
    </style>
    <script>
        // The saved look, before the first frame: each saved setting as its
        // data attribute on <html> (none for its default), which the CSS
        // keys off, then the book and chapter picker's shape, so the page
        // is laid out for it from the start. Only that: the page's Rust
        // pieces keep the settings (ui-leptos/src/aa.rs) and the picker's
        // shape (ui-leptos/src/surfaces.rs) from then on, and without them
        // the Bible text still shows in the saved look. The table is
        // generated from shared/preferences.rs (prepaint_script); a test
        // keeps the two the same.
        (function () {
            'use strict';
            var data = document.documentElement.dataset;
            // Local storage key, data attribute, default, the values it
            // may have (null: a translation's code), renamed values.
            var SAVED = [
                ['gospel-getter-theme', 'theme', 'chi-rho', ['chi-rho', 'vellum', 'system', 'vaporwave', 'classic-dark', 'classic-light', 'matrix', 'beast-slayer', 'hot-pink'], { 'monster-hunter': 'beast-slayer' }],
                ['gospel-getter-text-size', 'textSize', 'medium', ['small', 'medium', 'large', 'x-large'], {}],
                ['gospel-getter-line-spacing', 'lineSpacing', 'normal', ['compact', 'normal', 'relaxed'], {}],
                ['gospel-getter-width', 'width', 'normal', ['narrow', 'normal', 'wide'], {}],
                ['gospel-getter-layout', 'layout', 'verses', ['verses', 'flowing'], {}],
                ['gospel-getter-reader-mode', 'readerMode', 'off', ['off', 'on'], {}],
                ['gospel-getter-compare', 'compare', 'off', ['off', 'on'], {}],
                ['gospel-getter-compare-with', 'compareWith', '', null, {}],
                ['gospel-getter-sidebar', 'sidebar', 'open', ['open', 'closed'], {}],
                ['gospel-getter-update-check', 'updateCheck', 'on', ['on', 'off'], {}],
                ['gospel-getter-margin-notes', 'marginNotes', 'on', ['on', 'off'], {}],
            ];
            SAVED.forEach(function (pref) {
                var value = null;
                try {
                    value = localStorage.getItem(pref[0]);
                } catch (e) {}
                if (value && Object.prototype.hasOwnProperty.call(pref[4], value)) value = pref[4][value];
                var valid = pref[3] ? pref[3].indexOf(value) !== -1 : typeof value === 'string' && /^[a-z0-9]{1,16}$/.test(value);
                if (valid && value !== pref[2]) data[pref[1]] = value;
                else delete data[pref[1]];
            });
            // A sidebar on a window this wide, unless the reader hid it;
            // never in reading mode.
            var wide = !!(window.matchMedia && window.matchMedia('(min-width: 1200px)').matches);
            if (wide) data.wide = '';
            else delete data.wide;
            if (wide && data.sidebar !== 'closed' && data.readerMode !== 'on') data.picker = 'sidebar';
            else delete data.picker;
        })();
    </script>
    <script>
        // Boot's first two questions, asked now, while the page's Rust
        // pieces load: where the reader was (get_home), then, with its
        // answer, that chapter (get_reading, in the translation the reader
        // will select; not while comparing, when the reader asks for it
        // beside the comparison). Only that: the pieces take both over
        // (ui-leptos/src/boot.rs), asking for them with a
        // gospel-getter:boot event, and draw the chapter.
        (function () {
            'use strict';
            var invoke = window.__TAURI__.core.invoke;
            var boot = { home: null, failed: false, error: null, reading: null, answered: null };
            boot.asked = invoke('get_home').then(function (home) {
                var code = home.translations.some(function (t) {
                    return t.code === home.currentTranslationCode;
                }) ? home.currentTranslationCode : (home.translations.length ? home.translations[0].code : '');
                if (document.documentElement.dataset.compare !== 'on') {
                    boot.reading = invoke('get_reading', { bookId: home.currentBookId, chapter: home.currentChapter, translationCode: code });
                    boot.reading.then(function (dto) {
                        boot.answered = { dto: dto };
                    }, function () {});
                }
                boot.home = home;
            }).catch(function (e) {
                boot.failed = true;
                boot.error = e;
            });
            document.addEventListener('gospel-getter:boot', function (event) {
                event.preventDefault();
                event.detail.boot = boot;
            });
        })();
    </script>
    <!-- The page's Rust pieces (ui-leptos/, compiled to WebAssembly by Trunk):
         Trunk inlines the loader here, which fetches and compiles them while
         the page loads and starts them once it has been read. See
         ui-leptos/README.md. -->
    <link data-trunk rel="inline" href="leptos-loader.js" type="js" />
</head>
<body>
    <div id="top-bar" class="top-bar">
        <button type="button" id="sidebar-toggle" class="bar-btn sidebar-toggle" aria-label="Books and chapters" title="Show or hide books and chapters" aria-controls="picker" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
        <button type="button" id="ref-btn" class="ref-btn" aria-label="Choose a book and chapter" title="Choose a book and chapter (G)" aria-keyshortcuts="G" aria-controls="picker" aria-expanded="false"><span id="ref-text" class="ref-text"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"/></svg></button>
        <button type="button" id="reader-exit" class="reader-exit">Exit reading mode <span aria-hidden="true">(Esc)</span></button>
        <div class="bar-item">
            <button type="button" id="translation-toggle" class="bar-btn translation-toggle" aria-label="Translation" title="Translation and compare (T)" aria-keyshortcuts="T" aria-haspopup="dialog" aria-controls="translation-popover" aria-expanded="false"></button>
            <div id="translation-popover" class="popover translation-popover" role="dialog" aria-label="Translation and compare" hidden>
                <div class="aa-section">
                    <span class="section-label" id="translation-label">Translation</span>
                    <div id="translation-choices" class="translation-list" role="radiogroup" aria-labelledby="translation-label"></div>
                    <select id="translation-select" hidden></select>
                    <div class="aa-row compare-row">
                        <button type="button" id="compare-btn" class="reader-mode-btn compare-btn" aria-pressed="false" title="Compare the translation you're reading with another, side by side (C)">Compare <span aria-hidden="true">(C)</span></button>
                        <span class="compare-with-label" aria-hidden="true">with</span>
                        <div id="compare-with-choices" class="segmented" role="group" aria-label="Compare with"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="bar-item">
            <button type="button" id="aa-toggle" class="bar-btn aa-toggle" aria-label="Display" title="Text and display" aria-haspopup="dialog" aria-controls="aa-popover" aria-expanded="false">Aa</button>
            <div id="aa-popover" class="popover aa-popover" role="dialog" aria-label="Display" hidden>
                <div class="aa-section">
                    <span class="section-label" id="text-size-label">Text size</span>
                    <div class="size-stepper" role="group" aria-labelledby="text-size-label">
                        <button type="button" id="text-size-down" class="stepper-btn stepper-smaller" aria-label="Smaller text" title="Smaller text">A&minus;</button>
                        <output id="text-size-value" aria-live="polite"></output>
                        <button type="button" id="text-size-up" class="stepper-btn stepper-larger" aria-label="Larger text" title="Larger text">A+</button>
                    </div>
                    <select id="text-size-select" hidden></select>
                </div>
                <div class="aa-section">
                    <span class="section-label" id="line-spacing-label">Line spacing</span>
                    <div id="line-spacing-choices" class="segmented" role="group" aria-labelledby="line-spacing-label"></div>
                    <select id="line-spacing-select" hidden></select>
                </div>
                <div class="aa-section">
                    <span class="section-label" id="width-label">Width</span>
                    <div id="width-choices" class="segmented" role="group" aria-labelledby="width-label"></div>
                    <select id="width-select" hidden></select>
                </div>
                <div class="aa-section">
                    <span class="section-label" id="layout-label">Layout</span>
                    <div id="layout-choices" class="segmented" role="group" aria-labelledby="layout-label" aria-describedby="layout-note"></div>
                    <p id="layout-note" class="section-note layout-note" hidden>Compare always shows a verse to a row.</p>
                    <select id="layout-select" hidden></select>
                </div>
                <div class="aa-section">
                    <span class="section-label" id="theme-label">Theme</span>
                    <div id="theme-choices" class="theme-swatches" role="group" aria-labelledby="theme-label"></div>
                    <p id="theme-name" class="theme-name" aria-hidden="true"></p>
                    <select id="theme-select" hidden></select>
                </div>
                <div class="aa-section">
                    <button type="button" id="reader-mode-btn" class="reader-mode-btn" aria-pressed="false">Reading mode</button>
                    <button type="button" id="margin-notes-btn" class="reader-mode-btn margin-notes-btn" aria-pressed="true" title="Your notes beside the text, in reading mode">Notes in the margin</button>
                </div>
            </div>
        </div>
        <button type="button" id="library-toggle" class="bar-btn" aria-label="Library: bookmarks, highlights and notes" title="Library: bookmarks, highlights and notes (Ctrl+B)" aria-controls="library-panel" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg></button>
        <button type="button" id="search-toggle" class="bar-btn search-toggle" aria-label="Search or go to a reference" aria-controls="search-panel" aria-expanded="false" title="Search or go to a reference (/ or Ctrl+K)">&#8981;</button>
        <div class="bar-item">
            <button type="button" id="menu-toggle" class="bar-btn" aria-label="Menu" title="Menu" aria-haspopup="menu" aria-controls="app-menu" aria-expanded="false">&#9776;</button>
            <div id="app-menu" class="popover app-menu" role="menu" aria-label="Menu" hidden>
                <button type="button" id="export-data-btn" class="menu-item" role="menuitem" tabindex="-1" title="Save a backup of your bookmarks, highlights, notes and settings">Export data…</button>
                <button type="button" id="import-data-btn" class="menu-item" role="menuitem" tabindex="-1" title="Load a Gospel Getter backup from this or another computer">Import data…</button>
                <div class="menu-separator" role="separator"></div>
                <button type="button" id="welcome-btn" class="menu-item" role="menuitem" tabindex="-1">Show welcome</button>
                <button type="button" id="shortcuts-btn" class="menu-item" role="menuitem" tabindex="-1" aria-keyshortcuts="?">Keyboard shortcuts</button>
                <button type="button" id="about-btn" class="menu-item" role="menuitem" tabindex="-1">About Gospel Getter</button>
            </div>
        </div>
    </div>
    <nav id="picker" class="picker" aria-label="Books and chapters" hidden>
        <button type="button" id="random-chapter-btn" class="picker-random"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Random chapter</button>
        <h2 id="picker-ot-title" class="picker-testament">Old Testament</h2>
        <ul id="ot-book-list" class="picker-books" aria-labelledby="picker-ot-title"></ul>
        <h2 id="picker-nt-title" class="picker-testament">New Testament</h2>
        <ul id="nt-book-list" class="picker-books" aria-labelledby="picker-nt-title"></ul>
    </nav>
    <aside id="library-panel" class="library-panel" aria-labelledby="library-title" hidden>
        <div class="library-head">
            <h2 id="library-title" class="library-title">Library</h2>
            <button type="button" id="library-close" class="panel-close" aria-label="Close the library" title="Close (Esc)">&times;</button>
        </div>
        <!-- The tabs, Bookmarks, Highlights and Notes: the Rust pieces'
             (ui-leptos/src/library.rs) put them here. -->
        <p class="library-hint">Ctrl+B opens and closes the library &middot; Esc closes it</p>
    </aside>
    <!-- The search box's contents (#search-input, #search-status,
         #search-results, #search-more) are drawn here by the page's Rust
         pieces (ui-leptos/src/search.rs), which open and close it. -->
    <div id="search-panel" class="search-panel" role="dialog" aria-label="Search, go to or run a command" hidden></div>
    <!-- About (#about-overlay) is drawn here by the page's Rust pieces
         (ui-leptos/src/about.rs), and opened and closed by them as one of
         the header's surfaces (ui-leptos/src/surfaces.rs). -->
    <p id="data-status" class="toast is-hidden" role="status" aria-live="polite"></p>
    <p id="size-status" class="toast size-status is-hidden" role="status" aria-live="polite"></p>

    <!-- The update banner (#update-banner) is drawn here by the page's Rust
         pieces (ui-leptos/src/updates.rs). -->

    <main class="container">
        <h1 class="visually-hidden">Gospel Getter</h1>

        <p id="reader-notice" class="reader-notice" role="status" hidden></p>

        <div id="reading-pane"></div>
    </main>

    <script>
        // If the page's Rust pieces fail to load (their loader, in <head>,
        // says so once the page is read), the chapter still shows, as plain
        // text: the reading position the app saved (or Genesis 1), read
        // once, with a line saying the rest of the reader isn't available.
        // Only that: nothing in it can be selected, turned or changed. With
        // the pieces, the reader is theirs (ui-leptos/src/reader.rs).
        document.addEventListener('gospel-getter:pieces-failed', function () {
            'use strict';
            var invoke = window.__TAURI__.core.invoke;
            var notice = document.getElementById('reader-notice');
            notice.textContent = 'This chapter is shown as plain text: the rest of the reader isn’t available.';
            notice.hidden = false;
            invoke('get_home').then(function (home) {
                return { bookId: home.currentBookId, chapter: home.currentChapter, translationCode: home.currentTranslationCode };
            }, function () {
                return { bookId: 1, chapter: 1 };
            }).then(function (position) {
                return invoke('get_reading', position);
            }).then(function (dto) {
                if (!dto) return;
                var make = function (tag, className, text) {
                    var el = document.createElement(tag);
                    el.className = className;
                    if (text != null) el.textContent = text;
                    return el;
                };
                var verses = make('div', 'chapter-text');
                dto.currentVerses.forEach(function (v, i) {
                    var verse = make('p', 'verse');
                    verse.append(make('span', 'verse-num', String(v.number)), make('span', 'verse-text', v.text));
                    if (i) verses.append('\n');
                    verses.append(verse);
                });
                var main = make('section', 'chapter-main');
                main.append(make('h2', 'chapter-heading', dto.currentBookName + ' ' + dto.currentChapter), verses);
                var row = make('div', 'reading-row');
                row.append(main);
                document.getElementById('reading-pane').replaceChildren(row);
            }).catch(function (e) {
                console.error('Failed to read the chapter', e);
            });
        }, { once: true });
    </script>
</body>
</html>
