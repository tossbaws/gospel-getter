<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gospel Getter</title>
    <!-- Generated from packaging/icon.svg by packaging/generate-icons.sh. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
    <!-- The chapter's face, fetched while the page loads: its text waits
         for it (font-display: block), and the chapter is drawn by the
         page's Rust pieces once they've loaded, later than the page itself
         would ask for it. -->
    <link rel="preload" href="fonts/literata-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/literata-italic.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Built by Trunk (Trunk.toml): the page's Rust pieces, compiled to
         WebAssembly (see ui-leptos/), and the files the page serves beside
         itself. These links are Trunk's; they do nothing in a browser. -->
    <link data-trunk rel="rust" href="../ui-leptos/Cargo.toml" data-bindgen-target="no-modules" data-wasm-opt="z" />
    <link data-trunk rel="copy-dir" href="fonts" />
    <link data-trunk rel="copy-file" href="favicon.svg" />
    <link data-trunk rel="copy-file" href="favicon.png" />
    <style>
        /* Literata (TypeTogether, SIL Open Font License, see
           fonts/OFL.txt), bundled so scripture reads the same on every
           computer, offline: regular, its true italic (the KJV's supplied
           words) and bold, each cut to the Latin characters the
           translations use. font-display: block, because the files are
           local and load in milliseconds: the text waits for them instead
           of flashing up in a fallback face and then jumping to this one. */
        @font-face {
            font-family: 'Literata';
            font-style: normal;
            font-weight: 400;
            font-display: block;
            src: url('fonts/literata-regular.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        @font-face {
            font-family: 'Literata';
            font-style: italic;
            font-weight: 400;
            font-display: block;
            src: url('fonts/literata-italic.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        @font-face {
            font-family: 'Literata';
            font-style: normal;
            font-weight: 700;
            font-display: block;
            src: url('fonts/literata-bold.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        /* What every theme shares: the two typefaces (Literata for
           scripture and chapter headings, the system's UI sans, as on the
           website, for everything else), one radius scale for controls and
           surfaces, and the reading-comfort presets (see the text-size and
           line-spacing blocks below). The presets only scale the reading
           content, chapter headings and verses, never the rest of the UI,
           and these defaults are exactly the fixed values the verses used
           before the presets existed. */
        :root {
            --font-scripture: 'Literata', Georgia, 'Times New Roman', serif;
            --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, Cantarell, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif;
            --radius-s: 4px;
            --radius-m: 8px;
            --radius-l: 12px;
            /* A hairline rule: the quiet accent, half strength. */
            --rule: color-mix(in srgb, var(--accent-2) 50%, transparent);
            --reading-scale: 1;
            --reading-leading: 1.7;
        }

        /* Default theme: Chi Rho, the Chi Rho Code brand's palette (the
           website's, site/styles.css): parchment on near-black green, gold
           for what's chosen, active or primary, and teal for the quiet
           jobs. Every theme defines this same set of custom properties;
           see the `[data-theme="..."]` blocks below for the others.
           `--accent-rgb` is a bare "r, g, b" triplet so tints can composite
           it at whatever alpha they need via rgba(var(--accent-rgb), X).
           `--accent-2` is the quiet accent: verse numbers, rules, links,
           footnote markers and cross-references. `--glow` is the neon
           behind the masthead, chapter headings and the chosen book and
           chapter: none, except on Vaporwave, Matrix and Hot Pink.
           System is Chi Rho in a dark OS, and Vellum (see the
           prefers-color-scheme block after it) in a light one, following
           the OS as it changes. Each block also matches
           [data-theme-preview="..."], so the Aa popover's theme swatches
           are drawn from these same definitions. */
        :root,
        :root[data-theme="system"],
        [data-theme-preview="chi-rho"],
        [data-theme-preview="system"] {
            /* `color-scheme` and `--option-bg` exist for one reason: native
               <select> popup lists don't reliably composite our translucent
               --panel-bg the way the rest of the page does, and without a
               color-scheme hint the browser defaults the popup to a light
               native palette regardless of our theme — pairing light text
               with a near-white popup on the dark themes. color-scheme
               tells the browser which native palette family to use;
               --option-bg is a fully opaque fallback background so the
               popup itself is legible no matter how that compositing goes. */
            color-scheme: dark;
            --bg: #0b0d0c;
            --text: #ede7d8;
            --text-dim: #bdb6a5;
            --accent: #f2c14e;
            --accent-rgb: 242, 193, 78;
            --accent-dim: rgba(66, 184, 165, 0.35);
            --accent-2: #86dccd;
            --panel-bg: rgba(22, 120, 90, 0.1);
            --option-bg: #131c18;
            --on-accent: #1a140e;
            /* The top bar behind the header buttons: opaque, so the page
               scrolling beneath it never shows through, and its buttons
               stay AA on it (see the palette tests). */
            --bar-bg: #101613;
            /* Verse numbers and KJV footnote markers: --accent-2, with no
               outline, in every theme but Vaporwave (see there). */
            --verse-num-color: var(--accent-2);
            --verse-num-outline: none;
            --verse-num-outline-faded: none;
            --glow: none;
            /* Highlighter colors (behind highlighted verse text), one set
               per theme: muted on the dark themes, pastel on the light
               ones, every one keeping --text at AA contrast. */
            --hl-yellow: #6b5310;
            --hl-green: #2c5a46;
            --hl-blue: #22415f;
            --hl-pink: #682a47;
        }

        /* Vellum: Chi Rho's light twin, ink on warm paper, with emerald
           for what's chosen and a deeper teal for the quiet jobs. The same
           palette is System's in a light OS, below; the palette tests keep
           the two copies identical. */
        :root[data-theme="vellum"],
        [data-theme-preview="vellum"] {
            color-scheme: light;
            --bg: #f5efe3;
            --text: #1b1a17;
            --text-dim: #6a655a;
            --accent: #16785a;
            --accent-rgb: 22, 120, 90;
            --accent-dim: rgba(22, 120, 90, 0.3);
            --accent-2: #1f6f63;
            --panel-bg: rgba(255, 255, 255, 0.55);
            --option-bg: #ffffff;
            --on-accent: #ffffff;
            --bar-bg: #fbf7ef;
            --verse-num-color: var(--accent-2);
            --verse-num-outline: none;
            --verse-num-outline-faded: none;
            --glow: none;
            --hl-yellow: #fbe78a;
            --hl-green: #c6ecbd;
            --hl-blue: #c9defc;
            --hl-pink: #f8cfe2;
        }

        @media (prefers-color-scheme: light) {
            :root[data-theme="system"],
            [data-theme-preview="system"] {
                color-scheme: light;
                --bg: #f5efe3;
                --text: #1b1a17;
                --text-dim: #6a655a;
                --accent: #16785a;
                --accent-rgb: 22, 120, 90;
                --accent-dim: rgba(22, 120, 90, 0.3);
                --accent-2: #1f6f63;
                --panel-bg: rgba(255, 255, 255, 0.55);
                --option-bg: #ffffff;
                --on-accent: #ffffff;
                --bar-bg: #fbf7ef;
                --verse-num-color: var(--accent-2);
                --verse-num-outline: none;
                --verse-num-outline-faded: none;
                --glow: none;
                --hl-yellow: #fbe78a;
                --hl-green: #c6ecbd;
                --hl-blue: #c9defc;
                --hl-pink: #f8cfe2;
            }
        }

        /* Vaporwave, the default before Chi Rho. Its darkest tone,
           #14082c, is also the app icon's background
           (packaging/icon.svg). */
        :root[data-theme="vaporwave"],
        [data-theme-preview="vaporwave"] {
            color-scheme: dark;
            --bg: linear-gradient(
                180deg,
                #14082c 0%,
                #441768 35%,
                #972378 62%,
                #bf5349 82%,
                #bf8545 100%
            );
            --text: #f2e9ff;
            --text-dim: #b9a9d9;
            --accent: #04a3ae;
            --accent-rgb: 4, 163, 174;
            --accent-dim: rgba(4, 163, 174, 0.45);
            --accent-2: #04a3ae;
            --panel-bg: rgba(20, 8, 44, 0.55);
            --option-bg: #1e0f3a;
            --on-accent: #14082c;
            --bar-bg: #14082c;
            /* Verse numbers and KJV footnote markers sit straight on the
               page background. No one color is AA over every stop of this
               gradient (the best, white, peaks at 3.15:1 on its orange
               foot), so here they're a brighter aqua with a crisp 1px
               outline in the bar's near-black purple hugging each glyph,
               like neon signage: the aqua is AA on the outline wherever
               the page shows through (see the palette tests). */
            --verse-num-color: #5ce1e6;
            --verse-num-outline:
                -1px -1px 0 #14082c, 0 -1px 0 #14082c, 1px -1px 0 #14082c,
                -1px 0 0 #14082c, 1px 0 0 #14082c,
                -1px 1px 0 #14082c, 0 1px 0 #14082c, 1px 1px 0 #14082c;
            /* Lighter in the faded neighboring chapters, so their numbers
               don't stand out heavier than their dimmed text. */
            --verse-num-outline-faded:
                0 -1px 0 rgba(20, 8, 44, 0.6), -1px 0 0 rgba(20, 8, 44, 0.6),
                1px 0 0 rgba(20, 8, 44, 0.6), 0 1px 0 rgba(20, 8, 44, 0.6);
            --glow: 0 0 14px rgba(4, 163, 174, 0.5);
            --hl-yellow: #6a5310;
            --hl-green: #1e5541;
            --hl-blue: #23437a;
            --hl-pink: #74245c;
        }

        :root[data-theme="classic-dark"],
        [data-theme-preview="classic-dark"] {
            color-scheme: dark;
            --bg: #121417;
            --text: #e8e8ea;
            --text-dim: #9a9aa2;
            --accent: #4da6ff;
            --accent-rgb: 77, 166, 255;
            --accent-dim: rgba(77, 166, 255, 0.35);
            --accent-2: #4da6ff;
            --panel-bg: rgba(255, 255, 255, 0.05);
            --option-bg: #1a1c1f;
            --on-accent: #06141f;
            --bar-bg: #16181c;
            --verse-num-color: var(--accent-2);
            --verse-num-outline: none;
            --verse-num-outline-faded: none;
            --glow: none;
            --hl-yellow: #5a4d12;
            --hl-green: #224f2f;
            --hl-blue: #1f3f6b;
            --hl-pink: #5c2747;
        }

        :root[data-theme="classic-light"],
        [data-theme-preview="classic-light"] {
            color-scheme: light;
            --bg: #f7f7f5;
            --text: #1c1c1e;
            --text-dim: #6b6b70;
            --accent: #2563eb;
            --accent-rgb: 37, 99, 235;
            --accent-dim: rgba(37, 99, 235, 0.25);
            --accent-2: #2563eb;
            --panel-bg: rgba(0, 0, 0, 0.035);
            --option-bg: #ffffff;
            --on-accent: #ffffff;
            --bar-bg: #ffffff;
            --verse-num-color: var(--accent-2);
            --verse-num-outline: none;
            --verse-num-outline-faded: none;
            --glow: none;
            --hl-yellow: #fbe78a;
            --hl-green: #c6ecbd;
            --hl-blue: #c9defc;
            --hl-pink: #f8cfe2;
        }

        :root[data-theme="matrix"],
        [data-theme-preview="matrix"] {
            color-scheme: dark;
            --bg: #020a02;
            --text: #ccffcc;
            --text-dim: #4d9a4d;
            --accent: #00ff41;
            --accent-rgb: 0, 255, 65;
            --accent-dim: rgba(0, 255, 65, 0.35);
            --accent-2: #00ff41;
            --panel-bg: rgba(0, 255, 65, 0.06);
            --option-bg: #041404;
            --on-accent: #001a00;
            --bar-bg: #031003;
            --verse-num-color: var(--accent-2);
            --verse-num-outline: none;
            --verse-num-outline-faded: none;
            --glow: 0 0 14px rgba(0, 255, 65, 0.5);
            --hl-yellow: #664e00;
            --hl-green: #11521f;
            --hl-blue: #0f3a5c;
            --hl-pink: #57173e;
        }

        :root[data-theme="beast-slayer"],
        [data-theme-preview="beast-slayer"] {
            color-scheme: dark;
            --bg: linear-gradient(
                180deg,
                #1a1410 0%,
                #2e1f16 40%,
                #4a2c1a 70%,
                #6b3a1f 100%
            );
            --text: #f0e4d0;
            --text-dim: #c2a583;
            --accent: #d4a017;
            --accent-rgb: 212, 160, 23;
            --accent-dim: rgba(212, 160, 23, 0.4);
            --accent-2: #d4a017;
            --panel-bg: rgba(26, 20, 16, 0.55);
            --option-bg: #241a12;
            --on-accent: #1a1410;
            --bar-bg: #1a1410;
            --verse-num-color: var(--accent-2);
            --verse-num-outline: none;
            --verse-num-outline-faded: none;
            --glow: none;
            --hl-yellow: #6b5310;
            --hl-green: #31512a;
            --hl-blue: #22415f;
            --hl-pink: #682a47;
        }

        /* Hot pink as the accent on a near-black plum ground, rather than
           pink text on a pink background: the pink carries headings,
           verse numbers and highlights, while body text stays a pale,
           high-contrast blush. */
        :root[data-theme="hot-pink"],
        [data-theme-preview="hot-pink"] {
            color-scheme: dark;
            --bg: linear-gradient(
                180deg,
                #12030c 0%,
                #1f0616 55%,
                #2d0a20 100%
            );
            --text: #fff0f7;
            --text-dim: #e8a3c6;
            --accent: #ff3fa4;
            --accent-rgb: 255, 63, 164;
            --accent-dim: rgba(255, 63, 164, 0.45);
            --accent-2: #ff3fa4;
            --panel-bg: rgba(255, 63, 164, 0.07);
            --option-bg: #2a0a1d;
            --on-accent: #1a0411;
            --bar-bg: #12030c;
            --verse-num-color: var(--accent-2);
            --verse-num-outline: none;
            --verse-num-outline-faded: none;
            --glow: 0 0 14px rgba(255, 63, 164, 0.5);
            --hl-yellow: #614c0f;
            --hl-green: #1f5038;
            --hl-blue: #263d6b;
            --hl-pink: #84205a;
        }

        :root[data-text-size="small"] { --reading-scale: 0.9; }
        :root[data-text-size="large"] { --reading-scale: 1.2; }
        :root[data-text-size="x-large"] { --reading-scale: 1.4; }

        :root[data-line-spacing="compact"] { --reading-leading: 1.45; }
        :root[data-line-spacing="relaxed"] { --reading-leading: 2.05; }

        /* The top bar's height: the page content starts below it, and
           the Library panel and the sidebar hang from it. The sidebar is
           wide enough for Psalms' chapters ten to a row, each at least 24px
           from the next (WCAG's minimum target spacing). */
        html {
            --bar-height: 3.4rem;
            --sidebar-width: 18rem;
            /* The reading column (Aa's Width): Normal is the width it has
               always had, 492px, 62 characters a line at the Medium text
               size in Literata (measured in WebKitGTK); Narrow is 416px (52)
               and Wide 592px (74). Reading mode's single column is wider:
               732px at Normal, as it has always been (92), with Narrow at
               592px (74) and Wide at 880px (111). The faded neighbors give
               way first, down to --side-min, and the column only then, never
               below --column-min: 400px, 50 characters (see .chapter-side). */
            --column: 30.75rem;
            --reader-column: 45.75rem;
            --column-min: 25rem;
            --side-width: 260px;
            --side-min: 180px;
            --row-gap: 1.25rem;
        }

        :root[data-width="narrow"] {
            --column: 26rem;
            --reader-column: 37rem;
        }

        :root[data-width="wide"] {
            --column: 37rem;
            --reader-column: 55rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-ui);
            background: var(--bg);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
        }

        /* As wide as the reading column and its two neighbors (1100px at
           Normal width), so the column has its width when there's room. */
        .container {
            max-width: calc(var(--column) + 2 * var(--side-width) + 2 * var(--row-gap) + 3rem);
            margin: 0 auto;
            padding: 2.5rem 1.5rem 6rem;
        }

        /* The top bar: the translation, Aa, Library, search and the ☰ menu
           on the right, over an opaque --bar-bg the page scrolls beneath
           (the content is offset below it, on screen only). In reading
           mode only the translation, Aa, search and the exit button stay,
           and the bar itself goes. */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            height: var(--bar-height);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.45rem;
            padding: 0 1rem;
            background: var(--bar-bg);
            border-bottom: 1px solid var(--accent-dim);
        }

        /* A bar button with the popover it opens, which hangs below it. */
        .bar-item {
            position: relative;
        }

        /* Ghost icons: no box until the pointer is over one (a wash)
           or its popover is open (the wash, in --accent). At least 36px
           square, and the focus ring stays (see the :focus-visible rules
           below). */
        .bar-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.6rem;
            height: 2.4rem;
            padding: 0;
            background: none;
            border: none;
            border-radius: var(--radius-m);
            color: var(--text-dim);
            font-family: inherit;
            font-size: 1.4rem;
            line-height: 1;
            cursor: pointer;
        }

        .bar-btn:hover {
            background: rgba(var(--accent-rgb), 0.12);
            color: var(--text);
        }

        .bar-btn[aria-expanded="true"] {
            background: rgba(var(--accent-rgb), 0.08);
            color: var(--accent);
        }

        .aa-toggle {
            width: 3rem;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        /* The translation being read, by its code ("KJV"). */
        .translation-toggle {
            width: auto;
            min-width: 3rem;
            padding: 0 0.45rem;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        .bar-btn svg {
            width: 1.2rem;
            height: 1.2rem;
        }

        /* Popovers (the translation, Aa and the ☰ menu): opaque
           --option-bg, like the search panel, hanging below their button
           with a small pointer to it. Only one popover or panel is open
           at a time. */
        .popover {
            position: absolute;
            top: calc(100% + 0.55rem);
            right: 0;
            background: var(--option-bg);
            color: var(--text);
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-l);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            font-size: 0.85rem;
        }

        .popover::before {
            content: "";
            position: absolute;
            top: -7px;
            width: 12px;
            height: 12px;
            background: var(--option-bg);
            border-left: 1px solid var(--accent-dim);
            border-top: 1px solid var(--accent-dim);
            transform: rotate(45deg);
        }

        /* The translation button's popover: the translations and
           Compare. Aa: text size, line spacing, width, layout, theme and
           reading mode. Every control is --accent on --panel-bg, or
           --on-accent on --accent when chosen, both AA in every theme. */
        .aa-popover,
        .translation-popover {
            width: 24rem;
            padding: 0.9rem 1rem 1rem;
        }

        .aa-popover::before,
        .translation-popover::before {
            right: calc(1.5rem - 7px);
        }

        .aa-section {
            margin-bottom: 0.85rem;
        }

        .aa-section:last-child {
            margin-bottom: 0;
        }

        .section-label {
            display: block;
            font-size: 0.7rem;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-dim);
            margin-bottom: 0.35rem;
        }

        .aa-row {
            display: flex;
            gap: 0.4rem;
        }

        .segmented {
            display: flex;
            flex: 1 1 auto;
            min-width: 0;
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-m);
            overflow: hidden;
        }

        .segment {
            flex: 1 1 0;
            min-width: 0;
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--accent);
            background: var(--panel-bg);
            border: none;
            border-left: 1px solid var(--accent-dim);
            padding: 0.4rem 0.3rem;
            cursor: pointer;
        }

        .segment:first-child {
            border-left: none;
        }

        .segment:hover {
            text-decoration: underline;
        }

        /* A row that has no effect for now (Layout, while comparing): the
           choice still shows, pressed; the others are quiet. */
        .segment:disabled {
            color: var(--text-dim);
            text-decoration: none;
            cursor: default;
        }

        .segment[aria-pressed="true"] {
            background: var(--accent);
            color: var(--on-accent);
        }

        .segment:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -4px;
        }

        .segment[aria-pressed="true"]:focus-visible {
            outline-color: var(--on-accent);
        }

        .aa-row .compare-btn {
            flex: 0 0 auto;
            width: auto;
            white-space: nowrap;
        }

        /* The translations: a radio group, one line each, "KJV · King
           James Version · 1611/1769 · public domain". The code in
           --accent, the name in --text, the rest --text-dim, on
           --panel-bg; the chosen one --on-accent on --accent, all of it. */
        .translation-list {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-m);
            overflow: hidden;
            margin-bottom: 0.45rem;
        }

        .translation-choice {
            display: block;
            width: 100%;
            font-family: inherit;
            font-size: 0.8rem;
            line-height: 1.35;
            text-align: left;
            color: var(--text);
            background: var(--panel-bg);
            border: none;
            border-top: 1px solid var(--accent-dim);
            padding: 0.42rem 0.6rem;
            cursor: pointer;
        }

        .translation-choice:first-child {
            border-top: none;
        }

        .translation-code {
            font-weight: 600;
            color: var(--accent);
        }

        .translation-detail,
        .translation-dot {
            color: var(--text-dim);
        }

        .translation-choice:hover .translation-name {
            text-decoration: underline;
        }

        .translation-choice[aria-checked="true"],
        .translation-choice[aria-checked="true"] .translation-code,
        .translation-choice[aria-checked="true"] .translation-detail,
        .translation-choice[aria-checked="true"] .translation-dot {
            background: var(--accent);
            color: var(--on-accent);
        }

        .translation-choice:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -4px;
        }

        .translation-choice[aria-checked="true"]:focus-visible {
            outline-color: var(--on-accent);
        }

        /* Compare (C) with [BSB] [WEB]: the other translations. */
        .compare-row {
            align-items: center;
        }

        .compare-with-label {
            flex: 0 0 auto;
            color: var(--text-dim);
        }

        .size-stepper {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .stepper-btn {
            width: 2.6rem;
            height: 2.1rem;
            font-family: inherit;
            line-height: 1;
            color: var(--accent);
            background: var(--panel-bg);
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-m);
            cursor: pointer;
        }

        .stepper-btn:hover:not(:disabled) {
            border-color: var(--accent);
        }

        .stepper-btn:disabled {
            opacity: 0.35;
            cursor: default;
        }

        .stepper-smaller {
            font-size: 0.8rem;
        }

        .stepper-larger {
            font-size: 1.2rem;
        }

        .size-stepper output {
            flex: 1 1 auto;
            text-align: center;
            color: var(--text);
        }

        /* Nine swatches, each drawn by its own theme's definition (see the
           theme blocks at the top), ringed in this theme's --text-dim and,
           when chosen, in --accent: both AA on --option-bg. Chi Rho,
           Vellum and System make the first row, and the other six the
           second. */
        .theme-swatches {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 0.45rem;
        }

        .theme-swatch:nth-child(4) {
            grid-column-start: 1;
        }

        .theme-swatch {
            display: flex;
            aspect-ratio: 1;
            padding: 0;
            background: none;
            border: 1px solid var(--text-dim);
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
        }

        .theme-swatch-preview {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--accent);
            font-family: var(--font-scripture);
            font-size: 0.85rem;
        }

        /* System is both: Chi Rho's ground and Vellum's, split, with no
           letter (no one accent reads on both halves). */
        .theme-swatch-preview[data-theme-preview="system"] {
            background: linear-gradient(135deg, #0b0d0c 50%, #f5efe3 50%);
            color: transparent;
        }

        .theme-swatch[aria-pressed="true"] {
            box-shadow: 0 0 0 2px var(--option-bg), 0 0 0 4px var(--accent);
        }

        .theme-swatch:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 5px;
        }

        .theme-name {
            margin-top: 0.4rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        /* The ☰ menu: Export, Import, Show welcome and About. */
        .app-menu {
            width: 14rem;
            padding: 0.35rem 0;
        }

        .app-menu::before {
            right: calc(1.3rem - 7px);
        }

        .menu-item {
            display: block;
            width: 100%;
            text-align: left;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text);
            background: none;
            border: none;
            padding: 0.5rem 0.9rem;
            cursor: pointer;
        }

        .menu-item:hover,
        .menu-item:focus {
            background: rgba(var(--accent-rgb), 0.15);
        }

        .menu-item:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        .menu-item:disabled {
            opacity: 0.6;
            cursor: progress;
        }

        .menu-separator {
            border-top: 1px solid var(--accent-dim);
            margin: 0.3rem 0;
        }

        /* Library: bookmarks, highlights and notes in a panel down the right,
           hanging from the top bar so Aa, search and ☰ stay in reach.
           Opaque --option-bg, like the popovers. */
        .library-panel:not([hidden]) {
            position: fixed;
            top: var(--bar-height);
            right: 0;
            bottom: 0;
            z-index: 25;
            display: flex;
            flex-direction: column;
            width: min(22.5rem, 100%);
            background: var(--option-bg);
            color: var(--text);
            border-left: 1px solid var(--accent-dim);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.35);
            font-size: 0.9rem;
        }

        .library-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.7rem 1rem 0.4rem;
        }

        .library-title {
            font-size: 1.1rem;
            font-weight: normal;
            color: var(--accent);
        }

        .panel-close {
            width: 2rem;
            height: 2rem;
            font-family: inherit;
            font-size: 1.2rem;
            line-height: 1;
            color: var(--accent);
            background: none;
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-m);
            cursor: pointer;
        }

        .panel-close:hover {
            border-color: var(--accent);
        }

        .library-tabs {
            display: flex;
            margin: 0 1rem;
            border-bottom: 1px solid var(--accent-dim);
        }

        .library-tab {
            flex: 1 1 0;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-dim);
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 0.5rem;
            cursor: pointer;
        }

        .library-tab[aria-selected="true"] {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab-count {
            font-size: 0.75rem;
        }

        .library-tabpanel {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 0.7rem 1rem 1rem;
        }

        .library-panel .bookmark-list {
            max-height: none;
            overflow: visible;
        }

        .library-hint {
            font-size: 0.75rem;
            color: var(--text-dim);
            padding: 0.5rem 1rem;
            border-top: 1px solid var(--accent-dim);
        }

        @media (prefers-reduced-motion: no-preference) {
            .library-panel:not([hidden]) {
                animation: library-in 0.15s ease-out;
            }
        }

        @keyframes library-in {
            from {
                transform: translateX(1.5rem);
                opacity: 0;
            }
        }

        /* Narrow windows: Aa and the translations become a sheet along
           the bottom (scrolling if it must), and the Library takes the
           full width. */
        @media (max-width: 560px) {
            .aa-popover,
            .translation-popover {
                position: fixed;
                top: auto;
                left: 0;
                right: 0;
                bottom: 0;
                width: auto;
                max-height: min(75vh, calc(100vh - var(--bar-height) - 0.5rem));
                overflow-y: auto;
                border-radius: var(--radius-l) var(--radius-l) 0 0;
                border-bottom: none;
            }

            .aa-popover::before,
            .translation-popover::before {
                display: none;
            }

            .library-panel:not([hidden]) {
                width: 100%;
                border-left: none;
            }
        }

        /* About: the app, its version and updates, in a modal like the
           import preview (it shares that panel's look). */
        .about-panel {
            position: relative;
            width: min(28rem, 100%);
        }

        .about-close {
            position: absolute;
            top: 0.8rem;
            right: 0.8rem;
        }

        .about-head {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            margin-bottom: 1rem;
            padding-right: 2.5rem;
        }

        .about-icon {
            flex: 0 0 auto;
            width: 56px;
            height: 56px;
        }

        .about-head .import-title {
            margin-bottom: 0.1rem;
        }

        .about-updates .reader-mode-btn {
            width: auto;
        }

        /* An update found while About is open shows here, not in the
           banner: its name, its notes (scrolling inside a box, so the
           buttons stay in view), Update now and Close. --text, --accent
           and --text-dim on the dialog's --option-bg, AA in every theme
           (see the palette tests). */
        .about-update:not([hidden]) {
            display: block;
            margin-top: 0.9rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--accent-dim);
        }

        .about-update-title {
            font-size: 0.95rem;
            margin-bottom: 0.4rem;
        }

        .about-update-notes {
            max-height: min(14rem, 40vh);
            overflow-y: auto;
            overflow-wrap: anywhere;
            margin-bottom: 0.6rem;
            padding: 0.5rem 0.7rem;
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-s);
            font-size: 0.8rem;
            line-height: 1.45;
            color: var(--text);
        }

        .about-update-notes h5 {
            font-size: 0.85rem;
            color: var(--accent);
            margin: 0.6rem 0 0.2rem;
        }

        .about-update-notes h5:first-child {
            margin-top: 0;
        }

        .about-update-notes p {
            margin: 0 0 0.4rem;
        }

        .about-update-notes ul {
            margin: 0 0 0.4rem;
            padding-left: 1.1rem;
        }

        .about-update-notes ul ul {
            margin-bottom: 0;
        }

        /* File names and keys: the UI face, as everywhere (not the
           browser's monospace: no third face), in --accent. */
        .about-update-notes code {
            font-family: inherit;
            color: var(--accent);
        }

        .about-update:focus-visible,
        .about-update-notes:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* The bundled texts' sources, as the README gives them: quiet, as
           About's links are. */
        .about-credits {
            margin-top: 1rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--accent-dim);
        }

        .about-credits-list {
            margin: 0;
            padding-left: 1.1rem;
            font-size: 0.8rem;
            line-height: 1.45;
            color: var(--text-dim);
        }

        .about-links {
            margin-top: 1rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--accent-dim);
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .about-links a {
            color: var(--accent-2);
        }

        /* Export and import results: a small notice at the foot of the
           window that fades away. --text on the opaque --option-bg, AA in
           every theme. It stays in the page, empty or faded, so screen
           readers hear each new message. */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 1rem;
            transform: translateX(-50%);
            z-index: 36;
            width: max-content;
            max-width: min(30rem, calc(100vw - 2rem));
            background: var(--option-bg);
            color: var(--text);
            border: 1px solid var(--accent);
            border-radius: var(--radius-l);
            padding: 0.6rem 0.9rem;
            font-size: 0.85rem;
            line-height: 1.4;
            overflow-wrap: anywhere;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
        }

        .toast.is-error {
            font-weight: bold;
        }

        /* "Text size: Large", briefly, after Ctrl+= or Ctrl+-: smaller
           and higher than export's notices, so the two never overlap. */
        .size-status {
            bottom: 4.5rem;
            padding: 0.35rem 0.75rem;
            border-color: var(--accent-dim);
        }

        .toast.is-hidden {
            opacity: 0;
            visibility: hidden;
        }

        @media (prefers-reduced-motion: no-preference) {
            .toast {
                transition: opacity 0.4s ease, visibility 0.4s;
            }
        }

        /* Opaque (--option-bg), unlike the other panels: results are read
           over the chapter text underneath. */
        .search-panel {
            position: fixed;
            top: 3.6rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            width: min(640px, calc(100vw - 2rem));
            max-height: calc(100vh - 5rem);
            overflow-y: auto;
            background: var(--option-bg);
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-l);
            padding: 0.9rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
        }

        .search-input {
            width: 100%;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text);
            background: var(--panel-bg);
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-m);
            padding: 0.5rem 0.7rem;
        }

        .search-status {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin: 0.5rem 0 0.3rem;
            min-height: 1em;
        }

        .search-status.is-error {
            color: var(--text);
            font-weight: bold;
        }

        /* The palette's groups: Go to, Commands, Verses, each under a
           small heading. Focus stays in the box; the active option is
           tinted and edged like a hovered one. */
        .palette-group + .palette-group {
            margin-top: 0.4rem;
        }

        .palette-group-label {
            font-family: var(--font-ui);
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-dim);
            padding: 0.4rem 0.6rem 0.2rem;
        }

        .search-command {
            display: flex;
            align-items: baseline;
            gap: 0.6rem;
            font-family: var(--font-ui);
            font-size: 0.9rem;
            line-height: 1.4;
            color: var(--text);
            padding: 0.35rem 0.6rem;
            border-radius: var(--radius-s);
            cursor: pointer;
        }

        .search-command.is-disabled {
            cursor: default;
        }

        .search-command.is-disabled .palette-label {
            color: var(--text-dim);
        }

        .palette-reason {
            font-size: 0.78rem;
            color: var(--text-dim);
        }

        .palette-key {
            margin-left: auto;
            flex-shrink: 0;
        }

        .palette-key kbd {
            display: inline-block;
            min-width: 1.6em;
            padding: 0.05em 0.4em;
            font-family: var(--font-ui);
            font-size: 0.75rem;
            line-height: 1.4;
            text-align: center;
            color: var(--text-dim);
            background: var(--option-bg);
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-s);
        }

        .palette-key kbd svg {
            width: 1em;
            height: 1em;
            vertical-align: -0.15em;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .search-command:hover,
        .search-command.is-active,
        .search-result.is-active {
            background: rgba(var(--accent-rgb), 0.12);
        }

        .search-command.is-active,
        .search-result.is-active {
            box-shadow: inset 3px 0 0 var(--accent);
        }

        /* On the tint, a disabled command's name and reason are --text,
           which is AA there in every theme (--text-dim isn't, quite). */
        .search-command.is-active .palette-label,
        .search-command.is-active .palette-reason {
            color: var(--text);
        }

        .search-result {
            display: block;
            width: 100%;
            text-align: left;
            font-family: inherit;
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--text);
            background: none;
            border: none;
            border-bottom: 1px solid var(--accent-dim);
            padding: 0.5rem 0.6rem;
            cursor: pointer;
        }

        .search-result:hover {
            background: rgba(var(--accent-rgb), 0.12);
        }

        .search-ref {
            display: block;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--accent);
        }

        .search-text mark {
            background: rgba(var(--accent-rgb), 0.3);
            color: inherit;
            border-radius: var(--radius-s);
        }

        /* Full width at the end of the results, so it's hard to miss. */
        .search-more {
            width: 100%;
            margin-top: 0.6rem;
        }

        .section-note {
            font-size: 0.78rem;
            line-height: 1.4;
            color: var(--text-dim);
            margin: 0.35rem 0 0.6rem;
        }

        .data-status {
            font-size: 0.75rem;
            line-height: 1.4;
            color: var(--text-dim);
            margin-top: 0.4rem;
            overflow-wrap: anywhere;
        }

        .data-status.is-error {
            color: var(--text);
            font-weight: bold;
        }

        .data-problems {
            font-size: 0.8rem;
            line-height: 1.4;
            color: var(--text);
            margin: 0.2rem 0 0.6rem 1.1rem;
        }

        .import-invalid {
            margin-bottom: 0.4rem;
        }

        /* Import preview: a modal panel over a dimmed page, so nothing
           behind it can be clicked until it's confirmed or cancelled. */
        .import-overlay:not([hidden]) {
            position: fixed;
            inset: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.6);
        }

        .import-panel {
            width: min(560px, 100%);
            max-height: calc(100vh - 2rem);
            overflow-y: auto;
            background: var(--option-bg);
            color: var(--text);
            border: 1px solid var(--accent);
            border-radius: var(--radius-l);
            padding: 1.1rem 1.2rem;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .import-title {
            font-size: 1.1rem;
            font-weight: normal;
            color: var(--accent);
            margin-bottom: 0.4rem;
        }

        .import-file {
            font-size: 0.8rem;
            color: var(--text-dim);
            overflow-wrap: anywhere;
            margin-bottom: 0.6rem;
        }

        .import-summary {
            margin: 0 0 0.8rem 1.1rem;
        }

        .import-choices {
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-m);
            padding: 0.5rem 0.8rem;
            margin-bottom: 0.6rem;
        }

        .import-choices legend {
            padding: 0 0.3rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
        }

        .import-choices label,
        .import-option {
            display: block;
            margin: 0.3rem 0;
            cursor: pointer;
        }

        .import-option[hidden] {
            display: none;
        }

        .import-warning:not([hidden]) {
            display: block;
            border: 1px solid var(--accent);
            border-radius: var(--radius-m);
            padding: 0.5rem 0.7rem;
            margin-bottom: 0.6rem;
            font-weight: bold;
        }

        .import-error {
            font-weight: bold;
            margin: 0.4rem 0;
        }

        .import-error:empty {
            display: none;
        }

        .import-buttons {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.8rem;
        }

        .import-buttons .reader-mode-btn {
            width: auto;
        }

        .import-confirm {
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--on-accent);
            background: var(--accent);
            border: 1px solid var(--accent);
            border-radius: var(--radius-m);
            padding: 0.4rem 0.9rem;
            cursor: pointer;
        }

        .import-confirm:disabled {
            opacity: 0.6;
            cursor: progress;
        }

        /* Modals over a dimmed page: the first-run welcome and the note
           panel, like the import preview. Their text is --text, --text-dim
           and --accent on the opaque --option-bg, which meet AA in every
           theme (see the palette tests). The body scrolls inside the panel
           so the buttons stay in view at any window size. */
        .modal-overlay:not([hidden]) {
            position: fixed;
            inset: 0;
            z-index: 45;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.6);
        }

        .modal-panel {
            display: flex;
            flex-direction: column;
            width: min(32rem, 100%);
            max-height: calc(100vh - 2rem);
            background: var(--option-bg);
            color: var(--text);
            border: 1px solid var(--accent);
            border-radius: var(--radius-l);
            line-height: 1.55;
        }

        .modal-body {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 1.3rem 1.4rem 0.4rem;
        }

        .modal-buttons {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.4rem 1rem;
            border-top: 1px solid var(--accent-dim);
        }

        .modal-buttons[hidden] {
            display: none;
        }

        .modal-buttons .reader-mode-btn {
            width: auto;
        }

        .modal-panel button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: no-preference) {
            .modal-overlay:not([hidden]) .modal-panel {
                animation: modal-in 0.15s ease-out;
            }
        }

        @keyframes modal-in {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
        }

        /* The keyboard shortcuts: a modal sheet of groups, each a list of
           key caps (the chapter-end hint's) and what they do, in the UI
           sans, scrolling inside on a small window. */
        .shortcuts-panel {
            width: min(40rem, 100%);
            font-family: var(--font-ui);
        }

        .shortcuts-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1rem 1.1rem 0.6rem 1.4rem;
            border-bottom: 1px solid var(--accent-dim);
        }

        .shortcuts-title {
            font-size: 1.1rem;
            font-weight: normal;
            color: var(--accent);
        }

        .shortcuts-body {
            padding-bottom: 1rem;
        }

        .shortcuts-body:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        .shortcut-group + .shortcut-group {
            margin-top: 1rem;
        }

        .shortcut-group-title {
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 0.35rem;
        }

        .shortcut-row {
            display: grid;
            grid-template-columns: minmax(9rem, auto) 1fr;
            gap: 0.2rem 1rem;
            align-items: baseline;
            padding: 0.25rem 0;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(var(--accent-rgb), 0.12);
        }

        .shortcut-keys {
            font-size: 0.8rem;
            color: var(--text-dim);
            white-space: nowrap;
        }

        .shortcut-does {
            color: var(--text);
        }

        .key-plus {
            margin: 0 0.1em;
        }

        @media (max-width: 480px) {
            .shortcut-row {
                grid-template-columns: 1fr;
            }
        }

        /* The welcome: one card over the open chapter, in the UI sans,
           which (like the rest of the UI) doesn't grow with the reading
           text size; its body scrolls inside the card on a small window.
           Text is --text, --text-dim and --accent on --option-bg (AA in
           every theme), and a place to start under the pointer gets a
           faint 0.06 --accent wash, which keeps its --accent title at AA
           (at the picker's 0.12, Classic Light's would be 4.37:1). */
        .welcome-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            padding: 1.1rem 1.4rem 0;
        }

        .welcome-panel:focus {
            outline: none;
        }

        .welcome-title {
            font-size: 1.35rem;
            font-weight: normal;
            color: var(--accent);
        }

        .welcome-head .panel-close {
            flex: 0 0 auto;
        }

        .welcome-body {
            padding-top: 0.6rem;
        }

        .welcome-intro {
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .welcome-looks {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.6rem;
        }

        /* Each look previews its theme for real (data-theme-preview), as
           Aa's swatches do: its background, its accent and its text. */
        .welcome-look {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            padding: 0.4rem;
            font-family: inherit;
            font-size: 0.85rem;
            text-align: left;
            color: var(--text);
            background: none;
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-m);
            cursor: pointer;
        }

        .welcome-look:hover {
            border-color: var(--accent);
        }

        .welcome-look[aria-checked="true"] {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .welcome-look-preview {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            height: 4.2rem;
            padding: 0 0.8rem;
            background: var(--bg);
            border-radius: var(--radius-s);
        }

        .welcome-look-sample {
            font-family: var(--font-scripture);
            font-size: 1.6rem;
            color: var(--accent);
        }

        .welcome-look-lines {
            display: flex;
            flex: 1 1 auto;
            flex-direction: column;
            gap: 0.4rem;
        }

        .welcome-look-lines span {
            height: 0.3rem;
            border-radius: var(--radius-s);
            background: var(--text);
        }

        .welcome-look-lines span:last-child {
            width: 60%;
        }

        .welcome-look-name {
            padding: 0 0.15rem;
        }

        .welcome-hint {
            font-size: 0.78rem;
            color: var(--text-dim);
            margin: 0.4rem 0 1.1rem;
        }

        .welcome-start {
            margin: 0 0 0.6rem;
            padding: 0;
            list-style: none;
            border-top: 1px solid var(--accent-dim);
        }

        .welcome-start li {
            border-bottom: 1px solid var(--accent-dim);
        }

        .welcome-start-row {
            display: block;
            width: 100%;
            padding: 0.5rem 0.4rem;
            font-family: inherit;
            text-align: left;
            color: var(--text);
            background: none;
            border: none;
            cursor: pointer;
        }

        .welcome-start-row:hover {
            background: rgba(var(--accent-rgb), 0.06);
        }

        .welcome-start-title {
            display: block;
            font-size: 0.95rem;
            color: var(--accent);
        }

        .welcome-start-line {
            display: block;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .welcome-buttons {
            justify-content: flex-end;
        }

        /* The note panel: one passage's text, quoted in the translation on
           screen, and a note about it. The passage and the note are in the
           reading text size, so they stay as legible as the chapter; the
           passage scrolls inside a few lines, and the note always has room
           for at least four. */
        .note-title {
            font-size: 1.35rem;
            font-weight: normal;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .note-passage {
            font-family: var(--font-scripture);
            max-height: calc(4 * 1.55em);
            overflow-y: auto;
            font-size: calc(0.95rem * var(--reading-scale));
            line-height: 1.55;
            padding: 0.1rem 0.7rem;
            border-left: 3px solid var(--accent-dim);
        }

        .note-passage-num {
            font-size: 0.7em;
            font-weight: bold;
            color: var(--accent);
            vertical-align: super;
            margin-right: 0.2rem;
        }

        .note-text-shown {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin: 0.3rem 0 0.7rem;
        }

        .note-others {
            font-size: 0.85rem;
            margin-bottom: 0.7rem;
        }

        .note-others summary {
            color: var(--accent);
            cursor: pointer;
        }

        .note-others summary:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .note-others li {
            list-style: none;
            margin-top: 0.5rem;
            padding-left: 0.7rem;
            border-left: 2px solid var(--accent-dim);
        }

        .note-others-ref {
            display: block;
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .note-others-body {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .note-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 0.25rem;
        }

        /* A draft kept from before (ui-leptos/src/note_editor.rs): said
           above the text box, with Restore and Discard; never put in it
           unasked. */
        .note-draft:not([hidden]) {
            display: flex;
        }

        .note-draft {
            flex-wrap: wrap;
            align-items: center;
            gap: 0.4rem 0.6rem;
            font-size: 0.85rem;
            background: rgba(var(--accent-rgb), 0.12);
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-m);
            padding: 0.45rem 0.6rem;
            margin-bottom: 0.5rem;
        }

        .note-draft-text {
            flex: 1 1 12rem;
            color: var(--text);
        }

        .note-draft-buttons {
            display: flex;
            gap: 0.4rem;
        }

        .note-input {
            display: block;
            width: 100%;
            min-height: calc(4 * 1.5em + 0.9rem);
            resize: vertical;
            font-family: inherit;
            font-size: calc(0.95rem * var(--reading-scale));
            line-height: 1.5;
            color: var(--text);
            background: var(--option-bg);
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-m);
            padding: 0.4rem 0.5rem;
        }

        .note-input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        .note-error {
            font-size: 0.85rem;
            font-weight: bold;
            margin: 0.4rem 0 0;
        }

        .note-error:empty {
            display: none;
        }

        .note-length {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 0.25rem;
        }

        .note-length:empty {
            display: none;
        }

        .note-buttons .note-delete {
            margin-left: auto;
        }

        .note-discard-question {
            margin-right: auto;
            font-weight: bold;
        }

        .import-confirm:disabled.note-save {
            cursor: not-allowed;
        }

        /* A short window: the passage gets two lines, and the rest
           tightens up, so the note keeps its four. */
        @media (max-height: 520px) {
            .note-panel .modal-body {
                padding-top: 0.8rem;
            }

            .note-title {
                font-size: 1.1rem;
                margin-bottom: 0.3rem;
            }

            .note-passage {
                max-height: calc(2 * 1.55em);
            }

            .note-text-shown {
                margin-bottom: 0.4rem;
            }

            .note-others {
                margin-bottom: 0.4rem;
            }
        }

        /* Export notes: a button at the top of the Library's Notes tab,
           and a small modal (the note panel's look) to choose which notes:
           some books (a checklist that scrolls inside the dialog), one
           book's chapters, and when they were written. Like the rest of
           the UI it doesn't grow with the reading text size. */
        .export-notes-btn {
            flex: 0 0 auto;
        }

        /* The Notes tab's search box, beside Export notes…: it filters the
           list as it's typed (ui-leptos/src/library.rs), says how many of
           how many it shows under it, and marks what it found in each row
           in the search results' own mark. */
        .note-tools {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.6rem;
        }

        .note-search {
            flex: 1 1 9rem;
            min-width: 0;
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--text);
            background: var(--panel-bg);
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-m);
            padding: 0.35rem 0.6rem;
        }

        .note-search::placeholder {
            color: var(--text-dim);
        }

        .note-search:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .note-search-count {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin: -0.2rem 0 0.4rem;
        }

        .note-search-count:empty {
            display: none;
        }

        .note-search-mark {
            background: rgba(var(--accent-rgb), 0.3);
            color: inherit;
            border-radius: var(--radius-s);
        }

        .export-notes-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .export-notes-panel {
            width: min(26rem, 100%);
        }

        .export-notes-text {
            font-size: 0.9rem;
            margin-bottom: 0.6rem;
        }

        .export-notes-group {
            border: none;
            padding: 0;
            margin: 0 0 0.7rem;
            min-width: 0;
        }

        .export-notes-legend {
            font-size: 0.85rem;
            color: var(--text-dim);
            padding: 0;
            margin-bottom: 0.3rem;
        }

        .export-notes-tools {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 0.3rem;
        }

        .export-notes-tools .reader-mode-btn {
            width: auto;
            font-size: 0.8rem;
            padding: 0.1rem 0.7rem;
        }

        .export-notes-books {
            position: relative;
            max-height: 9.6rem;
            overflow-y: auto;
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-m);
            padding: 0.2rem 0.55rem;
        }

        .export-notes-book-option {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.9rem;
            padding: 0.15rem 0;
            cursor: pointer;
        }

        .export-notes-book-count {
            color: var(--text-dim);
        }

        .export-notes-books input {
            flex: none;
            accent-color: var(--accent);
        }

        .export-notes-range {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.4rem 0.9rem;
        }

        .export-notes-range label {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.9rem;
        }

        .export-notes-range[hidden] {
            display: none;
        }

        .export-notes-dates {
            margin-top: 0.45rem;
        }

        /* The chapter and date fields: themed like the select, the text
           and the platform's own date controls in --text on the opaque
           --option-bg (the theme's color-scheme keeps the calendar
           button legible). */
        .export-notes-field {
            font-family: inherit;
            font-size: 0.9rem;
            line-height: 1.4;
            color: var(--text);
            background-color: var(--option-bg);
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-m);
            padding: 0.25rem 0.45rem;
        }

        .export-notes-field[type="number"] {
            width: 4.6rem;
        }

        .export-notes-field:hover {
            border-color: var(--accent);
        }

        .export-notes-count {
            font-size: 0.9rem;
            font-weight: bold;
            margin: 0.3rem 0 0;
        }

        .export-notes-count:empty {
            display: none;
        }

        /* The Written list: themed like the app's other controls, not the
           platform's grey. --text on the opaque --option-bg (AA in every
           theme, see the palette tests), with its chevron drawn in
           --accent from two gradients, so it takes each theme's color. The
           list it opens is still the platform's, kept legible by the
           theme's color-scheme and --option-bg (see the top of this
           stylesheet). */
        .export-notes-select {
            -webkit-appearance: none;
            appearance: none;
            max-width: 100%;
            font-family: inherit;
            font-size: 0.9rem;
            line-height: 1.4;
            color: var(--text);
            background-color: var(--option-bg);
            background-image:
                linear-gradient(45deg, transparent 50%, var(--accent) 50%),
                linear-gradient(135deg, var(--accent) 50%, transparent 50%);
            background-position:
                right 0.95rem center,
                right 0.6rem center;
            background-size: 0.35rem 0.35rem;
            background-repeat: no-repeat;
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-m);
            padding: 0.3rem 1.8rem 0.3rem 0.55rem;
            cursor: pointer;
        }

        .export-notes-select:hover {
            border-color: var(--accent);
        }

        .export-notes-select option {
            color: var(--text);
            background-color: var(--option-bg);
        }

        .export-notes-books input:focus-visible,
        .export-notes-select:focus-visible,
        .export-notes-field:focus-visible,
        .export-notes-tools .reader-mode-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* Export stays disabled while nothing matches. */
        .export-notes-panel .import-confirm:disabled {
            cursor: not-allowed;
        }

        .import-confirm:focus-visible,
        .import-panel input:focus-visible,
        .import-panel .reader-mode-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .bookmark-list {
            list-style: none;
            max-height: 16rem;
            overflow-y: auto;
        }

        /* A row opens its passage wherever it's clicked (the open button
           fills it; the rest forwards), so the whole row lights up. */
        .bookmark-item {
            display: flex;
            align-items: flex-start;
            gap: 0.3rem;
            border-bottom: 1px solid var(--accent-dim);
            cursor: pointer;
        }

        .bookmark-item:has(.bookmark-open):hover {
            background: rgba(var(--accent-rgb), 0.12);
        }

        .bookmark-open {
            align-self: stretch;
            flex: 1 1 auto;
            min-width: 0;
            text-align: left;
            font-family: inherit;
            color: var(--text);
            background: none;
            border: none;
            padding: 0.4rem 0.2rem;
            cursor: pointer;
        }

        .bookmark-ref {
            display: block;
            font-size: 0.85rem;
            color: var(--accent);
        }

        /* Two lines of the stored text at most: clipped visually, never
           shortened. */
        .bookmark-preview {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            overflow: hidden;
            font-size: 0.75rem;
            line-height: 1.35;
            color: var(--text-dim);
        }

        .bookmark-preview.is-missing,
        .bookmark-partial {
            font-style: italic;
        }

        .bookmark-partial {
            display: block;
            font-size: 0.7rem;
            color: var(--text-dim);
        }

        .bookmark-remove {
            flex: 0 0 auto;
            font-family: inherit;
            font-size: 1.1rem;
            line-height: 1;
            color: var(--text-dim);
            background: none;
            border: 1px solid transparent;
            border-radius: var(--radius-s);
            padding: 0.3rem 0.45rem;
            cursor: pointer;
        }

        .bookmark-remove:hover {
            color: var(--accent);
            border-color: var(--accent-dim);
        }

        /* My notes: the Bookmarks list's look, with the start of each note
           (two lines, clipped visually, never shortened) in place of the
           verse text, and a small Edit beside it. */
        .note-preview {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            overflow: hidden;
            overflow-wrap: anywhere;
            font-size: 0.75rem;
            line-height: 1.35;
            color: var(--text-dim);
        }

        .note-list-edit {
            flex: 0 0 auto;
            font-family: inherit;
            font-size: 0.8rem;
            color: var(--text-dim);
            background: none;
            border: 1px solid transparent;
            border-radius: var(--radius-s);
            padding: 0.35rem 0.45rem;
            cursor: pointer;
        }

        .note-list-edit:hover {
            color: var(--accent);
            border-color: var(--accent-dim);
        }

        .bookmark-empty {
            font-size: 0.8rem;
            font-style: italic;
            color: var(--text-dim);
        }

        .bookmark-empty.is-error {
            color: var(--text);
            font-style: normal;
            font-weight: bold;
        }

        /* My highlights: the Bookmarks list's look, with each passage's
           color shown as a swatch and named in words, so color is never
           the only cue. The swatch is outlined in --text-dim, so it shows
           on --option-bg even where a highlighter color is close to it. */
        .highlight-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-bottom: 0.4rem;
        }

        .highlight-filter-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-family: inherit;
            font-size: 0.75rem;
            color: var(--accent);
            background: var(--panel-bg);
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-m);
            padding: 0.2rem 0.45rem;
            cursor: pointer;
        }

        .highlight-filter-btn:hover {
            border-color: var(--accent);
        }

        .highlight-filter-btn[aria-pressed="true"] {
            background: var(--accent);
            color: var(--on-accent);
        }

        .highlight-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 0.4rem;
        }

        .highlight-color {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.7rem;
            color: var(--text-dim);
        }

        .highlight-dot {
            flex: 0 0 auto;
            width: 0.7rem;
            height: 0.7rem;
            border: 1px solid var(--text-dim);
            border-radius: 50%;
        }

        .highlight-dot[data-color="yellow"] {
            background: var(--hl-yellow);
        }

        .highlight-dot[data-color="green"] {
            background: var(--hl-green);
        }

        .highlight-dot[data-color="blue"] {
            background: var(--hl-blue);
        }

        .highlight-dot[data-color="pink"] {
            background: var(--hl-pink);
        }

        /* One line of the stored text, clipped visually, never shortened. */
        #highlight-list .bookmark-preview {
            -webkit-line-clamp: 1;
            line-clamp: 1;
        }

        /* The version line under the name in About. --text-dim on the
           dialog's --option-bg meets AA in every theme (see the palette
           tests). The line keeps its height while empty, so filling it in
           never moves anything. */
        .app-version {
            font-size: 0.85rem;
            line-height: 1.4;
            min-height: 1.4em;
            color: var(--text-dim);
        }

        /* Updates, in About: the launch-check checkbox, Check now and its
           status line. */
        .update-check-option {
            display: flex;
            align-items: flex-start;
            gap: 0.4rem;
            font-size: 0.9rem;
            line-height: 1.35;
            color: var(--text);
            margin-bottom: 0.2rem;
            cursor: pointer;
        }

        .update-check-option input {
            margin-top: 0.15rem;
            accent-color: var(--accent);
        }

        .update-check-option input:focus-visible,
        .update-banner summary:focus-visible,
        .update-banner:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* "A new version is available": a notice, not a dialog. It sits at
           the foot of the window over the page, which stays usable, until
           the reader acts on it or chooses Later. Its text is --text,
           --text-dim and --accent on the opaque --option-bg, which meet AA
           in every theme (see the palette tests). The notes scroll inside
           it, so the buttons stay in view in a small window. */
        .update-banner:not([hidden]) {
            position: fixed;
            left: 50%;
            bottom: 1rem;
            transform: translateX(-50%);
            z-index: 35;
            display: block;
            width: min(30rem, calc(100vw - 2rem));
            max-height: calc(100vh - 2rem);
            overflow-y: auto;
            background: var(--option-bg);
            color: var(--text);
            border: 1px solid var(--accent);
            border-radius: var(--radius-l);
            padding: 0.8rem 1rem;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
        }

        .update-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 0.4rem;
        }

        .update-banner details {
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
        }

        .update-banner summary {
            color: var(--accent);
            cursor: pointer;
        }

        .update-notes-text {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.4;
            color: var(--text);
            max-height: 10rem;
            overflow-y: auto;
            margin-top: 0.3rem;
        }

        .update-progress:not([hidden]) {
            display: block;
            width: 100%;
            height: 0.6rem;
            margin: 0.2rem 0 0.4rem;
            accent-color: var(--accent);
        }

        .update-status {
            font-size: 0.8rem;
            line-height: 1.4;
            color: var(--text-dim);
            margin-bottom: 0.5rem;
        }

        .update-status:empty {
            display: none;
        }

        .update-status.is-error {
            color: var(--text);
            font-weight: bold;
        }

        .update-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .update-actions .reader-mode-btn {
            width: auto;
        }

        .bar-btn:focus-visible,
        .ref-btn:focus-visible,
        .picker-random:focus-visible,
        .book-item:focus-visible,
        .chapter-btn:focus-visible,
        .stepper-btn:focus-visible,
        .panel-close:focus-visible,
        .library-tab:focus-visible,
        .about-links a:focus-visible,
        .search-input:focus-visible,
        .note-search:focus-visible,
        .search-more:focus-visible,
        .bookmark-open:focus-visible,
        .bookmark-remove:focus-visible,
        .highlight-filter-btn:focus-visible,
        .verse-bookmark-btn:focus-visible,
        .reader-mode-btn:focus-visible,
        .reader-exit:focus-visible,
        .xref-citation:focus-visible,
        .xref-preview-go:focus-visible,
        .xref-summary-chip:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .reader-mode-btn,
        .reader-exit,
        .search-more {
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--accent);
            background: var(--panel-bg);
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-m);
            padding: 0.35rem 0.7rem;
            cursor: pointer;
        }

        .reader-mode-btn {
            width: 100%;
        }

        .reader-mode-btn[aria-pressed="true"] {
            background: var(--accent);
            color: var(--on-accent);
        }

        .reader-mode-btn:hover,
        .reader-exit:hover {
            border-color: var(--accent);
        }

        /* Distraction-free reading mode: everything but the chapter being
           read is hidden, except the translation and Aa (so the
           translation, text size and spacing stay adjustable), search, and
           an always-visible exit button — the reader can never get stuck
           in this mode. The exit button sits in the top bar, before the
           translation. The mode is purely presentational:
           #reading-pane-inner and its prev/next data are untouched, so
           arrow-key navigation keeps working. */
        .reader-exit {
            display: inline-flex;
            align-items: center;
            gap: 0.3em;
            height: 2.35rem;
            padding: 0 0.8rem;
            white-space: nowrap;
        }
