# Trunk builds the page: ui/index.html with its Rust pieces (ui-leptos/)
# compiled to WebAssembly, into dist/, which Tauri embeds (frontendDist in
# src-tauri/tauri.conf.json). Tauri runs it (beforeDevCommand and
# beforeBuildCommand); `npm test` in tests/frontend runs it too, since the
# frontend tests load the built .wasm. See ui-leptos/README.md.
[build]
target = "ui/index.html"
dist = "dist"
# Stable names (ui-leptos.js, ui-leptos_bg.wasm): the page's own loader and
# the test harness name them.
filehash = false
# The page's three inline scripts and its stylesheet are hashed into the
# Content Security Policy as they are; keep them as they are.
minify = "never"
# Trunk's loader is an ES module import, which the no-modules glue the test
# harness needs can't be loaded by; the page inlines its own loader instead
# (ui/leptos-loader.js).
inject_scripts = false
# Built from ui-leptos/Cargo.lock as committed (cargo build --locked), never
# a fresh resolution: the page an installer embeds is the one CI tested,
# and the AUR recipe's `cargo fetch --locked` stays in step.
locked = true

# The tools' versions. wasm-bindgen's is the crate's in ui-leptos/Cargo.lock,
# which Trunk reads itself. wasm-opt's is pinned here (Trunk's own default for
# 0.21.14), so Trunk uses exactly this one, never another wasm-opt on PATH; CI
# fetches the same release (tools/ci/build-tools.txt).
[tools]
wasm_opt = "version_123"
