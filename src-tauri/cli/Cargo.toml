[package]
name = "gospel-getter-cli"
# The app's version: tests/packaging_config.rs fails if they differ.
version = "2.24.0"
description = "Read a Gospel Getter install from the command line or an MCP client, read-only"
license = "MIT"
repository = "https://github.com/tossbaws/gospel-getter"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
# The app's own database and domain logic, free of Tauri, so this program
# links neither GTK nor WebKit.
gospel_getter_core = { path = "../core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Where the app's data folder is, as Tauri resolves it, without starting Tauri.
dirs = "7"
# The official MCP SDK: stdio only, no HTTP or client features.
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt", "macros"] }
# Logs of the MCP server, on stderr: stdout carries only its protocol.
tracing-subscriber = "0.3"

[dev-dependencies]
# Disposable prepared databases (`db::test_support`), seeded by the app's code.
gospel_getter_core = { path = "../core", features = ["test-support"] }
