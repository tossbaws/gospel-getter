[package]
name = "gospel_getter"
version = "2.7.0"
description = "Read the Bible, book by book, chapter by chapter"
license = "MIT"
repository = "https://github.com/tossbaws/gospel-getter"
edition = "2024"

# The app's code lives in the library, so the frontend test bridge
# (`examples/frontend_bridge.rs`) can drive the real commands; `main.rs`
# just calls `gospel_getter_lib::run`.
[lib]
name = "gospel_getter_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-dialog = "~2.7"
semver = "1"

# Desktop only: the in-app updater, and opening the releases page in the
# system browser for builds that can't update themselves. See `updater.rs`.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "~2.13"
tauri-plugin-opener = "~2.7"

# Only for `examples/frontend_bridge.rs` (the frontend tests' stdio bridge);
# the app itself doesn't read stdin.
[dev-dependencies]
tokio = { version = "1", features = ["io-std", "io-util"] }
# Tauri's mock runtime, for driving the commands through real IPC in tests.
tauri = { version = "2", features = ["test"] }
# A real connection error, for the updater's "offline" message (`updater.rs`);
# already a dependency of tauri-plugin-updater.
reqwest = { version = "0.13", default-features = false }
# The TLS provider the updater installs before its own requests.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
