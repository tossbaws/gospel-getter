[package]
name = "gospel_getter"
version = "2.16.2"
description = "Read the Bible, book by book, chapter by chapter"
license = "MIT"
repository = "https://github.com/tossbaws/gospel-getter"
edition = "2024"

# The app's code lives in the library, so the frontend test bridge
# (`examples/frontend_bridge.rs`) can drive the real commands; `main.rs`
# just calls `gospel_getter_lib::run`.
[lib]
name = "gospel_getter_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# `time`: the search index build's pauses between tries (`retry.rs`).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-dialog = "~2.7"
semver = "1"
# Dates in the reader's own time zone, for the notes export (`notes_export`).
# Only `clock` (which brings `Local`) and `serde` (its date filters arrive
# from, and its date presets go to, the frontend as "YYYY-MM-DD"); the rest
# of chrono's defaults aren't needed.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }

# Desktop only: the in-app updater, and opening the releases page in the
# system browser for builds that can't update themselves. See `updater.rs`.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# The plugin's defaults without `zip`, which only unpacks Tauri v1's zipped
# (Windows) and .tar.gz (AppImage) update bundles. Ours are published as they
# are (`createUpdaterArtifacts: true`): the .exe, .msi, .AppImage and .deb.
tauri-plugin-updater = { version = "~2.13", default-features = false, features = ["rustls-tls", "system-proxy"] }
# Opens a fixed URL in the system browser, as tauri-plugin-opener's
# `open_url` does on the desktop (with the same feature), without the
# plugin's D-Bus dependency for revealing files, which the app never does.
open = { version = "5", features = ["shellexecute-on-windows"] }
# The window comes back where it was (see `window.rs`).
tauri-plugin-window-state = "~2.5"

# Only for `examples/frontend_bridge.rs` (the frontend tests' stdio bridge);
# the app itself doesn't read stdin.
[dev-dependencies]
tokio = { version = "1", features = ["io-std", "io-util"] }
# Tauri's mock runtime, for driving the commands through real IPC in tests.
tauri = { version = "2", features = ["test"] }
# A real connection error, for the updater's "offline" message (`updater.rs`);
# already a dependency of tauri-plugin-updater.
reqwest = { version = "0.13", default-features = false }
# The TLS provider the updater installs before its own requests.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Only for the BSB's ingest (`examples/bsb_ingest.rs`, `tests/bsb_source.rs`):
# reading Berean's USFM zip and checking the raw files' hashes. zip turns
# off flate2's defaults, so its pure-Rust backend is named here.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.10"
