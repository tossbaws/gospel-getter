[package]
name = "gui-check"
version = "0.1.0"
edition = "2024"
publish = false
description = "Gospel Getter's GUI smoke checks: drive the real app through tauri-driver (WebDriver)"
license = "MIT"

[dependencies]
anyhow = "1"
# The updater checks' own update server (src/update_server.rs): a signing
# key made for each run, and the signature as the app reads it (base64).
base64 = "0.22"
minisign = "0.7"
serde_json = "1"
# Only the WebDriver client over plain HTTP to tauri-driver on 127.0.0.1:
# no driver manager (downloads), no TLS, no Chrome DevTools.
thirtyfour = { version = "0.37.8", default-features = false, features = ["reqwest"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "fs", "net", "io-util"] }

[features]
# A test of scripts/gui-check.sh's retry, by hand: GUI_CHECK_FORCE_FAIL
# fails the checks it names (src/report.rs). Off unless asked for; CI never
# turns it on, and the checks never ship in an installer.
force-fail = []

# Windows: gui-launch ties the app to itself with a job object, and the
# checks make sure each app it started has exited before the next starts
# (src/launched.rs). Already in the tree through tokio.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
